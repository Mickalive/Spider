worker_processes 1;
error_log /tmp/opencode/exp35551516706_nginx_root/logs/error.log warn;
pid /tmp/opencode/exp35551516706_nginx_root/logs/nginx.pid;
events { worker_connections 128; }
http {
    access_log off;
    gzip off;
    proxy_cache_path /tmp/opencode/exp35551516706_nginx_root/cache levels=1:2 keys_zone=spider:16m max_size=512m inactive=10m use_temp_path=off;
    server {
        listen 127.0.0.1:18080;
        server_name localhost;
        location / {
            proxy_pass http://127.0.0.1:18794;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_cache spider;
            proxy_cache_key $request_uri;
            proxy_cache_valid 200 5m;
            proxy_buffering on;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
