name: SPIDER R2 Physics Wakeup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-physics-wakeup.yml"

permissions:
  contents: read
  actions: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pulse factory; active lanes are deduplicated
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run factory-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main
