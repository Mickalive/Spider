name: SPIDER Lane Repair Supervisor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Graph Lane"
      - "SPIDER Physics Lane"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lane-repair-supervisor.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: spider-lane-repair-supervisor
  cancel-in-progress: true

jobs:
  recover_revise_cycles:
    name: Recover audited REVISE cycles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch missing same-cycle repairs from audit evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          handle_lane() {
            local lane="$1" workflow="$2" upper="$3"
            local active latest run_id audit_branch gate_path gate_raw gate repair cycle

            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [[ "$active" -gt 0 ]]; then
              echo "$lane: lane already active; no duplicate repair."
              return 0
            fi

            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 1 \
              --json databaseId,status,conclusion 2>/dev/null || echo '[]')
            run_id=$(jq -r '.[0].databaseId // empty' <<<"$latest")
            [[ -n "$run_id" ]] || { echo "$lane: no prior run."; return 0; }

            audit_branch="cycle/${lane}/${run_id}/audit"
            if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${audit_branch//\//%2F}" >/dev/null 2>&1; then
              echo "$lane: latest run $run_id has no persisted audit branch; same-cycle supervisor has nothing authoritative to route."
              return 0
            fi

            gate_path="results/audit/CYCLE_${run_id}_${upper}_GATE.json"
            gate_raw=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${gate_path}?ref=${audit_branch}" 2>/dev/null || true)
            gate=$(jq -r '.gate // empty' <<<"$gate_raw" 2>/dev/null || true)

            case "$gate" in
              REVISE)
                repair=$(jq -r '(.repair_round // .repair_round_audited // 0) + 1' <<<"$gate_raw" 2>/dev/null || echo 1)
                cycle=$(jq -r 'if (.cycle|type)=="number" then .cycle else 1 end' <<<"$gate_raw" 2>/dev/null || echo 1)
                echo "::warning::$lane: latest audit for run $run_id is REVISE and no lane run is active; dispatching same-cycle repair round $repair on current main."
                gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
                  -f human_note="AUTOMATIC SAME-CYCLE RECOVERY from persisted independent audit run $run_id. Repair only the exact required_fixes; preserve frozen hypotheses, preregistration, negative outcomes and provenance. This is not permission to weaken the test." \
                  -f cycle_index="$cycle" \
                  -f max_cycles=0 \
                  -f repair_from_run_id="$run_id" \
                  -f repair_round="$repair"
                ;;
              PASS)
                echo "$lane: latest persisted audit is PASS. Same-cycle supervisor does not modify audited evidence; Director/integration continuity is handled by the lane workflow/control plane."
                ;;
              BLOCKED)
                echo "$lane: latest persisted audit is BLOCKED; no automatic repair."
                ;;
              *)
                echo "$lane: no valid machine-readable audit gate on latest run $run_id."
                ;;
            esac
          }

          handle_lane graph graph-loop.yml GRAPH
          handle_lane physics physics-loop.yml PHYSICS
