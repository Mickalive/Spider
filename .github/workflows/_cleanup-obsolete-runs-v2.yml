name: SPIDER Cleanup Obsolete Runs V2

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/cleanup-obsolete-runs-v2.json'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inventory and delete obsolete completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider/maintenance
          python3 - <<'PY'
          import json, os, subprocess, datetime

          repo = os.environ['GITHUB_REPOSITORY']
          self_id = int(os.environ['GITHUB_RUN_ID'])

          raw = subprocess.check_output([
              'gh','api',f'repos/{repo}/actions/runs?per_page=100'
          ], text=True)
          runs = json.loads(raw)['workflow_runs']

          protected = {32689296167, 32689298051, self_id}
          current_lane_names = {'SPIDER Graph Lane', 'SPIDER Physics Lane'}

          for name in current_lane_names:
              completed = sorted(
                  [r for r in runs if r.get('name') == name and r.get('status') == 'completed'],
                  key=lambda r: r.get('created_at') or '', reverse=True
              )[:2]
              protected.update(r['id'] for r in completed)

          metas = sorted(
              [r for r in runs if r.get('name') == 'SPIDER Meta Sync' and r.get('status') == 'completed'],
              key=lambda r: r.get('created_at') or '', reverse=True
          )
          if metas:
              protected.add(metas[0]['id'])

          disposable_exact = {
              'SPIDER Graph Lane', 'SPIDER Physics Lane', 'SPIDER Launcher — Graph + Physics',
              'SPIDER Meta Sync', 'SPIDER Ox Watchdog', 'SPIDER Research Program Supervisor',
              'SPIDER Multi-Runner Lab', 'SPIDER Lab', 'SPIDER Autonomous Lab — Launch',
              'SPIDER Launch Bridge'
          }
          disposable_tokens = ('Install','Cleanup','Resume','Network','Audit Repair','Recommended','Fix Orchestration')

          deleted, kept = [], []
          for r in runs:
              slim = {k:r.get(k) for k in ('id','name','status','conclusion','created_at','updated_at','event','head_branch','run_number','run_attempt')}
              rid, name, status = r['id'], r.get('name') or '', r.get('status')
              if status != 'completed' or rid in protected:
                  kept.append(slim)
                  continue

              disposable = name in disposable_exact or (name.startswith('SPIDER') and any(tok in name for tok in disposable_tokens))
              if not disposable:
                  kept.append(slim)
                  continue

              print(f'Deleting obsolete run {rid} [{name}] {r.get("conclusion")}')
              proc = subprocess.run(['gh','api','-X','DELETE',f'repos/{repo}/actions/runs/{rid}'])
              if proc.returncode == 0:
                  deleted.append(slim)
              else:
                  kept.append(slim)

          receipt = {
              'cleaned_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'protected_ids': sorted(protected),
              'deleted_count': len(deleted),
              'deleted': deleted,
              'kept_count': len(kept),
              'kept': kept,
          }
          with open('.spider/maintenance/obsolete-runs-cleanup-receipt.json','w',encoding='utf-8') as f:
              json.dump(receipt,f,indent=2)
          PY

      - name: Self-clean and commit receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_cleanup-obsolete-runs-v2.yml
          rm -f .spider/maintenance/cleanup-obsolete-runs-v2.json
          git pull --rebase origin main
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "maintenance: clean obsolete Actions history"
          git push origin HEAD:main
