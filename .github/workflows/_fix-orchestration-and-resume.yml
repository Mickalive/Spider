name: SPIDER Fix Orchestration And Resume

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/fix-orchestration-and-resume.json'

permissions:
  actions: write
  contents: write

jobs:
  fix_and_resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch repair routers to be repo-explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              (Path('.github/workflows/graph-loop.yml'), 'graph-loop.yml'),
              (Path('.github/workflows/physics-loop.yml'), 'physics-loop.yml'),
          ]
          for path, wf in targets:
              text = path.read_text()
              old = f'gh workflow run {wf} --ref main \\\n'
              new = f'gh workflow run {wf} --repo "$GITHUB_REPOSITORY" --ref main \\\n'
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{path}: expected at least one repo-implicit dispatch, found {count}')
              text = text.replace(old, new)
              path.write_text(text)
              print(f'{path}: patched {count} dispatch call(s)')
          PY

      - name: Commit router hardening before resuming research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add .github/workflows/graph-loop.yml .github/workflows/physics-loop.yml
          git commit -m "workflow: make lane dispatches repository-explicit"
          git push origin HEAD:main

      - name: Resume stalled Graph repair and consume Physics successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider/program-receipts .spider/maintenance
          jq -n '{graph:null,physics:null}' > /tmp/resume.json

          graph_active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-loop.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
          if [[ "$graph_active" -eq 0 ]]; then
            OUT=$(gh workflow run graph-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f human_note='AUTO RECOVERY: prior audit run 32689296167 returned REVISE with textual-only required_fixes RF-1..RF-3. Apply the exact audit corrections; do not rerun or alter scientific outcomes unless required by the audit.' \
              -f cycle_index=2 \
              -f max_cycles=0 \
              -f repair_from_run_id=32689296167 \
              -f repair_round=1)
            printf '%s\n' "$OUT"
            jq --arg out "$OUT" '.graph={action:"dispatched_repair",output:$out}' /tmp/resume.json > /tmp/r && mv /tmp/r /tmp/resume.json
          else
            jq --argjson n "$graph_active" '.graph={action:"skipped_active",active:$n}' /tmp/resume.json > /tmp/r && mv /tmp/r /tmp/resume.json
          fi

          physics_active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow physics-loop.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
          receipt=.spider/program-receipts/physics-32689298051.json
          if [[ -f "$receipt" ]]; then
            jq '.physics={action:"already_consumed"}' /tmp/resume.json > /tmp/r && mv /tmp/r /tmp/resume.json
          elif [[ "$physics_active" -eq 0 ]]; then
            OUT=$(gh workflow run physics-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f human_note='AUTO PROGRAM SUCCESSION from Director run 32689298051. Program within-site-dynamics-interventional: deliberate restart/matched-state intervention. Follow accepted directives/PHYSICS.md; first cycle WP-006 tests ONLY identifiability H-ID under frozen floors, not committor claims yet.' \
              -f cycle_index=1 \
              -f max_cycles=0)
            printf '%s\n' "$OUT"
            jq -n '{lane:"physics",completed_program_run_id:"32689298051",next_program_id:"within-site-dynamics-interventional",next_program_title:"Within-site dynamical structure by deliberate restart/matched-state intervention",dispatched_at:(now|todate)}' > "$receipt"
            jq --arg out "$OUT" '.physics={action:"dispatched_successor",output:$out}' /tmp/resume.json > /tmp/r && mv /tmp/r /tmp/resume.json
          else
            jq --argjson n "$physics_active" '.physics={action:"skipped_active",active:$n}' /tmp/resume.json > /tmp/r && mv /tmp/r /tmp/resume.json
          fi

          cp /tmp/resume.json .spider/maintenance/orchestration-resume-receipt.json

      - name: Record receipt and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_fix-orchestration-and-resume.yml
          rm -f .spider/maintenance/fix-orchestration-and-resume.json
          git pull --rebase origin main
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "maintenance: record orchestration recovery and remove one-shot"
          git push origin HEAD:main
