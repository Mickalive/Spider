name: SPIDER Actions Data Migration

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum substantive completed runs to archive this pass"
        required: false
        default: "40"
        type: string
  schedule:
    - cron: "5,35 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-data-migration.yml'
      - 'evidence/run-archive/README.md'

permissions:
  actions: read
  contents: write

concurrency:
  group: spider-actions-data-migration
  cancel-in-progress: false

env:
  ARCHIVE_RELEASE_TAG: spider-actions-data-archive-v1
  DEFAULT_BATCH_SIZE: "40"

jobs:
  inventory:
    name: Inventory old substantive runs not yet archived
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.select.outputs.count }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure durable archive release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$ARCHIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$ARCHIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SPIDER lossless GitHub Actions data archive v1" \
              --notes "Lossless pre-deletion archive of substantive SPIDER Actions runs. Each asset is checksum-verified before its manifest is committed. Deletion remains separately gated on semantic distillation."
          fi

      - id: select
        name: Select oldest substantive completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BATCH: ${{ inputs.batch_size || '' }}
        shell: bash
        run: |
          set -euo pipefail
          batch="${REQUESTED_BATCH:-$DEFAULT_BATCH_SIZE}"
          [[ "$batch" =~ ^[0-9]+$ ]] || batch="$DEFAULT_BATCH_SIZE"
          (( batch > 0 && batch <= 100 )) || batch="$DEFAULT_BATCH_SIZE"

          rows=$(mktemp)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.created_at,.id,.name,.path] | @tsv' | sort > "$rows"

          : > /tmp/selected_ids
          while IFS=$'\t' read -r created id name path; do
            manifest="evidence/run-archive/manifests/${id}.json"
            if [[ -f "$manifest" ]] && jq -e '.archive_complete == true' "$manifest" >/dev/null 2>&1; then
              continue
            fi

            substantive=false
            case "$name" in
              "SPIDER Graph Lane"|\
              "SPIDER Physics Lane"|\
              "SPIDER Intel Research Lane"|\
              "SPIDER Runtime Lane"|\
              "SPIDER Product and Beta Lane"|\
              "SPIDER Product Beta Repair"|\
              "SPIDER Product Engineering Loop"|\
              "SPIDER Product Engineering Failure Review"|\
              "SPIDER Critical CTO Council"|\
              "SPIDER Frontier Research Team") substantive=true ;;
            esac

            # Historical names may differ. An existing non-operational curator
            # record is also authoritative evidence that the run carried data.
            record="evidence/run-memory/runs/${id}.json"
            if [[ -f "$record" ]]; then
              class=$(jq -r '.evidence_class // "OTHER"' "$record" 2>/dev/null || echo OTHER)
              case "$class" in SCIENTIFIC|PRODUCT|RUNTIME|INTEL|CTO|FRONTIER) substantive=true ;; esac
            fi

            [[ "$substantive" == true ]] || continue
            echo "$id" >> /tmp/selected_ids
            [[ "$(wc -l < /tmp/selected_ids)" -ge "$batch" ]] && break
          done < "$rows"

          ids=$(jq -Rsc 'split("\n") | map(select(length>0) | tonumber)' /tmp/selected_ids)
          matrix=$(jq -cn --argjson ids "$ids" '{run_id:$ids}')
          count=$(jq 'length' <<<"$ids")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Selected $count substantive run(s) for lossless archive: $(tr '\n' ' ' < /tmp/selected_ids)"

  archive_run:
    name: Lossless archive run ${{ matrix.run_id }}
    needs: inventory
    if: needs.inventory.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Capture exact Actions payload, artefacts and Git refs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ matrix.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          id="$RUN_ID"
          d="/tmp/spider-actions-archive/$id"
          mkdir -p "$d/artifacts"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" > "$d/run.json"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" > "$d/jobs-pages.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" > "$d/artifacts.json"

          # Raw GitHub log ZIP, not an LLM summary. If this cannot be recovered,
          # this run is NOT archive-complete and therefore can never be deleted.
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/logs" \
            -o "$d/actions-logs.zip"
          test -s "$d/actions-logs.zip"

          # Human-readable combined log is redundant but useful for future
          # recovery without unpacking job logs. Failure here is non-fatal
          # because actions-logs.zip is the lossless authority.
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --log > "$d/logs-readable.txt" 2> "$d/logs-readable.err" || true

          artifact_count=$(jq -r '.total_count // 0' "$d/artifacts.json")
          if (( artifact_count > 0 )); then
            while IFS=$'\t' read -r aid aname; do
              [[ -n "$aid" ]] || continue
              safe=$(printf '%s' "$aname" | tr -cs 'A-Za-z0-9._-' '_')
              out="$d/artifacts/${aid}_${safe}.zip"
              curl --fail --location --retry 3 --retry-all-errors \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
                -o "$out"
              test -s "$out"
            done < <(jq -r '.artifacts[]? | [.id,.name] | @tsv' "$d/artifacts.json")
          fi

          # Capture every branch/tag whose ref contains the run id as a Git
          # bundle, so cycle snapshots survive even if refs are cleaned later.
          git ls-remote origin | awk -v id="$id" 'index($2,id)>0 {print $1"\t"$2}' > "$d/refs.tsv" || true
          : > "$d/bundle-refs.txt"
          n=0
          while IFS=$'\t' read -r sha ref; do
            [[ -n "${ref:-}" ]] || continue
            n=$((n+1))
            local_ref="refs/archive-src/${id}/${n}"
            git fetch -q origin "$ref:$local_ref"
            printf '%s\t%s\t%s\n' "$sha" "$ref" "$local_ref" >> "$d/fetched-refs.tsv"
            echo "$local_ref" >> "$d/bundle-refs.txt"
          done < "$d/refs.tsv"
          if (( n > 0 )); then
            mapfile -t bref < "$d/bundle-refs.txt"
            git bundle create "$d/related-refs.bundle" "${bref[@]}"
            git bundle verify "$d/related-refs.bundle"
          fi

          if [[ -f "evidence/run-memory/runs/${id}.json" ]]; then
            cp "evidence/run-memory/runs/${id}.json" "$d/semantic-record-at-archive.json"
          fi

          (
            cd "$d"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

          bundle="/tmp/run-${id}.tar.gz"
          tar -C "$(dirname "$d")" -czf "$bundle" "$id"
          sha256sum "$bundle" > "/tmp/run-${id}.tar.gz.sha256"
          echo "ARCHIVE_BUNDLE=$bundle" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA=$(awk '{print $1}' /tmp/run-${id}.tar.gz.sha256)" >> "$GITHUB_ENV"
          echo "ARTIFACT_COUNT=$artifact_count" >> "$GITHUB_ENV"
          echo "REF_COUNT=$n" >> "$GITHUB_ENV"

      - name: Upload to repo Release and verify byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ matrix.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset="run-${RUN_ID}.tar.gz"
          gh release upload "$ARCHIVE_RELEASE_TAG" "$ARCHIVE_BUNDLE#$asset" --clobber --repo "$GITHUB_REPOSITORY"
          mkdir -p /tmp/archive-verify
          rm -f "/tmp/archive-verify/$asset"
          gh release download "$ARCHIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir /tmp/archive-verify
          downloaded=$(sha256sum "/tmp/archive-verify/$asset" | awk '{print $1}')
          [[ "$downloaded" == "$ARCHIVE_SHA" ]] || { echo "::error::Release asset checksum mismatch for $RUN_ID"; exit 1; }

      - name: Build archive-completeness manifest
        env:
          RUN_ID: ${{ matrix.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          id="$RUN_ID"
          run=/tmp/spider-actions-archive/$id/run.json
          asset="run-${id}.tar.gz"
          artifact_status=NONE
          (( ARTIFACT_COUNT > 0 )) && artifact_status=ARCHIVED
          ref_status=NONE
          (( REF_COUNT > 0 )) && ref_status=ARCHIVED
          semantic=false
          semantic_sha=""
          if [[ -f "/tmp/spider-actions-archive/$id/semantic-record-at-archive.json" ]]; then
            semantic=true
            semantic_sha=$(sha256sum "/tmp/spider-actions-archive/$id/semantic-record-at-archive.json" | awk '{print $1}')
          fi
          mkdir -p /tmp/archive-manifest
          jq -n \
            --argjson run_id "$id" \
            --arg workflow_name "$(jq -r .name "$run")" \
            --arg workflow_path "$(jq -r .path "$run")" \
            --arg created_at "$(jq -r .created_at "$run")" \
            --arg conclusion "$(jq -r '.conclusion // ""' "$run")" \
            --arg release_tag "$ARCHIVE_RELEASE_TAG" \
            --arg asset "$asset" \
            --arg sha "$ARCHIVE_SHA" \
            --arg artifact_status "$artifact_status" \
            --argjson artifact_count "$ARTIFACT_COUNT" \
            --arg ref_status "$ref_status" \
            --argjson ref_count "$REF_COUNT" \
            --argjson semantic_present "$semantic" \
            --arg semantic_sha "$semantic_sha" \
            '{
              schema:"SPIDER Actions lossless archive manifest v1",
              run_id:$run_id,
              workflow_name:$workflow_name,
              workflow_path:$workflow_path,
              created_at:$created_at,
              conclusion:$conclusion,
              archive_complete:true,
              actions_payload_complete:true,
              raw_logs:{status:"ARCHIVED",source:"GitHub run logs ZIP"},
              artifacts:{status:$artifact_status,count:$artifact_count,source:"raw GitHub artifact ZIPs"},
              refs:{status:$ref_status,count:$ref_count,source:"git bundle of refs containing run id"},
              release_asset:{release_tag:$release_tag,name:$asset,sha256:$sha,verified_round_trip:true},
              semantic_record_at_archive:{present:$semantic_present,sha256:$semantic_sha},
              deletion_rule:"Actions run may be deleted only if this archive remains complete AND current main has a completed evidence/run-memory semantic record for the same run."
            }' > "/tmp/archive-manifest/${id}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: run-archive-manifest-${{ matrix.run_id }}
          path: /tmp/archive-manifest/${{ matrix.run_id }}.json
          if-no-files-found: error
          retention-days: 3

  finalize:
    name: Commit archive manifests and data catalog
    needs: [inventory, archive_run]
    if: ${{ always() && needs.inventory.result == 'success' && needs.inventory.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: run-archive-manifest-*
          path: /tmp/manifests
          merge-multiple: true
      - name: Persist only successfully verified manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/run-archive/manifests
          find /tmp/manifests -maxdepth 1 -type f -name '*.json' -exec cp {} evidence/run-archive/manifests/ \;
          count=$(find evidence/run-archive/manifests -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          tmp=$(mktemp)
          if (( count > 0 )); then
            jq -s --arg updated "$(date -u +%FT%TZ)" '
              {
                schema:"SPIDER Actions archived-run data catalog v1",
                updated:$updated,
                archive_release_tag:"spider-actions-data-archive-v1",
                archived_run_count:length,
                runs:(sort_by(.run_id) | map({run_id,workflow_name,workflow_path,created_at,conclusion,archive_complete,actions_payload_complete,raw_logs,artifacts,refs,release_asset}))
              }
            ' evidence/run-archive/manifests/*.json > "$tmp"
          else
            jq -n --arg updated "$(date -u +%FT%TZ)" '{schema:"SPIDER Actions archived-run data catalog v1",updated:$updated,archive_release_tag:"spider-actions-data-archive-v1",archived_run_count:0,runs:[]}' > "$tmp"
          fi
          mv "$tmp" evidence/run-archive/DATA_CATALOG.json

          git config user.name spider-actions-archiver
          git config user.email spider-actions-archiver@autonomous.local
          git add evidence/run-archive
          git commit -m "evidence: losslessly archive Actions data batch ${GITHUB_RUN_ID}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*4))
          done
          exit 1

  no_work:
    name: Archive backlog currently empty
    needs: inventory
    if: needs.inventory.outputs.count == '0'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "No unarchived substantive completed Actions runs were found in this pass."
