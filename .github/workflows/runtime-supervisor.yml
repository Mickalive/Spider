name: SPIDER Runtime Supervisor

on:
  schedule:
    - cron: "23,53 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Runtime Lane"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-supervisor.yml'
      - '.github/scripts/run-opencode-with-retry.sh'

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-runtime-supervisor
  cancel-in-progress: true

env:
  ZERO_DELTA_LAUNCHER_FIX: 751496ad505c0f6cc9c54272c517e41c0d243dc4

jobs:
  ensure_runtime_continuity:
    name: Ensure Runtime continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover only missing continuation or orchestration-blocked repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runtime-loop.yml --limit 30 \
            --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo "Runtime already active; no duplicate dispatch."
            exit 0
          fi

          LATEST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runtime-loop.yml --limit 1 \
            --json databaseId,status,conclusion 2>/dev/null || echo '[]')
          ID=$(jq -r '.[0].databaseId // empty' <<<"$LATEST")
          CONCLUSION=$(jq -r '.[0].conclusion // empty' <<<"$LATEST")

          # Narrow recovery for the exact process blocker diagnosed by the
          # independent Runtime auditor: repeated byte-identical repairs caused
          # by a retry that returned rc=0 with zero durable delta. The shared
          # launcher now pins cwd and rejects zero-delta REPAIR success.
          if [[ -n "$ID" ]]; then
            GATE_JSON=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/results/audit/CYCLE_${ID}_RUNTIME_GATE.json?ref=cycle/runtime/${ID}/audit" 2>/dev/null || true)
            GATE=$(jq -r '.gate // empty' <<<"$GATE_JSON" 2>/dev/null || true)
            DELTA=$(jq -r '.delta_since_prior_audit_bytes // -1' <<<"$GATE_JSON" 2>/dev/null || echo -1)
            RFX=$(jq -r '[.required_fixes[]? | select(.id=="RF-X" and .external_decision_required==true)] | length' <<<"$GATE_JSON" 2>/dev/null || echo 0)
            ROUND=$(jq -r '.repair_round // 0' <<<"$GATE_JSON" 2>/dev/null || echo 0)

            if [[ "$GATE" == BLOCKED && "$DELTA" == 0 && "$RFX" -gt 0 ]]; then
              # Ensure the known orchestration fix is actually reachable on main.
              if gh api "repos/${GITHUB_REPOSITORY}/commits/${ZERO_DELTA_LAUNCHER_FIX}" >/dev/null 2>&1; then
                NEXT_ROUND=$((ROUND + 1))
                echo "::warning::Runtime BLOCKED only on RF-X zero-delta orchestration. Launcher fix is present; dispatching one same-cycle recovery repair round $NEXT_ROUND."
                gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
                  -f human_note="RF-X external orchestration blocker is resolved by shared launcher ${ZERO_DELTA_LAUNCHER_FIX}: retries are cwd-pinned and zero-delta REPAIR success now fails. Do not attempt to edit workflow/orchestration files. Implement substantive RF1-RF6 from the mounted audit; preserve the frozen R0 benchmark and all audit constraints." \
                  -f cycle_index=1 \
                  -f max_cycles=0 \
                  -f repair_from_run_id="$ID" \
                  -f repair_round="$NEXT_ROUND"
                exit 0
              fi
            fi
          fi

          if [[ -n "$ID" && "$CONCLUSION" != success ]]; then
            echo "Latest Runtime run $ID concluded $CONCLUSION. Supervisor refuses fresh progression; audit/router/watchdog/manual evidence must resolve it."
            exit 0
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fruntime" >/dev/null 2>&1; then
            echo "Runtime accepted branch does not exist yet; bootstrap workflow owns initialization."
            exit 0
          fi

          STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/state/runtime_loop.json?ref=lab/runtime" 2>/dev/null || true)
          CONTINUE=$(jq -r '.continue // false' <<<"$STATE" 2>/dev/null || echo false)
          if [[ "$CONTINUE" != true ]]; then
            echo "Accepted Runtime state says continue=false; no dispatch."
            exit 0
          fi

          SUCCESSFUL=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runtime-loop.yml --limit 100 \
            --json status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length' 2>/dev/null || echo 0)
          NEXT=$((SUCCESSFUL + 1))
          echo "::warning::Runtime is idle after successful accepted continuation; dispatching missing cycle $NEXT."
          gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f cycle_index="$NEXT" -f max_cycles=0
