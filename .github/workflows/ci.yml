name: SPIDER R2 CI

on:
  push:
    branches:
      - main
      - "research2/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-r2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q src scripts

      - name: Validate repository contracts
        run: |
          python scripts/validate_repo.py
          python scripts/validate_main_safety.py
          python scripts/test_direction_governance.py
          python scripts/test_design_review_contract.py

      - name: Test product kernel
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Dry-run canonical Codex against all live Research 2.0 lanes
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin '+refs/heads/lab2/*:refs/remotes/origin/lab2/*'
          python scripts/sync_codex.py
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          lanes = ["graph", "physics", "runtime", "product", "intel", "frontier"]
          index = json.loads(Path("codex/index.json").read_text())["experiments"]
          claim_state = json.loads(Path("codex/claim_state.json").read_text())
          effective = claim_state.get("effective_event_by_claim")
          if not isinstance(effective, dict):
              raise SystemExit("claim_state missing effective_event_by_claim")
          bad_effective = {
              claim: event.get("status")
              for claim, event in effective.items()
              if event.get("status") in {"MEASUREMENT_INVALID", "BLOCKED"}
          }
          if bad_effective:
              raise SystemExit(f"non-epistemic status leaked into effective claim state: {bad_effective}")
          for claim, event in effective.items():
              if event.get("source") == "canonical_event":
                  if not event.get("in_frozen_scope") or not event.get("lane_eligible"):
                      raise SystemExit(f"out-of-scope event leaked into effective claim state: {claim}")
          if not Path("codex/claim_scope_warnings.json").exists():
              raise SystemExit("codex claim_scope_warnings.json missing")

          quarantine = json.loads(Path("codex/quarantine.json").read_text())
          quarantine_by_id = {
              item.get("experiment_id"): item
              for item in quarantine
              if item.get("experiment_id")
          }
          gaps = json.loads(Path("codex/coverage_gaps.json").read_text())

          by_lane = {lane: [] for lane in lanes}
          for exp_id, entry in index.items():
              lane = entry.get("lane")
              if lane in by_lane:
                  by_lane[lane].append(exp_id)

          failures = []
          for lane in lanes:
              raw = subprocess.check_output(
                  ["git", "show", f"origin/lab2/{lane}:research/lanes/{lane}/state.json"],
                  text=True,
              )
              state = json.loads(raw)
              last = state.get("last_experiment_id")
              print(f"CODEX_LIVE lane={lane} canonical={len(by_lane[lane])} last={last}")
              if not by_lane[lane]:
                  failures.append(f"{lane}: no canonical finalized experiment")
              if last and last not in index:
                  q = quarantine_by_id.get(last)
                  if q and by_lane[lane]:
                      print(
                          "CODEX_LIVE_FALLBACK "
                          f"lane={lane} quarantined_last={last} "
                          f"canonical_fallback={by_lane[lane][-1]} "
                          f"reason={q.get('error')}"
                      )
                  else:
                      failures.append(f"{lane}: last official experiment {last} is not canonical or explicitly quarantined with fallback")

          print(f"CODEX_LIVE_TOTAL canonical={len(index)} quarantine={len(quarantine)} gaps={len(gaps)}")
          for item in quarantine:
              print("CODEX_QUARANTINE", json.dumps(item, sort_keys=True))
          for item in gaps:
              print("CODEX_GAP", json.dumps(item, sort_keys=True))
          if failures:
              raise SystemExit("; ".join(failures))
          PY

      - name: Shell syntax
        run: |
          bash -n scripts/checkpoint.sh
          bash -n scripts/main_safety_anchor.sh
          bash -n .github/scripts/run-opencode-resilient.sh
