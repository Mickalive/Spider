name: SPIDER R2 Bootstrap Start

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-start.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start independent factory pulse
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run factory-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main
