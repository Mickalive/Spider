name: SPIDER Autonomous Lab — Launch

on:
  workflow_dispatch:
    inputs:
      human_note:
        description: "Optional steering shared by both lanes"
        required: false
        type: string
        default: ""
      graph_cycles:
        description: "Graph batch cap; 0 = Graph Director decides when to stop"
        required: false
        type: number
        default: 3
      physics_cycles:
        description: "Physics batch cap; 0 = Physics Director decides when to stop"
        required: false
        type: number
        default: 3

permissions:
  contents: read
  actions: write

jobs:
  launch_graph:
    name: Launch Graph lane
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch independent Graph loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          MAX_CYCLES: ${{ inputs.graph_cycles }}
        shell: bash
        run: |
          gh workflow run graph-loop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index=1 \
            -f max_cycles="$MAX_CYCLES"

  launch_physics:
    name: Launch Physics lane
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch independent Physics loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          MAX_CYCLES: ${{ inputs.physics_cycles }}
        shell: bash
        run: |
          gh workflow run physics-loop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index=1 \
            -f max_cycles="$MAX_CYCLES"
