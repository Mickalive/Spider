name: SPIDER Launcher — Graph + Physics

on:
  workflow_dispatch:
    inputs:
      human_note:
        description: "Optional steering shared by both lanes"
        required: false
        type: string
        default: ""
      graph_cycles:
        description: "Graph cycle cap; 0 = continue until Graph Lane Director stops"
        required: false
        type: number
        default: 0
      physics_cycles:
        description: "Physics cycle cap; 0 = continue until Physics Lane Director stops"
        required: false
        type: number
        default: 0

permissions:
  contents: read
  actions: write

jobs:
  launch_graph:
    name: Launch Graph lane
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Graph only if idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          MAX_CYCLES: ${{ inputs.graph_cycles }}
        shell: bash
        run: |
          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow graph-loop.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Graph lane already active or queued; skipping duplicate launch."
            exit 0
          fi
          gh workflow run graph-loop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index=1 \
            -f max_cycles="$MAX_CYCLES"

  launch_physics:
    name: Launch Physics lane
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Physics only if idle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          MAX_CYCLES: ${{ inputs.physics_cycles }}
        shell: bash
        run: |
          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow physics-loop.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Physics lane already active or queued; skipping duplicate launch."
            exit 0
          fi
          gh workflow run physics-loop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index=1 \
            -f max_cycles="$MAX_CYCLES"
