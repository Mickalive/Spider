name: SPIDER Lab

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction pour le laboratoire SPIDER"
        required: true
        type: string

jobs:
  spider:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout SPIDER
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/x-preview-f-free
          use_github_token: true
          prompt: ${{ inputs.prompt }}
