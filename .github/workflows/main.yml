name: SPIDER Lab

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Instruction pour SPIDER"
        required: true
        type: string

jobs:
  spider:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout SPIDER
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run OpenCode with Ox Alpha Free
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/x-preview-f-free
          use_github_token: true
          prompt: ${{ inputs.prompt }}
