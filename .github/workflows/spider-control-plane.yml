name: SPIDER Autonomous Control Plane

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spider-control-plane.yml'
      - '.github/scripts/probe-opencode-model.sh'
      - '.github/scripts/select-spider-models.sh'
      - '.github/scripts/run-opencode-with-retry.sh'
      - 'state/opencode_model_router.json'
      - 'directives/NONTERMINAL_AUTONOMY.md'
      - 'docs/roles/PRODUCT_FINAL_GATE.md'

permissions:
  actions: write
  contents: write

concurrency:
  group: spider-autonomous-control-plane
  cancel-in-progress: false

env:
  MODEL_PROBE_TIMEOUT_SECONDS: "45"

jobs:
  terminal_gate:
    name: Check the only terminal gate
    runs-on: ubuntu-24.04
    outputs:
      final: ${{ steps.gate.outputs.final }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          raw=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/state/product_final.json?ref=lab/product" 2>/dev/null || true)
          final=false
          if [[ -n "$raw" ]] && jq -e '.final_product==true and .status=="READY_FOR_HUMAN_HANDOFF" and .independent_audit_pass==true and .baseline_win_audited==true and (.evidence_refs|type=="array" and length>0)' <<<"$raw" >/dev/null 2>&1; then final=true; fi
          echo "final=$final" >> "$GITHUB_OUTPUT"
          echo "Final Product gate=$final"

  model_probe:
    name: Probe free model — ${{ matrix.model }}
    needs: terminal_gate
    if: needs.terminal_gate.outputs.final != 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model: [deepseek-v4-flash-free, north-mini-code-free, laguna-s-2.1-free, mimo-v2.5-free, nemotron-3-ultra-free, nemotron-3.5-lightning-free, hy3-free, big-pickle, ling-3.0-flash-free, ling-3.0-tiny-free, muse-spark-1.2-contributor-free, x-preview-f-free]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Install OpenCode
        run: curl --retry 3 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
      - name: Prove real headless tool calling
        run: bash .github/scripts/probe-opencode-model.sh "${{ matrix.model }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-model-probe-${{ matrix.model }}
          path: ${{ runner.temp }}/spider-model-probe-${{ matrix.model }}/probe.json
          if-no-files-found: error
          retention-days: 7

  select_models:
    name: Select healthy models by SPIDER role
    needs: [terminal_gate, model_probe]
    if: ${{ always() && needs.terminal_gate.result == 'success' && needs.terminal_gate.outputs.final != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      healthy_count: ${{ steps.select.outputs.healthy_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: spider-model-probe-*
          path: /tmp/spider-model-probes
      - id: select
        run: bash .github/scripts/select-spider-models.sh /tmp/spider-model-probes /tmp/spider-model-selection
      - name: Persist only material routing changes
        run: |
          set -euo pipefail
          candidate=/tmp/spider-model-selection/router.json
          changed=true
          if [[ -f state/opencode_model_router.json ]]; then
            jq -S 'del(.generatedAt,.sourceRunId) | .probes |= map(del(.elapsedSeconds))' state/opencode_model_router.json > /tmp/old.json
            jq -S 'del(.generatedAt,.sourceRunId) | .probes |= map(del(.elapsedSeconds))' "$candidate" > /tmp/new.json
            cmp -s /tmp/old.json /tmp/new.json && changed=false
          fi
          [[ "$changed" == true ]] || { echo "Routing unchanged"; exit 0; }
          cp "$candidate" state/opencode_model_router.json
          git config user.name spider-model-router
          git config user.email spider-model-router@autonomous.local
          git add state/opencode_model_router.json
          git commit -m "ops: refresh empirical free-model router"
          for n in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null || true; sleep $((n*3)); done
          exit 1

  continuity:
    name: Nonterminal liveness, repair and replan
    needs: [terminal_gate, select_models]
    if: ${{ always() && needs.terminal_gate.outputs.final != 'true' && needs.select_models.result == 'success' && needs.select_models.outputs.healthy_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reap stale runs and keep every lane alive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active(){ gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --limit 50 --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0; }
          latest(){ gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true; }
          successes(){ gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --limit 100 --json status,conclusion --jq '[.[]|select(.status=="completed" and .conclusion=="success")]|length' 2>/dev/null || echo 0; }

          now=$(date -u +%s)
          for w in graph-loop.yml physics-loop.yml intel-loop.yml runtime-loop.yml product-loop.yml product-beta-repair.yml product-engineering-loop.yml product-engineering-failure-review.yml cto-council.yml frontier-research.yml; do
            rows=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$w" --limit 50 --json databaseId,status,createdAt 2>/dev/null || echo '[]')
            while IFS= read -r row; do
              id=$(jq -r .databaseId <<<"$row"); status=$(jq -r .status <<<"$row"); created=$(jq -r .createdAt <<<"$row"); epoch=$(date -u -d "$created" +%s 2>/dev/null || echo "$now"); age=$((now-epoch))
              if [[ "$status" =~ ^(queued|pending|requested|waiting)$ ]] && (( age>5400 )); then gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; fi
              if [[ "$status" == in_progress ]] && (( age>86400 )); then gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; fi
            done < <(jq -c '.[]|select(.status!="completed")' <<<"$rows")
          done

          core(){
            local lane="$1" wf="$2" upper="$3" id gatejson gate round cycle next
            (( $(active "$wf") == 0 )) || { echo "$lane active"; return; }
            id=$(latest "$wf")
            if [[ -n "$id" ]]; then
              gatejson=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/results/audit/CYCLE_${id}_${upper}_GATE.json?ref=cycle/${lane}/${id}/audit" 2>/dev/null || true)
              gate=$(jq -r '.gate // empty' <<<"$gatejson" 2>/dev/null || true)
              if [[ "$gate" == REVISE ]]; then
                round=$(jq -r '(.repair_round // .repair_round_audited // 0)+1' <<<"$gatejson" 2>/dev/null || echo 1); cycle=$(jq -r 'if (.cycle|type)=="number" then .cycle else 1 end' <<<"$gatejson" 2>/dev/null || echo 1)
                gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main -f human_note="NONTERMINAL SAME-CYCLE REPAIR. Preserve frozen evidence; implement only independent audit required_fixes." -f cycle_index="$cycle" -f max_cycles=0 -f repair_from_run_id="$id" -f repair_round="$round"; return
              fi
            fi
            next=$(( $(successes "$wf") + 1 ))
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref main -f human_note="HUMAN-AUTHORIZED NONTERMINAL CONTINUITY. Final Product is false. Preserve PASS/REVISE/BLOCKED/falsified/negative/invalid evidence. If the local program ended, choose a genuinely different bounded high-information question; never convert failure into success and never mechanically repeat a blocked/falsified test." -f cycle_index="$next" -f max_cycles=0
          }
          core graph graph-loop.yml GRAPH
          core physics physics-loop.yml PHYSICS

          if (( $(active intel-loop.yml) == 0 )); then
            id=$(latest intel-loop.yml); gatejson=""; [[ -z "$id" ]] || gatejson=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/results/intel/audit/CYCLE_${id}_INTEL_GATE.json?ref=cycle/intel/${id}/audit" 2>/dev/null || true); gate=$(jq -r '.gate // empty' <<<"$gatejson" 2>/dev/null || true)
            if [[ "$gate" == REVISE ]]; then round=$(jq -r '(.repair_round // .repair_round_audited // 0)+1' <<<"$gatejson" 2>/dev/null || echo 1); gh workflow run intel-loop.yml --repo "$GITHUB_REPOSITORY" --ref main -f cycle_index=1 -f repair_from_run_id="$id" -f repair_round="$round"; else gh workflow run intel-loop.yml --repo "$GITHUB_REPOSITORY" --ref main -f cycle_index="$(( $(successes intel-loop.yml)+1 ))"; fi
          fi

          if (( $(active runtime-loop.yml) == 0 )); then
            id=$(latest runtime-loop.yml); gatejson=""; [[ -z "$id" ]] || gatejson=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/results/audit/CYCLE_${id}_RUNTIME_GATE.json?ref=cycle/runtime/${id}/audit" 2>/dev/null || true); gate=$(jq -r '.gate // empty' <<<"$gatejson" 2>/dev/null || true)
            if [[ "$gate" == REVISE ]]; then round=$(jq -r '(.repair_round // .repair_round_audited // 0)+1' <<<"$gatejson" 2>/dev/null || echo 1); gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main -f cycle_index=1 -f max_cycles=0 -f repair_from_run_id="$id" -f repair_round="$round"; else gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main -f human_note="NONTERMINAL RUNTIME CONTINUITY. Replan rather than repeat blocked/exhausted work." -f cycle_index="$(( $(successes runtime-loop.yml)+1 ))" -f max_cycles=0; fi
          fi

          pactive=$(( $(active product-loop.yml)+$(active product-beta-repair.yml)+$(active product-engineering-loop.yml)+$(active product-engineering-failure-review.yml) ))
          if (( pactive == 0 )); then state=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/state/product_direction.json?ref=lab/product" 2>/dev/null || true); beta=$(jq -r '.beta_launch // false' <<<"$state" 2>/dev/null || echo false); if [[ "$beta" == true ]]; then gh workflow run product-loop.yml --repo "$GITHUB_REPOSITORY" --ref main; else gh workflow run product-engineering-loop.yml --repo "$GITHUB_REPOSITORY" --ref main; fi; fi
          (( $(active cto-council.yml) > 0 )) || gh workflow run cto-council.yml --repo "$GITHUB_REPOSITORY" --ref main

          cto=$(gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fcto" --jq '.commit.sha' 2>/dev/null || true)
          if [[ -n "$cto" ]]; then
            state=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/state/cto_direction.json?ref=$cto" 2>/dev/null || true)
            while IFS= read -r ch; do
              team=$(jq -r .team_id <<<"$ch"); version=$(jq -r .charter_version <<<"$ch")
              accepted=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/state/frontier/${team}.json?ref=lab/frontier/${team}" 2>/dev/null | jq -r '.accepted_charter_version // 0' 2>/dev/null || echo 0); (( accepted < version )) || continue
              n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontier-research.yml --limit 100 --json displayTitle,status --jq "[.[]|select(.displayTitle==\"Frontier ${team} v${version}\" and .status!=\"completed\")]|length" 2>/dev/null || echo 0); (( n == 0 )) || continue
              last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontier-research.yml --limit 100 --json databaseId,displayTitle,createdAt | jq --arg t "Frontier ${team} v${version}" '[.[]|select(.displayTitle==$t)]|sort_by(.createdAt)|last // empty' 2>/dev/null || true)
              if [[ -n "$last" ]]; then rid=$(jq -r .databaseId <<<"$last"); gj=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/results/audit/CYCLE_${rid}_FRONTIER_${team}_GATE.json?ref=cycle/frontier/${team}/${rid}/audit" 2>/dev/null || true); g=$(jq -r '.gate // empty' <<<"$gj" 2>/dev/null || true); if [[ "$g" == BLOCKED ]]; then echo "frontier/$team BLOCKED: awaiting CTO re-charter"; continue; fi; if [[ "$g" == REVISE ]]; then r=$(jq -r '(.repair_round // .repair_round_audited // 0)+1' <<<"$gj" 2>/dev/null || echo 1); gh workflow run frontier-research.yml --repo "$GITHUB_REPOSITORY" --ref main -f team_id="$team" -f charter_version="$version" -f cto_commit="$cto" -f one_shot=false -f repair_from_run_id="$rid" -f repair_round="$r"; continue; fi; fi
              gh workflow run frontier-research.yml --repo "$GITHUB_REPOSITORY" --ref main -f team_id="$team" -f charter_version="$version" -f cto_commit="$cto" -f one_shot=false
            done < <(jq -c '.research_portfolio.frontier_team_charters[]? | select(.status=="CREATE" or .status=="CONTINUE")' <<<"$state")
          fi

  provider_outage:
    name: Preserve state if no free model is healthy
    needs: [terminal_gate, select_models]
    if: ${{ always() && needs.terminal_gate.outputs.final != 'true' && needs.select_models.result == 'success' && needs.select_models.outputs.healthy_count == '0' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::warning::No free model passed the real tool-call probe. No doomed lane is dispatched; scientific/product state is unchanged and the next 5-minute heartbeat will probe again."

  cleanup_obsolete_orchestration:
    name: Remove superseded orchestrator run noise
    needs: terminal_gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          names=("SPIDER Ox Watchdog" "SPIDER Research Program Supervisor" "SPIDER Lane Repair Supervisor" "SPIDER Intel Supervisor" "SPIDER Runtime Supervisor" "SPIDER Product Supervisor" "SPIDER Stale Run Reaper")
          tmp=$(mktemp); gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[]|[.id,.name,.status]|@tsv' > "$tmp"; deleted=0
          for name in "${names[@]}"; do while IFS=$'\t' read -r id n status; do [[ "$n" == "$name" && "$status" == completed ]] || continue; gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$id" >/dev/null 2>&1 && deleted=$((deleted+1)); (( deleted < 300 )) || break 2; done < "$tmp"; done
          rm -f "$tmp"; echo "Deleted $deleted completed superseded-orchestrator runs. Scientific lane histories were untouched."
