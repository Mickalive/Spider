name: SPIDER Install Ox Watchdog Hardening

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/install-ox-watchdog.json'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reviewed hardening patch
        shell: bash
        run: python .github/scripts/install-ox-watchdog-hardening.py

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "infra: add persistent Ox recovery watchdog semantics"
          git push origin HEAD:main
