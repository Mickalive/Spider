name: SPIDER Install Ox Watchdog Hardening

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/install-ox-watchdog.json'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harden lane recovery semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          lane_files = {
              Path('.github/workflows/graph-loop.yml'): 3,
              Path('.github/workflows/physics-loop.yml'): 3,
              Path('.github/workflows/meta-sync.yml'): 1,
          }

          pattern = re.compile(
              r'''(?ms)^      - name: Add OpenCode to PATH with transient network retry\n'''
              r'''        shell: bash\n'''
              r'''        run: \|\n'''
              r'''          echo "\$HOME/\.opencode/bin" >> "\$GITHUB_PATH"\n'''
              r'''          cat >> "\$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'\n'''
              r'''          opencode\(\) \{\n'''
              r'''.*?'''
              r'''^          SPIDER_OPENCODE_RETRY\n'''
          )

          replacement = '''      - name: Add OpenCode to PATH with bounded local retry\n        shell: bash\n        run: |\n          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"\n          cat >> "$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'\n          opencode() {\n            local real="$HOME/.opencode/bin/opencode"\n            local log rc attempt\n            local max_attempts=6\n            local retry_delay=300\n            log="$(mktemp)"\n            for ((attempt = 1; attempt <= max_attempts; attempt++)); do\n              : > "$log"\n              echo "OpenCode/Ox attempt ${attempt}/${max_attempts}."\n              set +e\n              "$real" "$@" 2>&1 | tee "$log"\n              rc=${PIPESTATUS[0]}\n              set -e\n              if [ "$rc" -eq 0 ]; then\n                rm -f "$log"\n                return 0\n              fi\n              if ! grep -Eiq '(network_error|NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|timed out|timeout|socket hang up|connection (reset|refused|closed|error)|upstream.*(reset|closed|unavailable|error)|HTTP[^0-9]*(429|500|502|503|504)|status[^0-9]*(429|500|502|503|504)|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable|TLS|SSL.*error)' "$log"; then\n                echo "::error::SPIDER_OX_NONTRANSIENT exit=$rc; watchdog will not retry this failure." >&2\n                rm -f "$log"\n                return "$rc"\n              fi\n              if [ "$attempt" -eq "$max_attempts" ]; then\n                echo "::error::SPIDER_TRANSIENT_OX_EXHAUSTED attempts=$max_attempts exit=$rc" >&2\n                rm -f "$log"\n                return "$rc"\n              fi\n              echo "::warning::Transient OpenCode/Ox outage; retrying in ${retry_delay}s." >&2\n              sleep "$retry_delay"\n            done\n          }\n          SPIDER_OPENCODE_RETRY\n'''

          for path, expected in lane_files.items():
              text = path.read_text()
              text, count = pattern.subn(replacement, text)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} retry blocks, patched {count}; refusing partial install')
              path.write_text(text)
              print(f'{path}: patched {count} Ox retry blocks')

          graph = Path('.github/workflows/graph-loop.yml')
          text = graph.read_text()
          replacements = {
              "    if: always() && needs.team_graph.result != 'cancelled'": "    if: needs.team_graph.result == 'success'",
              "    if: always() && needs.audit_graph.result != 'cancelled'": "    if: needs.audit_graph.result == 'success'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'graph condition not uniquely found: {old}')
              text = text.replace(old, new)
          old_push = '          git push --force origin "HEAD:refs/heads/$BRANCH"'
          if text.count(old_push) != 2:
              raise SystemExit('graph attempt snapshot push count mismatch')
          text = text.replace(old_push, '          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"\n          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"\n          git push --force origin "HEAD:refs/heads/$BRANCH"')
          graph.write_text(text)

          physics = Path('.github/workflows/physics-loop.yml')
          text = physics.read_text()
          replacements = {
              "    if: always() && needs.team_physics.result != 'cancelled'": "    if: needs.team_physics.result == 'success'",
              "    if: always() && needs.audit_physics.result != 'cancelled'": "    if: needs.audit_physics.result == 'success'",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'physics condition not uniquely found: {old}')
              text = text.replace(old, new)
          if text.count(old_push) != 2:
              raise SystemExit('physics attempt snapshot push count mismatch')
          text = text.replace(old_push, '          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"\n          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"\n          git push --force origin "HEAD:refs/heads/$BRANCH"')
          physics.write_text(text)

          # One-shot installer removes itself and its trigger from the committed state.
          Path('.github/workflows/_install-ox-watchdog-hardening.yml').unlink()
          Path('.spider/maintenance/install-ox-watchdog.json').unlink()
          PY

      - name: Sanity check hardened workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checks = {
              '.github/workflows/graph-loop.yml': 3,
              '.github/workflows/physics-loop.yml': 3,
              '.github/workflows/meta-sync.yml': 1,
          }
          for p, n in checks.items():
              t = Path(p).read_text()
              assert t.count('SPIDER_TRANSIENT_OX_EXHAUSTED') == n, (p, 'transient marker')
              assert t.count('local max_attempts=6') == n, (p, 'attempt count')
              assert t.count('local retry_delay=300') == n, (p, 'retry delay')
          g = Path('.github/workflows/graph-loop.yml').read_text()
          p = Path('.github/workflows/physics-loop.yml').read_text()
          assert "if: needs.team_graph.result == 'success'" in g
          assert "if: needs.audit_graph.result == 'success'" in g
          assert "if: needs.team_physics.result == 'success'" in p
          assert "if: needs.audit_physics.result == 'success'" in p
          assert g.count('ATTEMPT_BRANCH=') == 2
          assert p.count('ATTEMPT_BRANCH=') == 2
          print('watchdog hardening sanity checks passed')
          PY

      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "infra: add persistent Ox recovery watchdog semantics"
          git push origin HEAD:main
