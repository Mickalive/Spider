name: SPIDER Cleanup Obsolete Runs

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/cleanup-obsolete-runs.json'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Inventory and delete obsolete completed runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider/maintenance
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" --jq '.workflow_runs[] | {id,name,status,conclusion,created_at,updated_at,event,head_branch,run_number,run_attempt}' | jq -s '.' > /tmp/all_runs.json

          # Protect active/queued runs, the current cleanup run, the two accepted scientific provenance runs,
          # and the two most recent completed runs of each current scientific lane.
          jq -n --argjson self "$GITHUB_RUN_ID" '[32689296167,32689298051,($self|tonumber)]' > /tmp/protected.json

          for wf in "SPIDER Graph Lane" "SPIDER Physics Lane"; do
            jq --arg wf "$wf" '[.[] | select(.name==$wf and .status=="completed")] | sort_by(.created_at) | reverse | .[0:2] | .[].id' /tmp/all_runs.json > /tmp/ids
            jq -s '.[0] + .[1]' /tmp/protected.json /tmp/ids > /tmp/p && mv /tmp/p /tmp/protected.json
          done
          jq 'unique' /tmp/protected.json > /tmp/p && mv /tmp/p /tmp/protected.json

          jq -n '[]' > /tmp/deleted.json
          jq -n '[]' > /tmp/kept.json

          while IFS= read -r row; do
            id=$(jq -r '.id' <<<"$row")
            name=$(jq -r '.name' <<<"$row")
            status=$(jq -r '.status' <<<"$row")
            conclusion=$(jq -r '.conclusion // ""' <<<"$row")
            protected=$(jq --argjson id "$id" 'index($id) != null' /tmp/protected.json)

            if [[ "$status" != "completed" || "$protected" == "true" ]]; then
              jq --argjson row "$row" '. + [$row]' /tmp/kept.json > /tmp/x && mv /tmp/x /tmp/kept.json
              continue
            fi

            # Keep latest Meta Sync if any; everything else completed is disposable because accepted evidence lives in repo branches/files.
            if [[ "$name" == "SPIDER Meta Sync" ]]; then
              latest_meta=$(jq '[.[] | select(.name=="SPIDER Meta Sync" and .status=="completed")] | sort_by(.created_at) | last | .id // 0' /tmp/all_runs.json)
              if [[ "$id" == "$latest_meta" ]]; then
                jq --argjson row "$row" '. + [$row]' /tmp/kept.json > /tmp/x && mv /tmp/x /tmp/kept.json
                continue
              fi
            fi

            # Delete obsolete completed runs: old lane runs beyond the protected tail, launchers,
            # watchdog/supervisor history, maintenance/install/cleanup workflows, and legacy labs.
            case "$name" in
              "SPIDER Graph Lane"|"SPIDER Physics Lane"|"SPIDER Launcher — Graph + Physics"|"SPIDER Meta Sync"|"SPIDER Ox Watchdog"|"SPIDER Research Program Supervisor"|"SPIDER Multi-Runner Lab"|"SPIDER Lab"|"SPIDER Autonomous Lab — Launch"|"SPIDER Launch Bridge"|SPIDER*Install*|SPIDER*Cleanup*|SPIDER*Resume*|SPIDER*Network*|SPIDER*Audit*Repair*|SPIDER*Recommended*|SPIDER*Fix*)
                echo "Deleting obsolete run $id [$name] $conclusion"
                if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"; then
                  jq --argjson row "$row" '. + [$row]' /tmp/deleted.json > /tmp/x && mv /tmp/x /tmp/deleted.json
                else
                  echo "::warning::Could not delete run $id [$name]"
                  jq --argjson row "$row" '. + [$row]' /tmp/kept.json > /tmp/x && mv /tmp/x /tmp/kept.json
                fi
                ;;
              *)
                jq --argjson row "$row" '. + [$row]' /tmp/kept.json > /tmp/x && mv /tmp/x /tmp/kept.json
                ;;
            esac
          done < <(jq -c '.[]' /tmp/all_runs.json)

          jq -n \
            --arg cleaned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson protected "$(cat /tmp/protected.json)" \
            --argjson deleted "$(cat /tmp/deleted.json)" \
            --argjson kept "$(cat /tmp/kept.json)" \
            '{cleaned_at:$cleaned_at, protected_ids:$protected, deleted_count:($deleted|length), deleted:$deleted, kept_count:($kept|length), kept:$kept}' \
            > .spider/maintenance/obsolete-runs-cleanup-receipt.json

      - name: Self-clean workflow and trigger
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_cleanup-obsolete-runs.yml
          rm -f .spider/maintenance/cleanup-obsolete-runs.json
          git pull --rebase origin main
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "maintenance: clean obsolete Actions history"
          git push origin HEAD:main
