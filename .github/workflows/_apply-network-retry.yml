name: SPIDER Apply Network Retry Rule

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/apply-network-retry.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact retry wrapper patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
              Path('.github/workflows/graph-loop.yml'): 3,
              Path('.github/workflows/physics-loop.yml'): 3,
              Path('.github/workflows/meta-sync.yml'): 1,
          }

          old = '''      - name: Add OpenCode to PATH
                shell: bash
                run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          '''

          new = '''      - name: Add OpenCode to PATH with transient network retry
                shell: bash
                run: |
                  echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
                  cat >> "$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'
                  opencode() {
                    local real="$HOME/.opencode/bin/opencode"
                    local log rc
                    log="$(mktemp)"
                    set +e
                    "$real" "$@" 2>&1 | tee "$log"
                    rc=${PIPESTATUS[0]}
                    set -e
                    if [ "$rc" -eq 0 ]; then
                      rm -f "$log"
                      return 0
                    fi
                    if grep -Eiq '(NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ETIMEDOUT|socket hang up|connection reset|connection refused|connection closed|429|502|503|504|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable)' "$log"; then
                      echo "::warning::Transient OpenCode/Ox network error detected (exit $rc). Retrying once in 300 seconds."
                      sleep 300
                      rm -f "$log"
                      set +e
                      "$real" "$@"
                      rc=$?
                      set -e
                      return "$rc"
                    fi
                    rm -f "$log"
                    return "$rc"
                  }
                  SPIDER_OPENCODE_RETRY
          '''

          for path, expected in files.items():
              text = path.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} exact PATH blocks, found {found}; refusing partial patch')
              path.write_text(text.replace(old, new))
              print(f'patched {path}: {found} OpenCode call environments')

          # Also make installer transient failures retry quickly; this is separate from the 5-minute Ox runtime retry.
          install_old = 'run: curl -fsSL https://opencode.ai/install | bash'
          install_new = 'run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash'
          for path, expected in files.items():
              text = path.read_text()
              found = text.count(install_old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} installer commands, found {found}; refusing partial patch')
              path.write_text(text.replace(install_old, install_new))

          # Remove this one-shot maintenance mechanism from the resulting repository state.
          Path('.github/workflows/_apply-network-retry.yml').unlink()
          Path('.spider/maintenance/apply-network-retry.json').unlink()
          PY

      - name: Sanity-check resulting workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
            '.github/workflows/graph-loop.yml': 3,
            '.github/workflows/physics-loop.yml': 3,
            '.github/workflows/meta-sync.yml': 1,
          }
          for p, n in checks.items():
            t = Path(p).read_text()
            assert t.count('Transient OpenCode/Ox network error detected') == n, (p, 'retry wrapper count')
            assert t.count('sleep 300') == n, (p, 'delay count')
            assert t.count('curl --retry 3 --retry-all-errors --retry-delay 15') == n, (p, 'installer retry count')
            print(p, 'OK')
          PY

      - name: Commit retry rule
        shell: bash
        run: |
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "infra: retry transient OpenCode network failures once after 5 minutes"
          git push origin HEAD:main
