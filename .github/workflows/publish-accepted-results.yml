name: SPIDER Accepted Results Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-accepted-results.yml'
      - '.github/scripts/publish-accepted-results.sh'
  workflow_run:
    workflows:
      - 'SPIDER Graph Lane'
      - 'SPIDER Physics Lane'
      - 'SPIDER Intel Research Lane'
      - 'SPIDER Runtime Lane'
      - 'SPIDER Frontier Research Team'
      - 'SPIDER Product and Beta Lane'
    types: [completed]
  schedule:
    - cron: '41 * * * *'

permissions:
  contents: write

concurrency:
  group: spider-accepted-results-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Publish accepted branch results without deleting history
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-accepted-results.sh
          git diff --check
      - name: Commit central catalog when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- results; then
            echo 'main/results already matches accepted lab branches.'
            exit 0
          fi
          git config user.name spider-results-publisher
          git config user.email spider-results-publisher@autonomous.local
          git add results
          git commit -m "results: publish accepted lab catalog ${GITHUB_RUN_ID}"

          # Worktree publication can leave harmless working-tree residue after the
          # generated results have already been captured in the commit.  Clear only
          # that uncommitted residue before rebasing; the committed catalog remains
          # intact and the publisher's no-deletion invariant is enforced upstream.
          git reset --hard HEAD

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD
            sleep $((attempt * 2))
          done
          echo '::error::Unable to publish accepted results after three synchronized attempts.'
          exit 1
