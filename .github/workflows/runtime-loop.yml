name: SPIDER Runtime Lane

on:
  workflow_dispatch:
    inputs:
      human_note:
        description: "Optional human/CTO steering note"
        required: false
        type: string
        default: ""
      cycle_index:
        description: "Current Runtime cycle number"
        required: false
        type: number
        default: 1
      max_cycles:
        description: "Optional numeric cap; 0 = Runtime Director decides"
        required: false
        type: number
        default: 0
      repair_from_run_id:
        description: "Prior rejected Runtime run to repair; empty = fresh cycle"
        required: false
        type: string
        default: ""
      repair_round:
        description: "Same-cycle audit repair round"
        required: false
        type: number
        default: 0
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-loop.yml'
      - 'directives/RUNTIME.md'
      - 'docs/roles/RUNTIME_*.md'
      - '.opencode/agents/runtime_*.md'

permissions:
  contents: write
  actions: write

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  LANE_BRANCH: lab/runtime

concurrency:
  group: spider-runtime-lane
  cancel-in-progress: false

jobs:
  runtime_team:
    name: TEAM RUNTIME
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current retry/control launcher
        shell: bash
        run: |
          mkdir -p /tmp/spider_control
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout or initialize accepted Runtime lane
        if: ${{ inputs.repair_from_run_id == '' }}
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$LANE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LANE_BRANCH"
            git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          else
            git switch -C "$LANE_BRANCH"
            mkdir -p runtime tests/runtime results/runtime reports/runtime state
            touch docs/RUNTIME_LEDGER.md docs/NEXT_RUNTIME.md
            git add runtime tests/runtime results/runtime reports/runtime state docs/RUNTIME_LEDGER.md docs/NEXT_RUNTIME.md
            git commit -m "Runtime: initialize accepted lane" || true
            git push origin "HEAD:refs/heads/$LANE_BRANCH"
          fi

      - name: Checkout rejected Runtime snapshot and prior audit for repair
        if: ${{ inputs.repair_from_run_id != '' }}
        shell: bash
        run: |
          SOURCE_TEAM="cycle/runtime/${{ inputs.repair_from_run_id }}/team"
          SOURCE_AUDIT="cycle/runtime/${{ inputs.repair_from_run_id }}/audit"
          git fetch origin "$SOURCE_TEAM:refs/remotes/origin/$SOURCE_TEAM"
          git fetch origin "$SOURCE_AUDIT:refs/remotes/origin/$SOURCE_AUDIT"
          git switch -C runtime-repair-base "origin/$SOURCE_TEAM"
          git worktree add --detach /tmp/spider_runtime_repair_audit "origin/$SOURCE_AUDIT"

      - name: Mount accepted upstream evidence and CTO advice
        shell: bash
        run: |
          for lane in graph physics intel product cto; do
            B="lab/$lane"
            if git ls-remote --exit-code --heads origin "refs/heads/$B" >/dev/null 2>&1; then
              git fetch origin "$B:refs/remotes/origin/$B"
              git worktree add --detach "/tmp/spider_$lane" "origin/$B"
            else
              mkdir -p "/tmp/spider_$lane"
            fi
          done

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Run TEAM RUNTIME — fresh cycle
        if: ${{ inputs.repair_from_run_id == '' }}
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent runtime_runner \
            "Run Runtime cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}). Accepted upstream snapshots: Graph=/tmp/spider_graph, Physics=/tmp/spider_physics, Intel=/tmp/spider_intel, Product=/tmp/spider_product. CTO=/tmp/spider_cto; read docs/CTO_TO_RUNTIME.md there if present. Build/test the current directives/RUNTIME.md mission. Preserve evidence tiers and prove or falsify work-compression on matched tasks. Human note: ${HUMAN_NOTE}"

      - name: Run TEAM RUNTIME — same-cycle repair
        if: ${{ inputs.repair_from_run_id != '' }}
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent runtime_runner \
            "REPAIR Runtime cycle ${{ inputs.cycle_index }}, repair round ${{ inputs.repair_round }} (run ${GITHUB_RUN_ID}). Current checkout is the exact rejected team snapshot from run ${{ inputs.repair_from_run_id }}; audit=/tmp/spider_runtime_repair_audit. Fix EVERY required_fixes item and rerun affected tests/benchmarks. Do not weaken the frozen comparison, task set, success oracle or win/verdict rule. Human note: ${HUMAN_NOTE}"

      - name: Enforce Runtime scope
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(runtime/|tests/runtime/|results/runtime/|reports/runtime/|data/manifests/runtime/|docs/RUNTIME_LEDGER\.md$|docs/NEXT_RUNTIME\.md$|state/runtime_loop\.json$|directives/RUNTIME\.md$)' || true)
          if [[ -n "$BAD" ]]; then
            echo "TEAM RUNTIME crossed protected scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Persist Runtime team branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/runtime/${GITHUB_RUN_ID}/team"
          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "spider-runtime"
          git config user.email "spider-runtime@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Runtime cycle ${{ inputs.cycle_index }} repair ${{ inputs.repair_round }} attempt ${GITHUB_RUN_ATTEMPT}: team output" || true
          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"

  runtime_audit:
    name: INDEPENDENT AUDITOR — RUNTIME
    needs: [runtime_team]
    if: needs.runtime_team.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      gate: ${{ steps.audit_gate.outputs.gate }}
      safe_to_integrate: ${{ steps.audit_gate.outputs.safe_to_integrate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current retry/control launcher
        shell: bash
        run: |
          mkdir -p /tmp/spider_control
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout accepted Runtime base and mount team output
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C runtime-audit-base "origin/$LANE_BRANCH"
          TEAM="cycle/runtime/${GITHUB_RUN_ID}/team"
          git fetch origin "$TEAM:refs/remotes/origin/$TEAM"
          git worktree add --detach /tmp/spider_runtime_team "origin/$TEAM"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Audit Runtime
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent runtime_auditor \
            "Audit Runtime cycle ${{ inputs.cycle_index }} (run ${GITHUB_RUN_ID}), repair round ${{ inputs.repair_round }}. Team=/tmp/spider_runtime_team. Current checkout is untouched accepted Runtime base and you may write ONLY reports/audit and results/audit. Recompute work-compression claims and attack stale hits, hidden IDs, leakage, verification/recovery overhead and fallback correctness."

      - name: Enforce audit-only writes
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(reports/audit/|results/audit/)' || true)
          if [[ -n "$BAD" ]]; then
            echo "Runtime Auditor wrote outside audit outputs:"
            echo "$BAD"
            exit 1
          fi

      - name: Validate Runtime audit gate
        id: audit_gate
        shell: bash
        run: |
          FILE="results/audit/CYCLE_${GITHUB_RUN_ID}_RUNTIME_GATE.json"
          test -f "$FILE" || { echo "::error::Missing Runtime gate"; exit 1; }
          GATE=$(jq -r '.gate // empty' "$FILE")
          SAFE=$(jq -r '.safe_to_integrate // false' "$FILE")
          case "$GATE" in
            PASS) [[ "$SAFE" == true ]] || exit 1 ;;
            REVISE) [[ "$SAFE" == false ]] || exit 1; test "$(jq '.required_fixes|length' "$FILE")" -gt 0 || exit 1 ;;
            BLOCKED) [[ "$SAFE" == false ]] || exit 1 ;;
            *) echo "::error::Invalid Runtime gate $GATE"; exit 1 ;;
          esac
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "safe_to_integrate=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Persist Runtime audit branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/runtime/${GITHUB_RUN_ID}/audit"
          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "spider-auditor-runtime"
          git config user.email "spider-auditor-runtime@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Runtime cycle ${{ inputs.cycle_index }} repair ${{ inputs.repair_round }}: independent audit" || true
          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"

  runtime_repair_router:
    name: RUNTIME AUDIT → RETURN TO BUILDER
    needs: [runtime_audit]
    if: needs.runtime_audit.result == 'success' && needs.runtime_audit.outputs.gate == 'REVISE'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch same-cycle repair
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          NEXT=$(( ${{ inputs.repair_round }} + 1 ))
          gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index="${{ inputs.cycle_index }}" \
            -f max_cycles="${{ inputs.max_cycles }}" \
            -f repair_from_run_id="$GITHUB_RUN_ID" \
            -f repair_round="$NEXT"

  runtime_blocked:
    name: RUNTIME AUDIT — BLOCKED
    needs: [runtime_audit]
    if: needs.runtime_audit.result == 'success' && needs.runtime_audit.outputs.gate == 'BLOCKED'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::Runtime audit BLOCKED. Rejected snapshot preserved; no blind repair."

  runtime_director:
    name: RUNTIME DIRECTOR
    needs: [runtime_team, runtime_audit]
    if: needs.runtime_audit.result == 'success' && needs.runtime_audit.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current retry/control launcher
        shell: bash
        run: |
          mkdir -p /tmp/spider_control
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout accepted Runtime and mount audited snapshots
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          for kind in team audit; do
            B="cycle/runtime/${GITHUB_RUN_ID}/$kind"
            git fetch origin "$B:refs/remotes/origin/$B"
            git worktree add --detach "/tmp/spider_runtime_$kind" "origin/$B"
          done
          if git ls-remote --exit-code --heads origin refs/heads/lab/cto >/dev/null 2>&1; then
            git fetch origin "lab/cto:refs/remotes/origin/lab/cto"
            git worktree add --detach /tmp/spider_cto "origin/lab/cto"
          else
            mkdir -p /tmp/spider_cto
          fi

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Integrate audited Runtime and choose next step
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent runtime_director \
            "Integrate Runtime cycle ${{ inputs.cycle_index }} after audit PASS. TEAM=/tmp/spider_runtime_team AUDIT=/tmp/spider_runtime_audit CTO=/tmp/spider_cto. Current checkout is lab/runtime. Copy/integrate only surviving Runtime work, answer audit limitations, update Runtime ledger/directive/state and choose the next discriminating Runtime question."

      - name: Advance accepted Runtime lane
        shell: bash
        run: |
          git config user.name "spider-runtime-director"
          git config user.email "spider-runtime-director@autonomous.local"
          git add -A
          git commit -m "Runtime cycle ${{ inputs.cycle_index }}: audited integration" || true
          git push origin "HEAD:refs/heads/$LANE_BRANCH"

      - name: Dispatch next Runtime cycle if justified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CONTINUE=$(jq -r '.continue // false' state/runtime_loop.json 2>/dev/null || echo false)
          if [[ "$CONTINUE" != true ]]; then
            echo "Runtime Director stopped autonomous continuation."
            exit 0
          fi
          NEXT=$(( ${{ inputs.cycle_index }} + 1 ))
          MAX=${{ inputs.max_cycles }}
          if [[ "$MAX" -gt 0 && "$NEXT" -gt "$MAX" ]]; then
            echo "Runtime max_cycles=$MAX reached."
            exit 0
          fi
          gh workflow run runtime-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f cycle_index="$NEXT" -f max_cycles="$MAX"
