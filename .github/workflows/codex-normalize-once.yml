name: SPIDER Codex Normalize Once

on:
  push:
    branches:
      - archive/spider-codex-ultimate
    paths:
      - .github/workflows/codex-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: archive/spider-codex-ultimate
          fetch-depth: 0

      - name: Normalize Codex selection and organization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tools/build_spider_knowledge_codex.py')
          s = p.read_text(encoding='utf-8')

          old_k = 'K=re.compile(r"(result|report|audit|gate|verdict|metric|benchmark|measurement|finding|experiment|hypothesis|evidence|evaluation|falsification|claim|ledger|outcome|score|test)",re.I)'
          new_k = 'K=re.compile(r"(charter|question|mission|prereg|registration|protocol|method|design|plan|freeze|seal|baseline|power|result|report|audit|gate|verdict|metric|benchmark|measurement|finding|experiment|hypothesis|evidence|evaluation|falsification|claim|ledger|outcome|score|test|manifest|state|decision|limitation|provenance|receipt|handoff|taxonomy|registry)",re.I)'
          if old_k not in s:
              raise SystemExit('expected K selector not found')
          s = s.replace(old_k, new_k, 1)

          start = s.index('def wanted_path(p):')
          end = s.index('\ndef blob(oid):', start)
          replacement = r'''ROLE_ORDER={"charter_question":0,"prereg_protocol":1,"result_measurement":2,"report_verdict":3,"audit_gate":4,"state_provenance":5,"context_input":6}
          LANE_ORDER={"graph":0,"physics":1,"intel":2,"runtime":3,"product":4,"frontier":5,"audit":6,"cto":7,"cross-lane":8,"unknown":9}
          RESEARCH_LANES={"graph","physics","intel","runtime","product","frontier"}

          def lane_for_path(p):
              p=p.replace("\\","/").lower(); parts=p.split("/")
              if parts and parts[0] in RESEARCH_LANES:return parts[0]
              if len(parts)>=2 and parts[0] in {"reports","results","state","directives"} and parts[1] in LANES:return parts[1]
              if len(parts)>=3 and parts[0]=="data" and parts[1]=="manifests" and parts[2] in LANES:return parts[2]
              for lane in ("frontier","intel","physics","graph","runtime","product","audit","cto"):
                  if re.search(rf"(^|[/_.-]){re.escape(lane)}([/_.-]|$)",p):return lane
              return "cross-lane"

          def role_for_path(p):
              p=p.replace("\\","/").lower(); name=Path(p).name
              if "/audit/" in p or re.search(r"(^|[_\-.])(audit|gate)([_\-.]|$)",name):return "audit_gate"
              if p.startswith("results/"):return "result_measurement"
              if p.startswith("reports/"):return "report_verdict"
              if "/charters/" in p or "charter" in name or re.fullmatch(r"cto_v\d+\.json",name):return "charter_question"
              if any(x in p for x in ("/prereg/","/protocol/","/method/")) or re.search(r"(prereg|registration|protocol|method|design|freeze|seal|baseline|power|plan)",name):return "prereg_protocol"
              if re.search(r"(result|metric|measurement|benchmark|evaluation|score|outcome)",name):return "result_measurement"
              if re.search(r"(report|verdict|finding|falsif|claim|decision|handoff)",name):return "report_verdict"
              if p.startswith(("state/","data/manifests/","evidence/")) or re.search(r"(manifest|ledger|provenance|receipt|evidence|state)",name):return "state_provenance"
              return "context_input"

          def wanted_path(p):
              p=p.replace("\\","/")
              if Path(p).suffix.lower() not in EXT:return False
              if p.startswith((".github/",".opencode/","tools/","archive/","evidence/run-memory/")) or p in {"SPIDER_CODEX_ULTIME.md","SPIDER_ULTIMATE_CODEX.md"}:return False
              parts=p.split("/")
              # Symmetric scientific-data rule across all core research namespaces.
              if parts and parts[0].lower() in RESEARCH_LANES:return True
              if p.startswith("results/"):return p!="results/CATALOG.json"
              if p.startswith("reports/"):return len(parts)>2 and parts[1].lower() in LANES
              if p.startswith("state/"):return len(parts)>2 and parts[1].lower() in LANES
              if p.startswith("data/manifests/"):return True
              if p.startswith("evidence/frontier-one-shot/"):return True
              if p.startswith(("docs/","directives/")):return bool(K.search(p))
              return False

          def normalized_meta(paths):
              lanes=sorted({lane_for_path(x) for x in paths},key=lambda x:(LANE_ORDER.get(x,99),x))
              roles=sorted({role_for_path(x) for x in paths},key=lambda x:(ROLE_ORDER.get(x,99),x))
              return (lanes[0] if lanes else "unknown",roles[0] if roles else "context_input",lanes,roles)

          def coverage_rows(bs):
              c=Counter()
              for paths in bs.values():
                  _,_,lanes,roles=normalized_meta(paths)
                  for lane in lanes:
                      for role in roles:c[(lane,role)]+=1
              return c

          def assert_normalized_coverage(bs):
              paths={p for ps in bs.values() for p in ps}
              checks={
                  "frontier_charter":any(p.startswith("frontier/") and "/charters/" in p.lower() for p in paths),
                  "frontier_prereg":any(p.startswith("frontier/") and "prereg" in p.lower() for p in paths),
                  "frontier_report":any(p.startswith("reports/frontier/") for p in paths),
                  "intel_namespace":any(p.startswith("intel/") for p in paths),
                  "intel_report":any(p.startswith("reports/intel/") for p in paths),
                  "physics_report":any(p.startswith("reports/physics/") for p in paths),
                  "graph_report":any(p.startswith("reports/graph/") for p in paths),
                  "runtime_report":any(p.startswith("reports/runtime/") for p in paths),
              }
              missing=[k for k,v in checks.items() if not v]
              if missing:raise RuntimeError("normalized Codex coverage missing: "+", ".join(missing))
              return checks
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          s = s[:start] + replacement + s[end:]

          old_main = '    bs=substantive_blobs(); mem,excluded=run_memories(); ars=action_runs()'
          new_main = '    bs=substantive_blobs(); checks=assert_normalized_coverage(bs); role_counts=coverage_rows(bs); mem,excluded=run_memories(); ars=action_runs()'
          if old_main not in s:raise SystemExit('main selector not found')
          s=s.replace(old_main,new_main,1)

          s=s.replace('"**Included:** experiments, measurements, benchmarks, audits, gates, falsifications, negative/BLOCKED/invalid results, Runtime/Product evaluations, Frontier research, materially directional CTO findings, and architecture failures that matter for the product.\\n\\n",',
                      '"**Normalization rule:** every research namespace is treated symmetrically. Textual scientific/data artifacts under `graph/`, `physics/`, `intel/`, `runtime/`, `product/`, and `frontier/` are retained regardless of filename, alongside canonical results/reports/state/manifests. Frontier charters/preregistrations and Intel namespace inputs therefore cannot disappear merely because their filenames lack `result` or `report`.\\n\\n",\n      "**Organization only:** generated lane/role labels (`charter_question`, `prereg_protocol`, `result_measurement`, `report_verdict`, `audit_gate`, `state_provenance`, `context_input`) never rewrite source evidence; every selected source artifact remains verbatim and SHA-deduplicated.\\n\\n",',1)
          s=s.replace('"\\n## 3. Coverage manifest\\n\\n",','"\\n## 3. Coverage manifest and normalized lane/role map\\n\\n",',1)

          marker='    for n,c in sorted(wf.items(),key=lambda x:(-x[1],x[0])):parts.append(f"| {n.replace(\'|\',\'/\')} | {c} |\\n")\n'
          if marker not in s:raise SystemExit('workflow-count marker not found')
          extra = marker + '''    parts+=["\\n### 3.2 Normalized unique-blob counts by lane and role\\n\\n","| Lane | Role | Unique blobs |\\n|---|---|---:|\\n"]
          for (lane,role),count in sorted(role_counts.items(),key=lambda x:(LANE_ORDER.get(x[0][0],99),ROLE_ORDER.get(x[0][1],99),x[0])):
              parts.append(f"| {lane} | {role} | {count} |\\n")
          parts.append("\\nNormalization assertions: "+", ".join(f"{k}=PASS" for k in sorted(checks))+".\\n")
          '''
          extra='\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())+'\n'
          s=s.replace(marker,extra,1)

          loop_start=s.index('    for i,o in enumerate(sorted(bs,key=lambda x:(sorted(bs[x])[0],x)),1):')
          loop_end=s.index('    parts+=["\\n## 5. Substantive per-run memories retained verbatim\\n\\n"]',loop_start)
          loop = r'''    items=[]
          for o,ps in bs.items():
              primary_lane,primary_role,lanes,roles=normalized_meta(ps)
              items.append((primary_lane,primary_role,sorted(ps)[0],o,sorted(ps),lanes,roles))
          items.sort(key=lambda x:(LANE_ORDER.get(x[0],99),ROLE_ORDER.get(x[1],99),x[2],x[3]))
          for i,(primary_lane,primary_role,_,o,paths,lanes,roles) in enumerate(items,1):
              raw,t=blob(o)
              parts+=[f"### 4.{i} — {primary_lane} / {primary_role} — blob `{o}`\n\n",
                      "Lane label(s): "+", ".join(f"`{x}`" for x in lanes)+"\n\n",
                      "Role label(s): "+", ".join(f"`{x}`" for x in roles)+"\n\n",
                      "Historical path(s): "+", ".join(f"`{p}`" for p in paths)+f"\n\nBytes: {len(raw)}\n\n"]
              if t is None:parts.append("Non-UTF8 content remains addressable by Git blob SHA.\n\n");continue
              f=fence(t);parts.append(f+"\n"+t+("" if t.endswith("\n") else "\n")+f+"\n\n")
          '''
          loop='\n'.join(line[10:] if line.startswith('          ') else line for line in loop.splitlines())+'\n'
          s=s[:loop_start]+loop+s[loop_end:]
          s=s.replace('"\\n## 4. Verbatim result/evidence corpus from complete reachable Git history\\n\\n"','"\\n## 4. Normalized verbatim scientific/data corpus from complete reachable Git history\\n\\n"',1)

          # Syntax-check the modified builder before committing it.
          compile(s,str(p),'exec')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Remove copied research workflows from archive branch
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/*; do
            base=$(basename "$f")
            case "$base" in
              spider-codex-archive.yml|codex-normalize-once.yml) ;;
              *) rm -f "$f" ;;
            esac
          done
          rm -f .github/workflows/codex-normalize-once.yml

      - name: Commit normalized archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SPIDER Codex Archivist'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/build_spider_knowledge_codex.py .github/workflows
          git commit -m 'codex: normalize lane data and remove copied workflows'
          git push origin HEAD:archive/spider-codex-ultimate
