name: SPIDER Graph Lane

on:
  workflow_dispatch:
    inputs:
      human_note:
        description: "Optional human steering note"
        required: false
        type: string
        default: ""
      cycle_index:
        description: "Current lane cycle number"
        required: false
        type: number
        default: 1
      max_cycles:
        description: "Optional numeric cap; 0 = continue until Lane Director stops"
        required: false
        type: number
        default: 0

permissions:
  contents: write
  actions: write

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  LANE_BRANCH: lab/graph

concurrency:
  group: spider-graph-lane
  cancel-in-progress: false

jobs:
  team_graph:
    name: TEAM GRAPH
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout or initialize accepted Graph lane
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$LANE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LANE_BRANCH"
            git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          else
            git switch -C "$LANE_BRANCH"
            git push origin "HEAD:refs/heads/$LANE_BRANCH"
          fi

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH with transient network retry
        shell: bash
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          cat >> "$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'
          opencode() {
            local real="$HOME/.opencode/bin/opencode"
            local log rc
            log="$(mktemp)"
            set +e
            "$real" "$@" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              rm -f "$log"
              return 0
            fi
            if grep -Eiq '(NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|socket hang up|connection (reset|refused|closed|error)|upstream.*(reset|closed|unavailable|error)|HTTP[^0-9]*(429|502|503|504)|status[^0-9]*(429|502|503|504)|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable|TLS|SSL.*error)' "$log"; then
              echo "::warning::Transient OpenCode/Ox network error detected (exit $rc). Retrying once in 300 seconds."
              sleep 300
              rm -f "$log"
              set +e
              "$real" "$@"
              rc=$?
              set -e
              return "$rc"
            fi
            rm -f "$log"
            return "$rc"
          }
          SPIDER_OPENCODE_RETRY

      - name: Run TEAM GRAPH
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          opencode run \
            --model "$SPIDER_MODEL" \
            --agent graph_runner \
            "Run Graph lane cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}). Read SPIDER_MASTER_PROMPT.md, directives/GRAPH.md, directives/AUDITOR_GRAPH.md, docs/NEXT_GRAPH.md, docs/GRAPH_LEDGER.md and relevant accepted Graph evidence. Do real empirical work. Do not work on Physics. Do not edit SPIDER_MASTER_PROMPT.md or workflows. Never ask for interactive approval. Human steering note, subordinate to the constitution: ${HUMAN_NOTE}"

      - name: Enforce Graph scope
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -E '^(physics/|results/physics/|reports/physics/|docs/PHYSICS_LEDGER\.md$|docs/NEXT_PHYSICS\.md$|directives/PHYSICS\.md$|SPIDER_MASTER_PROMPT\.md$|\.github/workflows/)' || true)
          if [ -n "$BAD" ]; then
            echo "TEAM GRAPH crossed protected scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Persist Graph team branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/graph/${GITHUB_RUN_ID}/team"
          git config user.name "spider-graph"
          git config user.email "spider-graph@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Graph cycle ${{ inputs.cycle_index }}: team output" || true
          git push --force origin "HEAD:refs/heads/$BRANCH"

  audit_graph:
    name: INDEPENDENT AUDITOR — GRAPH
    needs: [team_graph]
    if: always() && needs.team_graph.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout accepted Graph base and mount team output
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C graph-audit-base "origin/$LANE_BRANCH"
          TEAM="cycle/graph/${GITHUB_RUN_ID}/team"
          git fetch origin "$TEAM:refs/remotes/origin/$TEAM"
          git worktree add --detach /tmp/spider_graph_team "origin/$TEAM"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH with transient network retry
        shell: bash
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          cat >> "$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'
          opencode() {
            local real="$HOME/.opencode/bin/opencode"
            local log rc
            log="$(mktemp)"
            set +e
            "$real" "$@" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              rm -f "$log"
              return 0
            fi
            if grep -Eiq '(NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|socket hang up|connection (reset|refused|closed|error)|upstream.*(reset|closed|unavailable|error)|HTTP[^0-9]*(429|502|503|504)|status[^0-9]*(429|502|503|504)|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable|TLS|SSL.*error)' "$log"; then
              echo "::warning::Transient OpenCode/Ox network error detected (exit $rc). Retrying once in 300 seconds."
              sleep 300
              rm -f "$log"
              set +e
              "$real" "$@"
              rc=$?
              set -e
              return "$rc"
            fi
            rm -f "$log"
            return "$rc"
          }
          SPIDER_OPENCODE_RETRY

      - name: Audit Graph immediately
        shell: bash
        run: |
          opencode run \
            --model "$SPIDER_MODEL" \
            --agent independent_auditor \
            "Audit Graph lane cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}). Completed team workspace: /tmp/spider_graph_team. Current checkout is the untouched accepted Graph base and is where you may write ONLY audit outputs. Read SPIDER_MASTER_PROMPT.md, directives/AUDITOR.md and directives/AUDITOR_GRAPH.md. Recompute claims and attack leakage, hand-coded decomposition, mismatched timing, weak baselines, denominator tricks, retrieval cost and transfer claims. Write reports/audit/CYCLE_${GITHUB_RUN_ID}_GRAPH.md plus compact findings if useful. Do not edit team files, workflows or constitution."

      - name: Enforce audit-only writes
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(reports/audit/|results/audit/)' || true)
          if [ -n "$BAD" ]; then
            echo "Graph Auditor wrote outside audit outputs:"
            echo "$BAD"
            exit 1
          fi

      - name: Persist Graph audit branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/graph/${GITHUB_RUN_ID}/audit"
          git config user.name "spider-auditor-graph"
          git config user.email "spider-auditor-graph@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Graph cycle ${{ inputs.cycle_index }}: independent audit" || true
          git push --force origin "HEAD:refs/heads/$BRANCH"

  graph_director:
    name: GRAPH LANE DIRECTOR
    needs: [team_graph, audit_graph]
    if: always() && needs.audit_graph.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout accepted Graph lane
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount team and audit snapshots
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          TEAM="cycle/graph/${GITHUB_RUN_ID}/team"
          AUDIT="cycle/graph/${GITHUB_RUN_ID}/audit"
          git fetch origin "$TEAM:refs/remotes/origin/$TEAM"
          git fetch origin "$AUDIT:refs/remotes/origin/$AUDIT"
          git worktree add --detach /tmp/spider_graph_team "origin/$TEAM"
          git worktree add --detach /tmp/spider_graph_audit "origin/$AUDIT"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Add OpenCode to PATH with transient network retry
        shell: bash
        run: |
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          cat >> "$BASH_ENV" <<'SPIDER_OPENCODE_RETRY'
          opencode() {
            local real="$HOME/.opencode/bin/opencode"
            local log rc
            log="$(mktemp)"
            set +e
            "$real" "$@" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              rm -f "$log"
              return 0
            fi
            if grep -Eiq '(NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|socket hang up|connection (reset|refused|closed|error)|upstream.*(reset|closed|unavailable|error)|HTTP[^0-9]*(429|502|503|504)|status[^0-9]*(429|502|503|504)|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|temporar(y|ily) unavailable|TLS|SSL.*error)' "$log"; then
              echo "::warning::Transient OpenCode/Ox network error detected (exit $rc). Retrying once in 300 seconds."
              sleep 300
              rm -f "$log"
              set +e
              "$real" "$@"
              rc=$?
              set -e
              return "$rc"
            fi
            rm -f "$log"
            return "$rc"
          }
          SPIDER_OPENCODE_RETRY

      - name: Run Graph Lane Director
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          opencode run \
            --model "$SPIDER_MODEL" \
            --agent lane_director \
            "You are GRAPH LANE DIRECTOR for cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}). TEAM=/tmp/spider_graph_team. AUDIT=/tmp/spider_graph_audit. Current checkout is persistent accepted Graph lane lab/graph. Read SPIDER_MASTER_PROMPT.md and directives/LANE_DIRECTOR.md. Integrate only Graph work that survives audit. Answer every material audit objection. Rewrite directives/GRAPH.md, directives/AUDITOR_GRAPH.md and docs/NEXT_GRAPH.md as needed; update docs/GRAPH_LEDGER.md. Write reports/director/CYCLE_${GITHUB_RUN_ID}_GRAPH.md and state/graph_loop.json with continue/reason/next_question. Do not modify Physics accepted state, workflows or constitution. Human note: ${HUMAN_NOTE}"

      - name: Enforce Graph Director scope
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -E '^(physics/|results/physics/|reports/physics/|docs/PHYSICS_LEDGER\.md$|docs/NEXT_PHYSICS\.md$|directives/PHYSICS\.md$|directives/AUDITOR_PHYSICS\.md$|SPIDER_MASTER_PROMPT\.md$|\.github/workflows/)' || true)
          if [ -n "$BAD" ]; then
            echo "Graph Lane Director crossed protected scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Advance accepted Graph lane
        shell: bash
        run: |
          git config user.name "spider-graph-director"
          git config user.email "spider-graph-director@autonomous.local"
          git add -A
          git commit -m "Graph cycle ${{ inputs.cycle_index }}: audited integration" || true
          git push origin "HEAD:refs/heads/$LANE_BRANCH"

      - name: Dispatch next Graph cycle if justified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          MAX_CYCLES: ${{ inputs.max_cycles }}
        shell: bash
        run: |
          CONTINUE=false
          if [ -f state/graph_loop.json ]; then
            CONTINUE=$(jq -r '.continue // false' state/graph_loop.json 2>/dev/null || echo false)
          fi
          NEXT=$((CYCLE_INDEX + 1))
          WITHIN_CAP=false
          if [ "$MAX_CYCLES" -eq 0 ] || [ "$CYCLE_INDEX" -lt "$MAX_CYCLES" ]; then
            WITHIN_CAP=true
          fi
          echo "Director continue=$CONTINUE; within_cap=$WITHIN_CAP"
          if [ "$CONTINUE" = "true" ] && [ "$WITHIN_CAP" = "true" ]; then
            gh workflow run graph-loop.yml --ref main \
              -f human_note="$HUMAN_NOTE" \
              -f cycle_index="$NEXT" \
              -f max_cycles="$MAX_CYCLES"
          fi
