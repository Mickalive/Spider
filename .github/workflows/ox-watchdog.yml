name: SPIDER Ox Watchdog

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Graph Lane"
      - "SPIDER Physics Lane"
      - "SPIDER Intel Research Lane"
      - "SPIDER Product and Beta Lane"
      - "SPIDER Product Beta Repair"
      - "SPIDER Runtime Lane"
      - "SPIDER Critical CTO Council"
      - "SPIDER Frontier Research Team"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-ox-watchdog
  cancel-in-progress: true

jobs:
  recover_transient_ox_failures:
    name: Recover transient Ox and runner failures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run transient failures without resurrecting real or manual failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          recover_workflow() {
            local workflow="$1"
            local active latest run_id conclusion logs log_rc

            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json databaseId,status,createdAt \
              --jq '[.[] | select(.status != "completed")] | sort_by(.createdAt) | last // empty' 2>/dev/null || true)
            if [[ -n "$active" ]]; then
              echo "$workflow: active run exists; watchdog does not interrupt potentially valid work."
              return 0
            fi

            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json databaseId,status,conclusion,createdAt \
              --jq '[.[] | select(.status == "completed")] | sort_by(.createdAt) | last // empty' 2>/dev/null || true)
            if [[ -z "$latest" ]]; then
              echo "$workflow: no completed run to inspect."
              return 0
            fi

            run_id=$(jq -r '.databaseId' <<<"$latest")
            conclusion=$(jq -r '.conclusion // ""' <<<"$latest")
            case "$conclusion" in
              failure|timed_out|cancelled) ;;
              *)
                echo "$workflow: latest completed run $run_id concluded $conclusion; no recovery."
                return 0
                ;;
            esac

            set +e
            logs=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log 2>&1)
            log_rc=$?
            set -e
            if [[ "$log_rc" -ne 0 ]]; then
              echo "::warning::$workflow: unable to read logs for run $run_id; refusing blind retry."
              return 0
            fi

            if [[ "$conclusion" == cancelled ]] \
               && grep -Eiq '(runner has received a shutdown signal|runner service is stopped|hosted runner.*shutdown|lost communication with the runner|operation was canceled.*runner)' <<<"$logs"; then
              echo "::warning::$workflow: run $run_id was cancelled by runner infrastructure; re-running affected jobs."
              gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed || \
                gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" || \
                echo "::warning::$workflow: GitHub refused runner-shutdown recovery for run $run_id."
              return 0
            fi

            if grep -Fq 'SPIDER_TRANSIENT_OX_EXHAUSTED' <<<"$logs"; then
              echo "::warning::$workflow: explicit transient Ox exhaustion in run $run_id; re-running affected jobs."
              gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed || \
                echo "::warning::$workflow: GitHub refused failed-job rerun for run $run_id; no blind full-run replay performed."
              return 0
            fi

            if grep -Eiq '(opencode run|OpenCode|x-preview-f-free|Ox)' <<<"$logs" \
               && grep -Eiq '(network_error|NetworkError|network error|fetch failed|APIConnectionError|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|timed out|connection reset|connection closed|temporar(y|ily) unavailable|HTTP[^0-9]*(429|500|502|503|504)|status[^0-9]*(429|500|502|503|504)|too many requests|rate.?limit|service unavailable|bad gateway|gateway timeout|upstream.*(reset|closed|unavailable|error))' <<<"$logs"; then
              echo "::warning::$workflow: run $run_id ($conclusion) has OpenCode/Ox + explicit transient network signature; re-running affected jobs."
              gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed || \
                echo "::warning::$workflow: GitHub refused failed-job rerun for run $run_id; no blind full-run replay performed."
              return 0
            fi

            echo "$workflow: run $run_id concluded $conclusion without defensible infrastructure evidence; watchdog will not resurrect it."
          }

          recover_workflow graph-loop.yml
          recover_workflow physics-loop.yml
          recover_workflow intel-loop.yml
          recover_workflow product-loop.yml
          recover_workflow product-beta-repair.yml
          recover_workflow runtime-loop.yml
          recover_workflow cto-council.yml
          recover_workflow frontier-research.yml
