name: SPIDER Critical CTO Council

on:
  workflow_run:
    workflows:
      - "SPIDER Graph Lane"
      - "SPIDER Physics Lane"
      - "SPIDER Intel Research Lane"
      - "SPIDER Product and Beta Lane"
      - "SPIDER Runtime Lane"
      - "SPIDER Frontier Research Team"
    types: [completed]
  schedule:
    - cron: "43 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cto-council.yml'
      - '.github/workflows/frontier-research.yml'
      - '.github/scripts/validate-cto-frontier-charters.py'
      - 'SPIDER_ARCHITECTURE_V2.md'
      - 'SPIDER_ARCHITECTURE_V3.md'
      - 'directives/CAPABILITY_CAPSULE.md'
      - 'docs/roles/CHIEF_CTO.md'
      - 'docs/roles/FRONTIER_RESEARCH_*.md'
      - '.opencode/agents/chief_cto.md'
      - '.opencode/agents/cto_*.md'
      - '.opencode/agents/frontier_research_*.md'
      - 'evidence/run-memory/CTO_FEED.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: spider-critical-cto-council
  cancel-in-progress: false

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  CTO_BRANCH: lab/cto

jobs:
  critical_review:
    name: CHIEF CTO — GLOBAL RESEARCH PORTFOLIO REVIEW
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      cto_commit: ${{ steps.persist.outputs.cto_commit }}
    steps:
      - name: Checkout current control plane
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Restore prior CTO memory without importing old control plane
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$CTO_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$CTO_BRANCH:refs/remotes/origin/$CTO_BRANCH"
            git worktree add --detach /tmp/spider_cto_prev "origin/$CTO_BRANCH"
            cp /tmp/spider_cto_prev/docs/CTO_LEDGER.md docs/CTO_LEDGER.md 2>/dev/null || true
            for lane in GRAPH PHYSICS INTEL PRODUCT RUNTIME FRONTIER; do
              cp "/tmp/spider_cto_prev/docs/CTO_TO_${lane}.md" "docs/CTO_TO_${lane}.md" 2>/dev/null || true
            done
            cp /tmp/spider_cto_prev/state/cto_direction.json state/cto_direction.json 2>/dev/null || true
          fi

      - name: Mount latest accepted core-lane snapshots
        shell: bash
        run: |
          for lane in graph physics intel product runtime; do
            B="lab/$lane"
            if git ls-remote --exit-code --heads origin "refs/heads/$B" >/dev/null 2>&1; then
              git fetch origin "$B:refs/remotes/origin/$B"
              git worktree add --detach "/tmp/spider_$lane" "origin/$B"
            else
              mkdir -p "/tmp/spider_$lane"
            fi
          done

      - name: Mount all accepted Frontier teams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider_frontier
          : > /tmp/spider_frontier/INDEX.tsv
          git ls-remote --heads origin 'refs/heads/lab/frontier/*' | while read -r sha ref; do
            team="${ref#refs/heads/lab/frontier/}"
            [[ "$team" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]] || continue
            git fetch origin "$ref:refs/remotes/origin/lab/frontier/$team"
            git worktree add --detach "/tmp/spider_frontier/$team" "origin/lab/frontier/$team"
            printf '%s\t%s\n' "$team" "$sha" >> /tmp/spider_frontier/INDEX.tsv
          done

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Run critical CTO council
        shell: bash
        run: |
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent chief_cto \
            "Run a GLOBAL SPIDER CTO portfolio review. Accepted core snapshots only: Graph=/tmp/spider_graph, Physics=/tmp/spider_physics, Intel=/tmp/spider_intel, Product=/tmp/spider_product, Runtime=/tmp/spider_runtime. Accepted Frontier teams=/tmp/spider_frontier with INDEX.tsv. ALSO inspect evidence/run-memory/CTO_FEED.json and INDEX.md when present: this is distilled Actions-log memory and is a research/operations RADAR only. Preserve every finding's evidence_status; LOG_ONLY_UNAUDITED/DURABLE_UNAUDITED/OPERATIONAL_DIAGNOSTIC may justify a validation experiment, repair, Intel request or Frontier charter, never an accepted scientific claim. Use cto_* subagents in fresh contexts. Preserve all scientific verdicts. Identify uncovered high-upside domains, forgotten run-level clues, recurring cross-team failure signatures and duplicated work. Physics WP-006 may remain falsified while genuinely orthogonal Physics questions continue. You have authority under Architecture V3 to charter multiple independent Frontier teams. Write complete CREATE/CONTINUE/PAUSE/TERMINATE/MERGE charters with monotonic charter_version when justified. For a Physics-domain Frontier team, make the `domain` field explicitly contain the word Physics so mechanical portfolio coverage can be checked. Obey the exact JSON machine contract in docs/roles/CHIEF_CTO.md and validate field TYPES as well as key presence before finishing. No artificial token-cost cap; optimize independent search coverage, information gain and work-compression leverage. Write all required CTO state and handoffs."

      - name: Enforce CTO-only writes
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(docs/CTO_LEDGER\.md$|docs/CTO_TO_(GRAPH|PHYSICS|INTEL|PRODUCT|RUNTIME|FRONTIER)\.md$|state/cto_direction\.json$)' || true)
          if [[ -n "$BAD" ]]; then
            echo "Chief CTO wrote outside CTO scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Validate CTO state and Frontier charters
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-cto-frontier-charters.py \
            state/cto_direction.json \
            /tmp/spider_physics/state/physics_loop.json

          test -f docs/CTO_LEDGER.md || { echo "::error::Missing CTO ledger"; exit 1; }
          for lane in GRAPH PHYSICS INTEL PRODUCT RUNTIME FRONTIER; do
            test -f "docs/CTO_TO_${lane}.md" || { echo "::error::Missing CTO_TO_${lane}.md"; exit 1; }
          done

      - name: Advance accepted CTO advisory branch
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-chief-cto"
          git config user.email "spider-chief-cto@autonomous.local"

          PREV_CTO=""
          if git show-ref --verify --quiet "refs/remotes/origin/$CTO_BRANCH"; then
            PREV_CTO=$(git rev-parse "refs/remotes/origin/$CTO_BRANCH")
          fi

          # Stamp durable provenance into file content; commit messages alone
          # are insufficient because Actions logs may later be pruned.
          jq --argjson run_id "$GITHUB_RUN_ID" --arg prev "$PREV_CTO" \
            '.provenance = ((.provenance // {}) + {source_run_id:$run_id, previous_cto_commit:(if $prev=="" then null else $prev end), generated_at_utc:(now|todateiso8601)})' \
            state/cto_direction.json > /tmp/cto_direction.stamped.json
          mv /tmp/cto_direction.stamped.json state/cto_direction.json

          rm -rf /tmp/cto_generated
          mkdir -p /tmp/cto_generated/docs /tmp/cto_generated/state
          cp docs/CTO_LEDGER.md docs/CTO_TO_*.md /tmp/cto_generated/docs/
          cp state/cto_direction.json /tmp/cto_generated/state/

          # The working tree currently contains generated CTO outputs on top of
          # main. They are safely copied to /tmp, so clear them before switching
          # to the durable CTO lineage; otherwise Git may reject the switch.
          git reset --hard HEAD

          # Preserve CTO history append-only. The reasoning session used the
          # current main control plane, but durable advisory outputs are laid
          # onto the previous accepted CTO tip and pushed fast-forward only.
          if [[ -n "$PREV_CTO" ]]; then
            git switch -C cto-output "$PREV_CTO"
          else
            git switch -C cto-output main
          fi
          mkdir -p docs state
          cp /tmp/cto_generated/docs/* docs/
          cp /tmp/cto_generated/state/cto_direction.json state/cto_direction.json
          git add docs/CTO_LEDGER.md docs/CTO_TO_*.md state/cto_direction.json
          git commit -m "CTO global portfolio review ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$CTO_BRANCH"
          echo "cto_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch new or revised Frontier charters
        env:
          GH_TOKEN: ${{ github.token }}
          CTO_COMMIT: ${{ steps.persist.outputs.cto_commit }}
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.research_portfolio.frontier_team_charters[] | select(.status=="CREATE" or .status=="CONTINUE")' state/cto_direction.json | while read -r charter; do
            id=$(jq -r '.team_id' <<<"$charter")
            version=$(jq -r '.charter_version' <<<"$charter")
            title="Frontier ${id} v${version}"

            accepted=0
            if gh api "repos/${GITHUB_REPOSITORY}/contents/state/frontier/${id}.json?ref=lab/frontier/${id}" >/tmp/frontier_state.json 2>/dev/null; then
              accepted=$(jq -r '.content' /tmp/frontier_state.json | tr -d '\n' | base64 -d | jq -r '.accepted_charter_version // 0' 2>/dev/null || echo 0)
            fi
            if [[ "$accepted" -ge "$version" ]]; then
              echo "$id v$version already accepted; no dispatch."
              continue
            fi

            existing=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow frontier-research.yml --limit 100 \
              --json displayTitle,status,conclusion \
              | jq --arg t "$title" '[.[] | select(.displayTitle==$t)] | length')
            if [[ "$existing" -gt 0 ]]; then
              echo "$id v$version already has a workflow run; no duplicate dispatch."
              continue
            fi

            echo "Dispatching CTO Frontier charter $id v$version from $CTO_COMMIT"
            gh workflow run frontier-research.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f team_id="$id" \
              -f charter_version="$version" \
              -f cto_commit="$CTO_COMMIT"
          done