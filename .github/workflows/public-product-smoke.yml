name: SPIDER public-product end-to-end smoke
on:
  pull_request:
    paths:
      - "src/spider/public_tasks.py"
      - "src/spider/public_learning.py"
      - "scripts/demo_public_reuse.py"
      - "tests/test_public_product_demo.py"
      - ".github/workflows/public-product-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-public-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact kernel and invalidation semantics (offline, no LLM)
        run: PYTHONPATH=src python -m unittest tests.test_public_product_demo -v
      - name: Live read-only: observe, learn, store, reuse, independently verify
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/demo_public_reuse.py --output /tmp/spider-product-smoke.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/spider-product-smoke.json'))
          assert result['success'] is True
          assert result['training_examples'] == 2
          assert len(result['holdout']) == 2
          assert all(x['verified'] for x in result['holdout'])
          assert result['claims']['llm_cost_savings_demonstrated'] is False
          print('SPIDER_PRODUCT_PUBLIC_LEARNING_REUSE_VERIFIED_WITHOUT_PAID_AGENTS')
          PY
