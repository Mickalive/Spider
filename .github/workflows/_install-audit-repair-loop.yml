name: SPIDER Install Audit Repair Loop

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/install-audit-repair-loop.json'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply audited repair-loop patch
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p .spider/maintenance
          python .github/scripts/install-audit-repair-loop.py > .spider/maintenance/audit-repair-install.log 2>&1
          rc=$?
          cat .spider/maintenance/audit-repair-install.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repair-loop architecture
        if: steps.patch.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .spider/maintenance/audit-repair-install.log
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add -A
          git commit -m "workflow: route failed audits back to producing agents"
          git push origin HEAD:main

      - name: Persist installer diagnosis on failure
        if: steps.patch.outputs.rc != '0'
        shell: bash
        run: |
          set -euo pipefail
          LOG=$(cat .spider/maintenance/audit-repair-install.log)
          git reset --hard HEAD
          mkdir -p .spider/maintenance
          printf '%s\n' "$LOG" > .spider/maintenance/audit-repair-install.log
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add .spider/maintenance/audit-repair-install.log
          git commit -m "maintenance: record audit repair-loop installer failure" || true
          git push origin HEAD:main
          exit 1
