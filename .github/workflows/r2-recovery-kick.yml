name: SPIDER R2 Recovery Kick

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/r2-recovery-kick.yml"

permissions:
  contents: read
  actions: write

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume all independent lanes through the normal pulse
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run factory-pulse.yml --repo "$GITHUB_REPOSITORY" --ref main
