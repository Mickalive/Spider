name: SPIDER Runtime Bootstrap Dedup Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-dedup-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel only duplicate pending Runtime bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 32864608446 --repo "$GITHUB_REPOSITORY" || true
      - name: Remove this one-shot workflow
        run: |
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git rm .github/workflows/runtime-dedup-once.yml
          git commit -m "maintenance: remove Runtime dedup one-shot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
