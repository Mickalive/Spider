name: SPIDER Historical Run Ledger Recovery

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional specific run id; empty = drain historical backlog"
        required: false
        type: string
        default: ""
  workflow_run:
    workflows:
      - "SPIDER Graph Lane"
      - "SPIDER Physics Lane"
      - "SPIDER Intel Research Lane"
      - "SPIDER Product and Beta Lane"
      - "SPIDER Product Beta Repair"
      - "SPIDER Product Engineering Loop"
      - "SPIDER Product Engineering Failure Review"
      - "SPIDER Runtime Lane"
      - "SPIDER Frontier Research Team"
      - "SPIDER Critical CTO Council"
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: spider-historical-ledger-recovery
  cancel-in-progress: false

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  BACKFILL_BATCH: 6
  ARCHIVE_RELEASE_TAG: spider-actions-data-archive-v1

jobs:
  recover:
    name: Recover historical Actions data into canonical results
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assert accepted-lab sync is frozen
        shell: bash
        run: |
          set -euo pipefail
          marker=evidence/ledger-integration/ACCEPTED_LAB_SYNC_DONE.json
          test -f "$marker" || { echo "::error::Accepted lab sync marker missing"; exit 1; }
          jq -e '.sync_complete == true and .sync_commit == "d927b6a146d32ca451ed2294792be213caa4d4e2"' "$marker" >/dev/null

      - name: Fetch all durable refs
        shell: bash
        run: git fetch -q origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Select historical runs not yet integrated
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ inputs.run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spider_run_evidence evidence/ledger-integration/runs
          : > /tmp/spider_run_evidence/targets.txt

          already_done() {
            local id="$1" r="evidence/ledger-integration/runs/${id}.json"
            [[ -f "$r" ]] && jq -e '.integration_complete == true and .all_substantive_data_copied_to_repo == true' "$r" >/dev/null 2>&1
          }

          add_target() {
            local id="$1"
            [[ -n "$id" && "$id" != "$GITHUB_RUN_ID" ]] || return 0
            already_done "$id" && return 0
            grep -qx "$id" /tmp/spider_run_evidence/targets.txt 2>/dev/null && return 0
            echo "$id" >> /tmp/spider_run_evidence/targets.txt
          }

          has_source() {
            local id="$1"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '.status' 2>/dev/null | grep -qx completed; then return 0; fi
            [[ -f "evidence/run-archive/manifests/${id}.json" ]]
          }

          if [[ -n "$INPUT_RUN_ID" ]]; then
            has_source "$INPUT_RUN_ID" && add_target "$INPUT_RUN_ID"
          elif [[ "$EVENT_NAME" == workflow_run && -n "$SOURCE_RUN_ID" ]]; then
            has_source "$SOURCE_RUN_ID" && add_target "$SOURCE_RUN_ID"
          else
            while read -r manifest; do
              [[ "$(wc -l < /tmp/spider_run_evidence/targets.txt)" -ge "$BACKFILL_BATCH" ]] && break
              [[ -f "$manifest" ]] || continue
              id=$(jq -r '.run_id // empty' "$manifest")
              [[ -n "$id" ]] && add_target "$id"
            done < <(find evidence/run-archive/manifests -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort -V)

            while IFS=$'\t' read -r created id name; do
              [[ "$(wc -l < /tmp/spider_run_evidence/targets.txt)" -ge "$BACKFILL_BATCH" ]] && break
              case "$name" in
                "SPIDER Graph Lane"|"SPIDER Physics Lane"|"SPIDER Intel Research Lane"|"SPIDER Runtime Lane"|"SPIDER Product and Beta Lane"|"SPIDER Product Beta Repair"|"SPIDER Product Engineering Loop"|"SPIDER Product Engineering Failure Review"|"SPIDER Frontier Research Team"|"SPIDER Critical CTO Council") add_target "$id" ;;
              esac
            done < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?status=completed&per_page=100" \
                --jq '.workflow_runs[] | [.created_at,.id,.name] | @tsv' | sort
            )
          fi

          sort -u -o /tmp/spider_run_evidence/targets.txt /tmp/spider_run_evidence/targets.txt
          count=$(wc -l < /tmp/spider_run_evidence/targets.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count run(s): $(tr '\n' ' ' < /tmp/spider_run_evidence/targets.txt)"

      - name: Snapshot raw provenance and recover exact result files
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          lane_for_name() {
            case "$1" in
              *Graph*) echo graph ;;
              *Physics*) echo physics ;;
              *Intel*) echo intel ;;
              *Runtime*) echo runtime ;;
              *Product*) echo product ;;
              *CTO*) echo cto ;;
              *Frontier*) echo frontier ;;
              *) echo frontier ;;
            esac
          }

          copy_safe() {
            local src="$1" dest="$2" blockers="$3"
            [[ -f "$src" ]] || return 0
            local size
            size=$(stat -c '%s' "$src")
            if (( size > 5242880 )); then
              echo "$src | $size bytes | exceeds 5 MiB Git gate" >> "$blockers"
              return 0
            fi
            mkdir -p "$(dirname "$dest")"
            cp "$src" "$dest"
          }

          copy_result_from_ref() {
            local ref="$1" path="$2" id="$3" lane="$4" blockers="$5"
            local size
            size=$(git cat-file -s "${ref}:${path}" 2>/dev/null || echo 0)
            if (( size > 5242880 )); then
              echo "$path | $size bytes | result exceeds 5 MiB Git gate" >> "$blockers"
              return 0
            fi
            mkdir -p "$(dirname "$path")"
            if [[ ! -e "$path" ]]; then
              git show "${ref}:${path}" > "$path"
              echo "$path" >> "/tmp/spider_run_evidence/$id/copied_result_paths.txt"
              return 0
            fi
            current=$(git hash-object "$path")
            source=$(git rev-parse "${ref}:${path}")
            if [[ "$current" == "$source" ]]; then
              echo "$path" >> "/tmp/spider_run_evidence/$id/copied_result_paths.txt"
              return 0
            fi
            base=$(basename "$path")
            alt="results/${lane}/run_${id}__${base}"
            git show "${ref}:${path}" > "$alt"
            echo "$alt" >> "/tmp/spider_run_evidence/$id/copied_result_paths.txt"
          }

          while read -r id; do
            [[ -n "$id" ]] || continue
            d="/tmp/spider_run_evidence/$id"
            mkdir -p "$d/artifacts_extracted" "$d/actions_logs_extracted"
            : > "$d/source_blockers.txt"
            : > "$d/raw_copy_blockers.txt"
            : > "$d/copied_result_paths.txt"

            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" > "$d/run.json" 2>/dev/null; then
              echo live > "$d/source_kind.txt"
              gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" > "$d/jobs.json" || echo '{"jobs":[]}' > "$d/jobs.json"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" > "$d/artifacts.json" || echo '{"artifacts":[]}' > "$d/artifacts.json"
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --log > "$d/logs-readable.txt" 2> "$d/log_error.txt" || echo "readable combined log unavailable" >> "$d/source_blockers.txt"
              if curl --fail --location --retry 3 --retry-all-errors \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}/logs" \
                -o "$d/actions-logs.zip"; then
                unzip -q "$d/actions-logs.zip" -d "$d/actions_logs_extracted" || echo "raw Actions log ZIP extraction failed" >> "$d/source_blockers.txt"
              else
                echo "raw Actions log ZIP unavailable" >> "$d/source_blockers.txt"
              fi
              total=$(jq -r '.total_count // 0' "$d/artifacts.json")
              if (( total > 0 )); then
                gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "$d/artifacts_extracted" || echo "one or more Actions artifacts unavailable" >> "$d/source_blockers.txt"
              fi
            else
              echo temporary_archive > "$d/source_kind.txt"
              manifest="evidence/run-archive/manifests/${id}.json"
              if [[ ! -f "$manifest" ]]; then
                echo "missing live run and temporary archive manifest" >> "$d/source_blockers.txt"
                continue
              fi
              asset=$(jq -r '.release_asset.name' "$manifest")
              mkdir -p "$d/archive_download"
              if ! gh release download "$ARCHIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$d/archive_download"; then
                echo "temporary recovery asset unavailable" >> "$d/source_blockers.txt"
                continue
              fi
              tar -xzf "$d/archive_download/$asset" -C "$d/archive_download"
              src="$d/archive_download/$id"
              cp "$src/run.json" "$d/run.json"
              cp "$src/jobs-pages.json" "$d/jobs.json" 2>/dev/null || echo '{"jobs":[]}' > "$d/jobs.json"
              cp "$src/artifacts.json" "$d/artifacts.json" 2>/dev/null || echo '{"artifacts":[]}' > "$d/artifacts.json"
              cp "$src/logs-readable.txt" "$d/logs-readable.txt" 2>/dev/null || true
              if [[ -f "$src/actions-logs.zip" ]]; then
                unzip -q "$src/actions-logs.zip" -d "$d/actions_logs_extracted" || echo "raw Actions log ZIP extraction failed" >> "$d/source_blockers.txt"
              else
                echo "temporary archive lacks raw Actions log ZIP" >> "$d/source_blockers.txt"
              fi
              find "$src/artifacts" -maxdepth 1 -type f -name '*.zip' 2>/dev/null | while read -r z; do
                out="$d/artifacts_extracted/$(basename "$z" .zip)"
                mkdir -p "$out"
                unzip -q "$z" -d "$out" || echo "artifact ZIP extraction failed: $(basename "$z")" >> "$d/source_blockers.txt"
              done
            fi

            name=$(jq -r '.name // "UNKNOWN"' "$d/run.json" 2>/dev/null || echo UNKNOWN)
            lane=$(lane_for_name "$name")
            echo "$lane" > "$d/lane.txt"
            raw="evidence/actions-runs/${id}"
            mkdir -p "$raw"

            copy_safe "$d/run.json" "$raw/run.json" "$d/raw_copy_blockers.txt"
            copy_safe "$d/jobs.json" "$raw/jobs.json" "$d/raw_copy_blockers.txt"
            copy_safe "$d/artifacts.json" "$raw/artifacts.json" "$d/raw_copy_blockers.txt"
            copy_safe "$d/logs-readable.txt" "$raw/logs-readable.txt" "$d/raw_copy_blockers.txt"

            while IFS= read -r -d '' f; do
              rel="${f#$d/actions_logs_extracted/}"
              copy_safe "$f" "$raw/actions-logs/$rel" "$d/raw_copy_blockers.txt"
            done < <(find "$d/actions_logs_extracted" -type f -print0)
            while IFS= read -r -d '' f; do
              rel="${f#$d/artifacts_extracted/}"
              copy_safe "$f" "$raw/artifacts/$rel" "$d/raw_copy_blockers.txt"
            done < <(find "$d/artifacts_extracted" -type f -print0)

            git ls-remote --heads origin | awk -v id="$id" 'index($2,id)>0 {print $1"\t"$2}' > "$d/refs.txt" || true
            while IFS=$'\t' read -r sha ref; do
              [[ -n "${ref:-}" ]] || continue
              branch="${ref#refs/heads/}"
              git fetch -q origin "$ref:refs/remotes/origin/$branch" || continue
              remote="refs/remotes/origin/$branch"
              git ls-tree -r --name-only "$remote" -- "results/$lane" | while read -r path; do
                [[ -n "$path" ]] || continue
                copy_result_from_ref "$remote" "$path" "$id" "$lane" "$d/raw_copy_blockers.txt"
              done
            done < "$d/refs.txt"

            jq -n \
              --argjson run_id "$id" \
              --arg source_kind "$(cat "$d/source_kind.txt")" \
              --arg lane "$lane" \
              --arg workflow_name "$name" \
              --arg raw_path "$raw" \
              '{run_id:$run_id,source_kind:$source_kind,lane:$lane,workflow_name:$workflow_name,raw_evidence_path:$raw_path}' \
              > "$d/recovery_context.json"
          done < /tmp/spider_run_evidence/targets.txt

      - name: Install OpenCode
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Integrate substantive results and memory
        id: semantic
        if: steps.targets.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          IDS=$(tr '\n' ',' < /tmp/spider_run_evidence/targets.txt | sed 's/,$//')
          bash .github/scripts/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent evidence_curator \
            "Recover Actions runs ${IDS}. Canonical result data lives ONLY in results/. Exact surviving result files may already have been copied there. Put narrative analysis in reports/, cumulative memory in docs/*_LEDGER.md, raw provenance in evidence/, and run indexes in evidence/run-memory/. For every run create/update evidence/run-memory/runs/<id>.json with canonical_result_paths (non-empty paths under results/), report_path and ledger_paths. Never create the deletion receipt."

      - name: Finalize receipts without discarding partial recovery
        if: steps.targets.outputs.count != '0'
        env:
          SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/ledger-integration/runs evidence/run-memory/runs

          while read -r id; do
            [[ -n "$id" ]] || continue
            d="/tmp/spider_run_evidence/$id"
            lane=$(cat "$d/lane.txt" 2>/dev/null || echo frontier)
            context="$d/recovery_context.json"
            name=$(jq -r '.workflow_name // "UNKNOWN"' "$context" 2>/dev/null || echo UNKNOWN)
            raw="evidence/actions-runs/${id}"
            memory="evidence/run-memory/runs/${id}.json"
            fallback="results/${lane}/run_${id}_recovery_pending.json"

            if [[ ! -f "$memory" ]]; then
              mkdir -p "$(dirname "$fallback")"
              jq -n \
                --argjson run_id "$id" \
                --arg workflow_name "$name" \
                --arg lane "$lane" \
                --arg raw_evidence_path "$raw" \
                --arg semantic_outcome "$SEMANTIC_OUTCOME" \
                '{run_id:$run_id,workflow_name:$workflow_name,lane:$lane,recovery_status:"SEMANTIC_INTEGRATION_PENDING",semantic_outcome:$semantic_outcome,raw_evidence_path:$raw_evidence_path,claim_ceiling:"UNASSESSED",note:"Durable provenance fallback only; not a scientific verdict."}' \
                > "$fallback"
              jq -n \
                --argjson run_id "$id" \
                --arg fallback "$fallback" \
                --arg raw "$raw" \
                '{run_id:$run_id,canonical_result_paths:[$fallback],report_path:"",ledger_paths:[],epistemic_status:"OPERATIONAL_DIAGNOSTIC",raw_evidence_path:$raw,distillation_complete:false}' \
                > "$memory"
            fi

            result_paths_ok=true
            mapfile -t result_paths < <(jq -r '.canonical_result_paths[]? // empty' "$memory" 2>/dev/null)
            if (( ${#result_paths[@]} == 0 )); then result_paths_ok=false; fi
            for p in "${result_paths[@]}"; do
              [[ "$p" == results/* && -f "$p" ]] || result_paths_ok=false
            done

            report=$(jq -r '.report_path // empty' "$memory" 2>/dev/null || true)
            report_ok=false
            [[ -n "$report" && "$report" == reports/* && -f "$report" ]] && grep -Fq "$id" "$report" && report_ok=true

            ledger_ok=true
            mapfile -t ledgers < <(jq -r '.ledger_paths[]? // empty' "$memory" 2>/dev/null)
            if (( ${#ledgers[@]} == 0 )); then ledger_ok=false; fi
            for ledger in "${ledgers[@]}"; do
              [[ "$ledger" == docs/*_LEDGER.md && -f "$ledger" ]] || { ledger_ok=false; continue; }
              grep -Fq "$id" "$ledger" || ledger_ok=false
            done

            source_blockers=false
            raw_blockers=false
            [[ -s "$d/source_blockers.txt" ]] && source_blockers=true
            [[ -s "$d/raw_copy_blockers.txt" ]] && raw_blockers=true

            complete=false
            copied=false
            safe=false
            if [[ "$SEMANTIC_OUTCOME" == success && "$result_paths_ok" == true && "$report_ok" == true && "$ledger_ok" == true ]]; then
              complete=true
            fi
            if [[ "$complete" == true && "$source_blockers" == false && "$raw_blockers" == false ]]; then
              copied=true
              safe=true
            fi

            jq -n \
              --argjson run_id "$id" \
              --arg workflow_name "$name" \
              --arg lane "$lane" \
              --arg semantic_outcome "$SEMANTIC_OUTCOME" \
              --arg report_path "$report" \
              --arg memory_path "$memory" \
              --arg raw_path "$raw" \
              --argjson result_paths "$(printf '%s\n' "${result_paths[@]}" | jq -Rsc 'split("\n")|map(select(length>0))')" \
              --argjson ledger_paths "$(printf '%s\n' "${ledgers[@]}" | jq -Rsc 'split("\n")|map(select(length>0))')" \
              --argjson integration_complete "$complete" \
              --argjson all_copied "$copied" \
              --argjson safe "$safe" \
              --argjson source_blockers "$source_blockers" \
              --argjson raw_copy_blockers "$raw_blockers" \
              '{schema:"SPIDER canonical run recovery receipt v3",run_id:$run_id,workflow_name:$workflow_name,lane:$lane,semantic_outcome:$semantic_outcome,integration_complete:$integration_complete,all_substantive_data_copied_to_repo:$all_copied,safe_to_delete_actions_run:$safe,result_paths:$result_paths,report_path:$report_path,ledger_paths:$ledger_paths,run_memory_path:$memory_path,raw_evidence_path:$raw_path,source_blockers_present:$source_blockers,raw_copy_blockers_present:$raw_copy_blockers,deletion_rule:"Only safe_to_delete_actions_run=true authorizes Actions deletion. Partial recovery is persisted and is not a workflow failure."}' \
              > "evidence/ledger-integration/runs/${id}.json"
          done < /tmp/spider_run_evidence/targets.txt

      - name: Enforce storage ontology
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$({ git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } | sort -u)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(results/|reports/|docs/[A-Z_]+_LEDGER\.md|evidence/actions-runs/|evidence/run-memory/|evidence/ledger-integration/)' || true)
          if [[ -n "$BAD" ]]; then
            echo "Historical recovery wrote outside canonical storage ontology:"
            echo "$BAD"
            exit 1
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^reports/.*/recovered/'; then
            echo "::error::Parallel recovered result silo under reports/ is forbidden."
            exit 1
          fi

      - name: Persist every recovered byte even when semantic integration is partial
        if: steps.targets.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name spider-ledger-recovery
          git config user.email spider-ledger-recovery@autonomous.local
          git add results reports docs evidence/actions-runs evidence/run-memory evidence/ledger-integration
          git commit -m "evidence: recover historical Actions runs $(tr '\n' ',' < /tmp/spider_run_evidence/targets.txt | sed 's/,$//')" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*5))
          done
          exit 1

      - name: Continue draining backlog
        if: steps.targets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          git reset --hard origin/main
          remaining=0
          while read -r manifest; do
            [[ -f "$manifest" ]] || continue
            id=$(jq -r '.run_id // empty' "$manifest")
            [[ -n "$id" ]] || continue
            receipt="evidence/ledger-integration/runs/${id}.json"
            if [[ ! -f "$receipt" ]] || ! jq -e '.integration_complete == true and .all_substantive_data_copied_to_repo == true' "$receipt" >/dev/null 2>&1; then
              remaining=$((remaining+1))
            fi
          done < <(find evidence/run-archive/manifests -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort -V)

          if (( remaining > 0 )); then
            echo "Historical staging entries still requiring canonical integration: $remaining"
            gh workflow run evidence-curator.yml --repo "$GITHUB_REPOSITORY" -f run_id=""
          else
            echo "Historical staging backlog fully integrated."
          fi