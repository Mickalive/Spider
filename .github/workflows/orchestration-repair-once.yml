name: SPIDER One-Time Orchestration Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orchestration-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply surgical orchestration fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/orchestration-repair-once.py
          git diff --check
          grep -q 'git status --porcelain -uall' .github/workflows/frontier-research.yml
          grep -q 'Recover an incomplete Frontier audit invocation' .github/workflows/frontier-research.yml
          grep -q 'PRODUCT_REQUEST_PRE_SHA' .github/workflows/product-loop.yml
          grep -q 'Portée des one-shots humains' docs/roles/CHIEF_CTO.md

      - name: Commit fixes and remove one-time machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-orchestration-repair"
          git config user.email "spider-orchestration-repair@autonomous.local"
          git rm .github/workflows/orchestration-repair-once.yml .github/scripts/orchestration-repair-once.py
          git add .github/workflows/frontier-research.yml .github/workflows/product-loop.yml docs/roles/CHIEF_CTO.md .opencode/agents/chief_cto.md
          git commit -m "infra: harden recurring lanes and charter-local one-shots"
          git pull --rebase origin main
          git push origin HEAD:main
