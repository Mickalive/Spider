name: SPIDER Repo Hygiene

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Run Evidence Curator"
      - "SPIDER Actions Data Migration"
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene.yml'
      - 'evidence/run-archive/manifests/**'
      - 'evidence/run-memory/runs/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-repo-hygiene
  cancel-in-progress: true

jobs:
  prune_actions_history:
    name: Delete Actions runs only after lossless archive + semantic distillation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce no-delete-before-archive invariant
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LATEST_PER_WORKFLOW: 2
        shell: bash
        run: |
          set -euo pipefail

          tmp=$(mktemp)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.status,.created_at,.name,.path] | @tsv' > "$tmp"

          declare -A PROTECT=()
          declare -A COUNT=()
          PROTECT["$GITHUB_RUN_ID"]=1

          # Active runs are never touched.
          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" != completed ]] && PROTECT["$id"]=1
          done < "$tmp"

          # Keep two recent completed runs of workflows that still exist on main
          # for immediate debugging. Everything older is eligible only after the
          # archive gates below prove its data lives elsewhere.
          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed && -f "$path" ]] || continue
            n=${COUNT[$wid]:-0}
            if (( n < KEEP_LATEST_PER_WORKFLOW )); then
              PROTECT["$id"]=1
              COUNT["$wid"]=$((n + 1))
            fi
          done < <(sort -t $'\t' -k4,4r "$tmp")

          deleted=0
          kept=0
          missing_semantic=0
          missing_archive=0
          invalid_archive=0
          failed=0

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed ]] || { kept=$((kept + 1)); continue; }
            if [[ -n "${PROTECT[$id]:-}" ]]; then
              kept=$((kept + 1))
              continue
            fi

            record="evidence/run-memory/runs/${id}.json"
            manifest="evidence/run-archive/manifests/${id}.json"

            if [[ ! -f "$record" ]]; then
              echo "KEEP $id | semantic distillation missing | $name"
              missing_semantic=$((missing_semantic + 1))
              continue
            fi
            if ! jq -e '.distillation_complete == true and (.findings|type)=="array"' "$record" >/dev/null 2>&1; then
              echo "KEEP $id | semantic record incomplete | $name"
              missing_semantic=$((missing_semantic + 1))
              continue
            fi

            if [[ ! -f "$manifest" ]]; then
              echo "KEEP $id | lossless archive manifest missing | $name"
              missing_archive=$((missing_archive + 1))
              continue
            fi

            if ! jq -e '
              .archive_complete == true and
              .post_archive_safe_to_delete_actions_run == true and
              .raw_logs.status == "ARCHIVED" and
              (.artifacts.status == "ARCHIVED" or .artifacts.status == "NONE") and
              (.refs.status == "ARCHIVED" or .refs.status == "NONE") and
              .semantic_record.distillation_complete == true and
              (.release_asset.name|type)=="string" and
              (.release_asset.sha256|type)=="string" and
              (.release_asset.sha256|length)==64
            ' "$manifest" >/dev/null 2>&1; then
              echo "KEEP $id | archive manifest does not satisfy deletion gate | $name"
              invalid_archive=$((invalid_archive + 1))
              continue
            fi

            # Cross-check that the manifest is bound to the same run and the
            # semantic record currently present on main.
            [[ "$(jq -r '.run_id' "$manifest")" == "$id" ]] || { echo "KEEP $id | manifest run-id mismatch"; invalid_archive=$((invalid_archive + 1)); continue; }
            rec_sha=$(sha256sum "$record" | awk '{print $1}')
            [[ "$(jq -r '.semantic_record.sha256' "$manifest")" == "$rec_sha" ]] || { echo "KEEP $id | semantic record changed since archive"; invalid_archive=$((invalid_archive + 1)); continue; }

            echo "DELETE $id | lossless archive + semantic record verified | $name | $created"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete run $id"
              failed=$((failed + 1))
            fi
          done < "$tmp"

          rm -f "$tmp"
          echo "Repo hygiene: deleted=$deleted kept=$kept missing_semantic=$missing_semantic missing_archive=$missing_archive invalid_archive=$invalid_archive failed=$failed"
