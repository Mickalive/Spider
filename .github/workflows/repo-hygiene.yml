name: SPIDER Repo Hygiene

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Historical Run Ledger Recovery"
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene.yml'
      - 'evidence/ledger-integration/runs/**'
      - 'docs/*_LEDGER.md'
      - 'reports/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-repo-hygiene
  cancel-in-progress: true

jobs:
  prune_actions_history:
    name: Delete old Actions runs only after ledger/report integration
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce ledger-first deletion invariant
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LATEST_PER_WORKFLOW: 2
        shell: bash
        run: |
          set -euo pipefail

          tmp=$(mktemp)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.status,.created_at,.name,.path] | @tsv' > "$tmp"

          declare -A PROTECT=()
          declare -A COUNT=()
          PROTECT["$GITHUB_RUN_ID"]=1

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" != completed ]] && PROTECT["$id"]=1
          done < "$tmp"

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed && -f "$path" ]] || continue
            n=${COUNT[$wid]:-0}
            if (( n < KEEP_LATEST_PER_WORKFLOW )); then
              PROTECT["$id"]=1
              COUNT["$wid"]=$((n + 1))
            fi
          done < <(sort -t $'\t' -k4,4r "$tmp")

          deleted=0
          kept=0
          missing_integration=0
          invalid_integration=0
          failed=0

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed ]] || { kept=$((kept + 1)); continue; }
            if [[ -n "${PROTECT[$id]:-}" ]]; then
              kept=$((kept + 1))
              continue
            fi

            receipt="evidence/ledger-integration/runs/${id}.json"
            if [[ ! -f "$receipt" ]]; then
              echo "KEEP $id | no ledger-integration receipt | $name"
              missing_integration=$((missing_integration + 1))
              continue
            fi

            if ! jq -e --argjson id "$id" '
              .run_id == $id and
              .integration_complete == true and
              .all_substantive_data_copied_to_repo == true and
              .safe_to_delete_actions_run == true and
              (.report_path|type)=="string" and
              (.data_path|type)=="string" and
              (.ledger_paths|type)=="array" and
              (.ledger_paths|length)>0
            ' "$receipt" >/dev/null 2>&1; then
              echo "KEEP $id | integration receipt incomplete | $name"
              invalid_integration=$((invalid_integration + 1))
              continue
            fi

            report=$(jq -r '.report_path' "$receipt")
            data=$(jq -r '.data_path' "$receipt")
            [[ -f "$report" && -f "$data" ]] || {
              echo "KEEP $id | report/data file missing | $name"
              invalid_integration=$((invalid_integration + 1))
              continue
            }
            grep -Fq "$id" "$report" || {
              echo "KEEP $id | run id absent from report | $name"
              invalid_integration=$((invalid_integration + 1))
              continue
            }
            jq -e --argjson id "$id" '.run_id == $id' "$data" >/dev/null 2>&1 || {
              echo "KEEP $id | recovered data not bound to run id | $name"
              invalid_integration=$((invalid_integration + 1))
              continue
            }

            ledger_ok=true
            while IFS= read -r ledger; do
              [[ -f "$ledger" ]] || { ledger_ok=false; break; }
              grep -Fq "$id" "$ledger" || { ledger_ok=false; break; }
            done < <(jq -r '.ledger_paths[]' "$receipt")
            [[ "$ledger_ok" == true ]] || {
              echo "KEEP $id | ledger evidence missing | $name"
              invalid_integration=$((invalid_integration + 1))
              continue
            }

            echo "DELETE $id | detailed report + structured data + ledger integration verified | $name | $created"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete run $id"
              failed=$((failed + 1))
            fi
          done < "$tmp"

          rm -f "$tmp"
          echo "Repo hygiene: deleted=$deleted kept=$kept missing_integration=$missing_integration invalid_integration=$invalid_integration failed=$failed"
