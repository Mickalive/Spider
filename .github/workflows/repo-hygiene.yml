name: SPIDER Repo Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-repo-hygiene
  cancel-in-progress: true

jobs:
  prune_actions_history:
    name: Prune only runs already distilled into durable evidence memory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete only archived and explicitly prune-safe run noise
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LATEST_PER_WORKFLOW: 3
        shell: bash
        run: |
          set -euo pipefail

          declare -A PROTECT=()
          declare -A COUNT=()
          PROTECT["$GITHUB_RUN_ID"]=1

          # Any run with durable cycle provenance remains protected even after
          # distillation. Raw Actions logs can contain reproducibility/debug
          # evidence that is worth keeping for claim-bearing work.
          while read -r id; do
            [[ -n "$id" ]] && PROTECT["$id"]=1
          done < <(
            git ls-remote --heads origin \
              | awk '$2 ~ /^refs\/heads\/cycle\//' \
              | grep -oE '[0-9]{8,}' \
              | sort -u
          )

          tmp=$(mktemp)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.status,.created_at,.name,.path] | @tsv' > "$tmp"

          # Active runs and the latest few runs of every workflow are always
          # retained for immediate debugging even when an archive exists.
          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" != completed ]] && PROTECT["$id"]=1
          done < "$tmp"

          while IFS=$'\t' read -r id wid status created name path; do
            n=${COUNT[$wid]:-0}
            if (( n < KEEP_LATEST_PER_WORKFLOW )); then
              PROTECT["$id"]=1
              COUNT["$wid"]=$((n + 1))
            fi
          done < <(sort -t $'\t' -k4,4r "$tmp")

          deleted=0
          kept=0
          unarchived=0
          failed=0

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed ]] || { kept=$((kept + 1)); continue; }
            if [[ -n "${PROTECT[$id]:-}" ]]; then
              kept=$((kept + 1))
              continue
            fi

            record="evidence/run-memory/runs/${id}.json"
            if [[ ! -f "$record" ]]; then
              echo "Keeping unarchived run $id | $name"
              unarchived=$((unarchived + 1))
              continue
            fi

            safe=$(jq -r '.safe_to_prune // false' "$record" 2>/dev/null || echo false)
            distilled=$(jq -r '.distillation_complete // false' "$record" 2>/dev/null || echo false)
            if [[ "$safe" != true || "$distilled" != true ]]; then
              echo "Keeping archived-but-protected run $id | safe=$safe distilled=$distilled"
              kept=$((kept + 1))
              continue
            fi

            echo "Deleting distilled run $id | $name | $created"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete run $id"
              failed=$((failed + 1))
            fi
          done < "$tmp"

          rm -f "$tmp"
          echo "Repo hygiene: deleted=$deleted kept=$kept unarchived=$unarchived failed=$failed"
