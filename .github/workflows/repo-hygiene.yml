name: SPIDER Repo Hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-hygiene.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: spider-repo-hygiene
  cancel-in-progress: true

jobs:
  prune_actions_history:
    name: Prune only distilled runs with no remaining raw-log provenance dependency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete only archived and explicitly prune-safe run noise
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_LATEST_PER_WORKFLOW: 3
        shell: bash
        run: |
          set -euo pipefail

          declare -A PROTECT=()
          declare -A COUNT=()
          PROTECT["$GITHUB_RUN_ID"]=1

          protect_ids_from_ref() {
            local ref="$1"
            shift
            git rev-parse --verify -q "$ref" >/dev/null || return 0
            while read -r id; do
              [[ -n "$id" ]] && PROTECT["$id"]=1
            done < <(
              git grep -IhoE '[0-9]{9,12}' "$ref" -- "$@" 2>/dev/null \
                | sort -u || true
            )
          }

          # 1) Any run with a durable cycle snapshot remains protected even
          # after distillation. Claim-bearing raw logs are useful reproducibility
          # evidence and cycle branches are the strongest explicit provenance.
          while read -r id; do
            [[ -n "$id" ]] && PROTECT["$id"]=1
          done < <(
            git ls-remote --heads origin \
              | awk '$2 ~ /^refs\/heads\/cycle\//' \
              | grep -oE '[0-9]{9,12}' \
              | sort -u
          )

          # 2) Protect runs still referenced by accepted durable state. This
          # layer existed in the first hygiene version and was accidentally
          # removed during cleanup refactoring. We intentionally DO NOT scan
          # evidence/run-memory/runs: each distilled record self-references its
          # run and would make pruning impossible. Curator safe_to_prune is the
          # authority for whether the raw log can be discarded after distillation.
          DURABLE_PATHS=(
            'state/**'
            'docs/**'
            'results/**'
            'reports/**'
            'product-signals/**'
            '.spider/**'
          )

          for lane in graph physics intel product runtime cto; do
            branch="lab/$lane"
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git fetch -q origin "$branch:refs/remotes/origin/$branch"
              protect_ids_from_ref "refs/remotes/origin/$branch" "${DURABLE_PATHS[@]}"
            fi
          done

          # Main owns program receipts/control-plane durable references.
          protect_ids_from_ref HEAD "${DURABLE_PATHS[@]}"

          # Frontier accepted branches are dynamic and receive the same durable
          # reference protection in addition to their cycle/* provenance.
          while read -r sha ref; do
            [[ -n "${ref:-}" ]] || continue
            branch="${ref#refs/heads/}"
            local_ref="refs/remotes/origin/$branch"
            git fetch -q origin "$branch:$local_ref" || continue
            protect_ids_from_ref "$local_ref" \
              'frontier/**' 'state/**' 'docs/**' 'results/**' 'reports/**' '.spider/**'
          done < <(git ls-remote --heads origin 'refs/heads/lab/frontier/*')

          tmp=$(mktemp)
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id,.workflow_id,.status,.created_at,.name,.path] | @tsv' > "$tmp"

          # Active runs are always protected.
          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" != completed ]] && PROTECT["$id"]=1
          done < "$tmp"

          # Keep a small immediate-debug window ONLY for workflows still
          # present on main. Deleted/superseded workflow histories have no
          # permanent cosmetic retention once safely distilled.
          while IFS=$'\t' read -r id wid status created name path; do
            [[ -f "$path" ]] || continue
            n=${COUNT[$wid]:-0}
            if (( n < KEEP_LATEST_PER_WORKFLOW )); then
              PROTECT["$id"]=1
              COUNT["$wid"]=$((n + 1))
            fi
          done < <(sort -t $'\t' -k4,4r "$tmp")

          deleted=0
          kept=0
          unarchived=0
          failed=0

          while IFS=$'\t' read -r id wid status created name path; do
            [[ "$status" == completed ]] || { kept=$((kept + 1)); continue; }
            if [[ -n "${PROTECT[$id]:-}" ]]; then
              kept=$((kept + 1))
              continue
            fi

            record="evidence/run-memory/runs/${id}.json"
            if [[ ! -f "$record" ]]; then
              echo "Keeping unarchived run $id | $name"
              unarchived=$((unarchived + 1))
              continue
            fi

            safe=$(jq -r '.safe_to_prune // false' "$record" 2>/dev/null || echo false)
            distilled=$(jq -r '.distillation_complete // false' "$record" 2>/dev/null || echo false)
            if [[ "$safe" != true || "$distilled" != true ]]; then
              echo "Keeping archived-but-protected run $id | safe=$safe distilled=$distilled"
              kept=$((kept + 1))
              continue
            fi

            echo "Deleting distilled, unreferenced run $id | $name | $created"
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              echo "::warning::Could not delete run $id"
              failed=$((failed + 1))
            fi
          done < "$tmp"

          rm -f "$tmp"
          echo "Repo hygiene: deleted=$deleted kept=$kept unarchived=$unarchived failed=$failed protected_ids=${#PROTECT[@]}"
