name: SPIDER Product Pilot Chromium Smoke

on:
  pull_request:
    paths:
      - "src/spider/pilot_portal.py"
      - "scripts/run_real_agent_pilot.py"
      - "scripts/smoke_compiled_browser.py"
      - ".github/workflows/product-pilot-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spider-pilot-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only local browser driver (NO LLM/API tokens)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exercise real Chromium in both portal families
        run: PYTHONPATH=src python scripts/smoke_compiled_browser.py
