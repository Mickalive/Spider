name: SPIDER Physics Lane

on:
  workflow_dispatch:
    inputs:
      human_note:
        description: "Optional human steering note"
        required: false
        type: string
        default: ""
      cycle_index:
        description: "Current lane cycle number"
        required: false
        type: number
        default: 1
      max_cycles:
        description: "Optional numeric cap; 0 = continue until Lane Director stops"
        required: false
        type: number
        default: 0
      repair_from_run_id:
        description: "Prior rejected Physics run to repair; empty = fresh scientific cycle"
        required: false
        type: string
        default: ""
      repair_round:
        description: "Same-cycle audit repair round; provenance only, no arbitrary cap"
        required: false
        type: number
        default: 0

permissions:
  contents: write
  actions: write

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  LANE_BRANCH: lab/physics

concurrency:
  group: spider-physics-lane
  cancel-in-progress: false

jobs:
  team_physics:
    name: TEAM PHYSICS
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current control plane
        shell: bash
        run: |
          mkdir -p /tmp/spider_control/directives
          cp SPIDER_MASTER_PROMPT.md /tmp/spider_control/SPIDER_MASTER_PROMPT.md
          cp directives/AUDITOR.md /tmp/spider_control/directives/AUDITOR.md
          cp directives/LANE_DIRECTOR.md /tmp/spider_control/directives/LANE_DIRECTOR.md
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout or initialize accepted Physics lane
        if: ${{ inputs.repair_from_run_id == '' }}
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$LANE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$LANE_BRANCH"
            git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          else
            git switch -C "$LANE_BRANCH"
            git push origin "HEAD:refs/heads/$LANE_BRANCH"
          fi

      - name: Checkout rejected Physics snapshot and prior audit for repair
        if: ${{ inputs.repair_from_run_id != '' }}
        shell: bash
        run: |
          SOURCE_TEAM="cycle/physics/${{ inputs.repair_from_run_id }}/team"
          SOURCE_AUDIT="cycle/physics/${{ inputs.repair_from_run_id }}/audit"
          git fetch origin "$SOURCE_TEAM:refs/remotes/origin/$SOURCE_TEAM"
          git fetch origin "$SOURCE_AUDIT:refs/remotes/origin/$SOURCE_AUDIT"
          git switch -C physics-repair-base "origin/$SOURCE_TEAM"
          git worktree add --detach /tmp/spider_physics_repair_audit "origin/$SOURCE_AUDIT"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Run TEAM PHYSICS — fresh scientific cycle
        if: ${{ inputs.repair_from_run_id == '' }}
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent physics_runner \
            "Run Physics lane cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}). Read /tmp/spider_control/SPIDER_MASTER_PROMPT.md, directives/PHYSICS.md, directives/AUDITOR_PHYSICS.md, docs/NEXT_PHYSICS.md, docs/PHYSICS_LEDGER.md and relevant accepted Physics evidence. Do real falsifiable work with real data. Historical WP-003 is MEASUREMENT_INVALID. Prefer environment response P(S_next | S,A). Do not work on Graph. Do not edit SPIDER_MASTER_PROMPT.md or workflows. Never ask for interactive approval. Human steering note, subordinate to the constitution: ${HUMAN_NOTE}"

      - name: Run TEAM PHYSICS — repair audited defects
        if: ${{ inputs.repair_from_run_id != '' }}
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent physics_runner \
            "REPAIR Physics lane cycle ${{ inputs.cycle_index }}, repair round ${{ inputs.repair_round }} (GitHub run ${GITHUB_RUN_ID}). The current checkout is the exact rejected team snapshot from run ${{ inputs.repair_from_run_id }}. The independent audit workspace is /tmp/spider_physics_repair_audit. Read /tmp/spider_control/SPIDER_MASTER_PROMPT.md, /tmp/spider_control/directives/AUDITOR.md, directives/PHYSICS.md, directives/AUDITOR_PHYSICS.md, the prior audit report and its *_PHYSICS_GATE.json. Fix EVERY item in required_fixes concretely and rerun every affected test or experiment. Preserve the rejected attempt as provenance. Do not evade the audit by weakening tests, changing targets post hoc without labeling them exploratory, deleting contrary evidence, or merely rewriting claims when the defect is in code or measurement. Do not work on Graph or workflows. Human note: ${HUMAN_NOTE}"

      - name: Enforce Physics scope
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -E '^(graph/|results/graph/|reports/graph/|docs/GRAPH_LEDGER\.md$|docs/NEXT_GRAPH\.md$|directives/GRAPH\.md$|SPIDER_MASTER_PROMPT\.md$|\.github/workflows/)' || true)
          if [ -n "$BAD" ]; then
            echo "TEAM PHYSICS crossed protected scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Persist Physics team branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/physics/${GITHUB_RUN_ID}/team"
          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "spider-physics"
          git config user.email "spider-physics@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Physics cycle ${{ inputs.cycle_index }} repair ${{ inputs.repair_round }} attempt ${GITHUB_RUN_ATTEMPT}: team output" || true
          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"

  audit_physics:
    name: INDEPENDENT AUDITOR — PHYSICS
    needs: [team_physics]
    if: needs.team_physics.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      gate: ${{ steps.audit_gate.outputs.gate }}
      safe_to_integrate: ${{ steps.audit_gate.outputs.safe_to_integrate }}
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current control plane
        shell: bash
        run: |
          mkdir -p /tmp/spider_control/directives
          cp SPIDER_MASTER_PROMPT.md /tmp/spider_control/SPIDER_MASTER_PROMPT.md
          cp directives/AUDITOR.md /tmp/spider_control/directives/AUDITOR.md
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout accepted Physics base and mount team output
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C physics-audit-base "origin/$LANE_BRANCH"
          TEAM="cycle/physics/${GITHUB_RUN_ID}/team"
          git fetch origin "$TEAM:refs/remotes/origin/$TEAM"
          git worktree add --detach /tmp/spider_physics_team "origin/$TEAM"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Audit Physics immediately
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent independent_auditor \
            "Audit Physics lane cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}), repair round ${{ inputs.repair_round }}. Completed team workspace: /tmp/spider_physics_team. Current checkout is the untouched accepted Physics base and is where you may write ONLY audit outputs. Read /tmp/spider_control/SPIDER_MASTER_PROMPT.md, /tmp/spider_control/directives/AUDITOR.md and directives/AUDITOR_PHYSICS.md. Attack target leakage, temporal lags, split integrity, preprocessing leakage, policy confounding, uncertainty level, nulls, preregistration timing, identifiability and code/report consistency. Write reports/audit/CYCLE_${GITHUB_RUN_ID}_PHYSICS.md AND mandatory results/audit/CYCLE_${GITHUB_RUN_ID}_PHYSICS_GATE.json with gate PASS, REVISE, or BLOCKED and exact required_fixes. A valid negative, null, falsified, inconclusive or downgraded result may PASS if represented honestly. Use REVISE only for concrete same-cycle repairable defects. Use BLOCKED when another repair would be dishonest, repetitive, data-blocked or require a genuine external decision. Do not edit team files, workflows or constitution."

      - name: Enforce audit-only writes
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -Ev '^(reports/audit/|results/audit/)' || true)
          if [ -n "$BAD" ]; then
            echo "Physics Auditor wrote outside audit outputs:"
            echo "$BAD"
            exit 1
          fi

      - name: Validate Physics audit integration gate
        id: audit_gate
        shell: bash
        run: |
          FILE="results/audit/CYCLE_${GITHUB_RUN_ID}_PHYSICS_GATE.json"
          test -f "$FILE" || { echo "::error::Auditor omitted mandatory Physics gate file"; exit 1; }
          GATE=$(jq -r '.gate // empty' "$FILE")
          SAFE=$(jq -r '.safe_to_integrate // false' "$FILE")
          case "$GATE" in
            PASS)
              [ "$SAFE" = "true" ] || { echo "::error::PASS requires safe_to_integrate=true"; exit 1; }
              ;;
            REVISE)
              [ "$SAFE" = "false" ] || { echo "::error::REVISE requires safe_to_integrate=false"; exit 1; }
              FIXES=$(jq '.required_fixes | if type == "array" then length else 0 end' "$FILE")
              [ "$FIXES" -gt 0 ] || { echo "::error::REVISE requires actionable required_fixes"; exit 1; }
              ;;
            BLOCKED)
              [ "$SAFE" = "false" ] || { echo "::error::BLOCKED requires safe_to_integrate=false"; exit 1; }
              ;;
            *)
              echo "::error::Invalid Physics audit gate: $GATE"
              exit 1
              ;;
          esac
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"
          echo "safe_to_integrate=$SAFE" >> "$GITHUB_OUTPUT"
          echo "Physics audit gate=$GATE safe=$SAFE"

      - name: Persist Physics audit branch
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/physics/${GITHUB_RUN_ID}/audit"
          ATTEMPT_BRANCH="${BRANCH}-attempt-${GITHUB_RUN_ATTEMPT}"
          git config user.name "spider-auditor-physics"
          git config user.email "spider-auditor-physics@autonomous.local"
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Physics cycle ${{ inputs.cycle_index }} repair ${{ inputs.repair_round }} attempt ${GITHUB_RUN_ATTEMPT}: independent audit" || true
          git push --force origin "HEAD:refs/heads/$ATTEMPT_BRANCH"
          git push --force origin "HEAD:refs/heads/$BRANCH"

  physics_repair_router:
    name: PHYSICS AUDIT → RETURN TO CODER
    needs: [audit_physics]
    if: needs.audit_physics.result == 'success' && needs.audit_physics.outputs.gate == 'REVISE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch same-cycle Physics repair with exact audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          MAX_CYCLES: ${{ inputs.max_cycles }}
          REPAIR_ROUND: ${{ inputs.repair_round }}
        shell: bash
        run: |
          NEXT_REPAIR=$((REPAIR_ROUND + 1))
          echo "Audit requested REVISE; returning run ${GITHUB_RUN_ID} to physics_runner as repair round ${NEXT_REPAIR}."
          gh workflow run physics-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f human_note="$HUMAN_NOTE" \
            -f cycle_index="$CYCLE_INDEX" \
            -f max_cycles="$MAX_CYCLES" \
            -f repair_from_run_id="$GITHUB_RUN_ID" \
            -f repair_round="$NEXT_REPAIR"

  physics_audit_blocked:
    name: PHYSICS AUDIT — BLOCKED
    needs: [audit_physics]
    if: needs.audit_physics.result == 'success' && needs.audit_physics.outputs.gate == 'BLOCKED'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop without integrating rejected snapshot
        shell: bash
        run: |
          echo "::warning::Physics audit is BLOCKED. No integration and no blind repair loop. Rejected snapshot remains provenance."

  physics_director:
    name: PHYSICS LANE DIRECTOR
    needs: [team_physics, audit_physics]
    if: needs.audit_physics.result == 'success' && needs.audit_physics.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout workflow base
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stage current control plane
        shell: bash
        run: |
          mkdir -p /tmp/spider_control/directives
          cp SPIDER_MASTER_PROMPT.md /tmp/spider_control/SPIDER_MASTER_PROMPT.md
          cp directives/LANE_DIRECTOR.md /tmp/spider_control/directives/LANE_DIRECTOR.md
          cp .github/scripts/run-opencode-with-retry.sh /tmp/spider_control/run-opencode-with-retry.sh

      - name: Checkout accepted Physics lane and mount audited snapshots
        shell: bash
        run: |
          git fetch origin "$LANE_BRANCH"
          git switch -C "$LANE_BRANCH" "origin/$LANE_BRANCH"
          TEAM="cycle/physics/${GITHUB_RUN_ID}/team"
          AUDIT="cycle/physics/${GITHUB_RUN_ID}/audit"
          git fetch origin "$TEAM:refs/remotes/origin/$TEAM"
          git fetch origin "$AUDIT:refs/remotes/origin/$AUDIT"
          git worktree add --detach /tmp/spider_physics_team "origin/$TEAM"
          git worktree add --detach /tmp/spider_physics_audit "origin/$AUDIT"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Run Physics Lane Director
        env:
          HUMAN_NOTE: ${{ inputs.human_note }}
        shell: bash
        run: |
          bash /tmp/spider_control/run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent lane_director \
            "You are PHYSICS LANE DIRECTOR for cycle ${{ inputs.cycle_index }} (GitHub run ${GITHUB_RUN_ID}) after audit gate PASS. TEAM=/tmp/spider_physics_team. AUDIT=/tmp/spider_physics_audit. Current checkout is persistent accepted Physics lane lab/physics. Read /tmp/spider_control/SPIDER_MASTER_PROMPT.md and /tmp/spider_control/directives/LANE_DIRECTOR.md. Integrate only Physics work that survived the independent audit. Answer every surviving material audit limitation. Rewrite directives/PHYSICS.md, directives/AUDITOR_PHYSICS.md and docs/NEXT_PHYSICS.md as needed; update docs/PHYSICS_LEDGER.md. Write reports/director/CYCLE_${GITHUB_RUN_ID}_PHYSICS.md and state/physics_loop.json with continue/reason/next_question. Do not modify Graph accepted state, workflows or constitution. Human note: ${HUMAN_NOTE}"

      - name: Enforce Physics Director scope
        shell: bash
        run: |
          CHANGED=$(git status --porcelain | cut -c4- || true)
          BAD=$(printf '%s\n' "$CHANGED" | grep -E '^(graph/|results/graph/|reports/graph/|docs/GRAPH_LEDGER\.md$|docs/NEXT_GRAPH\.md$|directives/GRAPH\.md$|directives/AUDITOR_GRAPH\.md$|SPIDER_MASTER_PROMPT\.md$|\.github/workflows/)' || true)
          if [ -n "$BAD" ]; then
            echo "Physics Lane Director crossed protected scope:"
            echo "$BAD"
            exit 1
          fi

      - name: Advance accepted Physics lane
        shell: bash
        run: |
          git config user.name "spider-physics-director"
          git config user.email "spider-physics-director@autonomous.local"
          git add -A
          git commit -m "Physics cycle ${{ inputs.cycle_index }}: audited integration" || true
          git push origin "HEAD:refs/heads/$LANE_BRANCH"

      - name: Dispatch next Physics cycle if justified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUMAN_NOTE: ${{ inputs.human_note }}
          CYCLE_INDEX: ${{ inputs.cycle_index }}
          MAX_CYCLES: ${{ inputs.max_cycles }}
        shell: bash
        run: |
          CONTINUE=false
          if [ -f state/physics_loop.json ]; then
            CONTINUE=$(jq -r '.continue // false' state/physics_loop.json 2>/dev/null || echo false)
          fi
          NEXT=$((CYCLE_INDEX + 1))
          WITHIN_CAP=false
          if [ "$MAX_CYCLES" -eq 0 ] || [ "$CYCLE_INDEX" -lt "$MAX_CYCLES" ]; then
            WITHIN_CAP=true
          fi
          echo "Director continue=$CONTINUE; within_cap=$WITHIN_CAP"
          if [ "$CONTINUE" = "true" ] && [ "$WITHIN_CAP" = "true" ]; then
            gh workflow run physics-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f human_note="$HUMAN_NOTE" \
              -f cycle_index="$NEXT" \
              -f max_cycles="$MAX_CYCLES"
          fi
