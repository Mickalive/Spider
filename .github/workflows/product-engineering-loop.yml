name: SPIDER Product Engineering Loop

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Product and Beta Lane"
    types: [completed]
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write
  actions: write

env:
  SPIDER_MODEL: opencode/x-preview-f-free
  PRODUCT_BRANCH: lab/product

concurrency:
  group: spider-product-lane
  cancel-in-progress: false

jobs:
  product_engineering_director:
    name: PRODUCT DIRECTOR — ENGINEERING ROUTE
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      work_launch: ${{ steps.route.outputs.work_launch }}
      work_id: ${{ steps.route.outputs.work_id }}
      beta_launch: ${{ steps.route.outputs.beta_launch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Product branch and mount accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/run-opencode-with-retry.sh > /tmp/spider-run-opencode-with-retry.sh
          chmod +x /tmp/spider-run-opencode-with-retry.sh
          git fetch origin "$PRODUCT_BRANCH"
          git switch -C "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          for lane in graph physics intel runtime cto; do
            B="lab/$lane"
            if git ls-remote --exit-code --heads origin "refs/heads/$B" >/dev/null 2>&1; then
              git fetch origin "$B:refs/remotes/origin/$B"
              git worktree add --detach "/tmp/spider_$lane" "origin/$B"
            else
              mkdir -p "/tmp/spider_$lane"
            fi
          done
          mkdir -p /tmp/spider_frontier
          while IFS= read -r REF; do
            B="${REF#refs/heads/}"
            TEAM="${B#lab/frontier/}"
            [[ -n "$TEAM" && "$TEAM" != "$B" ]] || continue
            git fetch origin "$B:refs/remotes/origin/$B"
            git worktree add --detach "/tmp/spider_frontier/$TEAM" "origin/$B"
          done < <(git ls-remote --heads origin 'refs/heads/lab/frontier/*' | awk '{print $2}' | sort)

      - name: Inspect current Product decision
        id: current
        shell: bash
        run: |
          set -euo pipefail
          BETA=false
          WORK=false
          if [[ -f state/product_direction.json ]]; then
            BETA=$(jq -r '.beta_launch // false' state/product_direction.json)
            WORK=$(jq -r '.work_launch // false' state/product_direction.json)
          fi
          VALID_WORK=false
          if [[ "$WORK" == true && -f state/product_work_request.json ]]; then
            ID=$(jq -r '.work_id // empty' state/product_work_request.json)
            REQ=$(jq -r '.work_launch // false' state/product_work_request.json)
            if [[ -n "$ID" && "$REQ" == true ]]; then
              VALID_WORK=true
            fi
          fi
          echo "beta_launch=$BETA" >> "$GITHUB_OUTPUT"
          echo "valid_work=$VALID_WORK" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode
        if: steps.current.outputs.beta_launch != 'true' && steps.current.outputs.valid_work != 'true'
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Ask Product Director for concrete pre-beta engineering decision
        if: steps.current.outputs.beta_launch != 'true' && steps.current.outputs.valid_work != 'true'
        shell: bash
        run: |
          set -euo pipefail
          PRE_SHA=""
          if [[ -f state/product_work_request.json ]]; then
            PRE_SHA=$(sha256sum state/product_work_request.json | awk '{print $1}')
          fi
          echo "$PRE_SHA" > /tmp/product_work_pre_sha
          if [[ -f state/product_direction.json ]]; then
            jq '.work_launch=false' state/product_direction.json > /tmp/product_direction.json
            mv /tmp/product_direction.json state/product_direction.json
          fi
          bash /tmp/spider-run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent product_director \
            "PRE-BETA ENGINEERING ROUTE. Read accepted Graph=/tmp/spider_graph, Physics=/tmp/spider_physics, Intel=/tmp/spider_intel, Runtime=/tmp/spider_runtime, CTO=/tmp/spider_cto, accepted Frontier=/tmp/spider_frontier and persistent Product state. No honest Product Beta is currently being routed by this workflow. Your binding mandate is to optimize actively, not merely analyze. If one bounded engineering package can make accepted primitives materially more agent-consumable, executable, measurable, composable or cheaper to integrate, authorize exactly one by writing a FRESH state/product_work_request.json with work_launch=true, unique work_id, concrete objective, accepted evidence refs, allowed paths, executable acceptance_tests, maximum scope, explicit dependencies and kill_condition; set state/product_direction.json.work_launch=true and next_action=ENGINEER. Prefer local SDK/CLI/API/adapters, deterministic harnesses, real cost/verification instrumentation, removal of manual steps or narrow composition of compatible accepted mechanisms. No decorative UI, no pseudo-product, no superiority claim. Use WAIT_FOR_EVIDENCE only if no bounded package has positive integration or information value."

      - name: Validate and persist engineering route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          test -f state/product_direction.json || { echo "::error::Missing product_direction"; exit 1; }
          BETA=$(jq -r '.beta_launch // false' state/product_direction.json)
          WORK=$(jq -r '.work_launch // false' state/product_direction.json)
          if [[ "$BETA" == true && "$WORK" == true ]]; then
            echo "::error::Product cannot launch beta and engineering work simultaneously"
            exit 1
          fi
          ID=""
          if [[ "$WORK" == true ]]; then
            test -f state/product_work_request.json || { echo "::error::work_launch requires product_work_request"; exit 1; }
            test "$(jq -r '.work_launch // false' state/product_work_request.json)" == true || { echo "::error::request must declare work_launch=true"; exit 1; }
            ID=$(jq -r '.work_id // empty' state/product_work_request.json)
            test -n "$ID" || { echo "::error::work request missing work_id"; exit 1; }
            test "$(jq '.acceptance_tests // [] | length' state/product_work_request.json)" -gt 0 || { echo "::error::work request requires acceptance_tests"; exit 1; }
            test -n "$(jq -r '.kill_condition // empty' state/product_work_request.json)" || { echo "::error::work request requires kill_condition"; exit 1; }
            if [[ -f /tmp/product_work_pre_sha ]]; then
              PRE_SHA=$(cat /tmp/product_work_pre_sha)
              CUR_SHA=$(sha256sum state/product_work_request.json | awk '{print $1}')
              if [[ -n "$PRE_SHA" && "$CUR_SHA" == "$PRE_SHA" && "${{ steps.current.outputs.valid_work }}" != true ]]; then
                echo "::error::Director attempted to authorize a stale work request"
                exit 1
              fi
            fi
          fi
          git config user.name spider-product-director
          git config user.email spider-product-director@autonomous.local
          git add -A
          git commit -m "Product engineering route ${GITHUB_RUN_ID}" || true
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "work_launch=$WORK" >> "$GITHUB_OUTPUT"
          echo "work_id=$ID" >> "$GITHUB_OUTPUT"
          echo "beta_launch=$BETA" >> "$GITHUB_OUTPUT"

  product_engineer:
    name: PRODUCT ENGINEERING
    needs: [product_engineering_director]
    if: needs.product_engineering_director.outputs.work_launch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      status: ${{ steps.work_state.outputs.status }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Product base and mount accepted evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/run-opencode-with-retry.sh > /tmp/spider-run-opencode-with-retry.sh
          chmod +x /tmp/spider-run-opencode-with-retry.sh
          git fetch origin "$PRODUCT_BRANCH"
          git switch -C product-engineer-base "origin/$PRODUCT_BRANCH"
          for lane in graph physics intel runtime cto; do
            B="lab/$lane"
            if git ls-remote --exit-code --heads origin "refs/heads/$B" >/dev/null 2>&1; then
              git fetch origin "$B:refs/remotes/origin/$B"
              git worktree add --detach "/tmp/spider_$lane" "origin/$B"
            else
              mkdir -p "/tmp/spider_$lane"
            fi
          done
          mkdir -p /tmp/spider_frontier
          while IFS= read -r REF; do
            B="${REF#refs/heads/}"
            TEAM="${B#lab/frontier/}"
            [[ -n "$TEAM" && "$TEAM" != "$B" ]] || continue
            git fetch origin "$B:refs/remotes/origin/$B"
            git worktree add --detach "/tmp/spider_frontier/$TEAM" "origin/$B"
          done < <(git ls-remote --heads origin 'refs/heads/lab/frontier/*' | awk '{print $2}' | sort)
          rm -f state/product_work_result.json state/product_work_audit.json

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Build bounded Product work package
        shell: bash
        run: |
          bash /tmp/spider-run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent product_engineer \
            "Build Product work package ${{ needs.product_engineering_director.outputs.work_id }} exactly from state/product_work_request.json. Accepted Graph=/tmp/spider_graph Physics=/tmp/spider_physics Intel=/tmp/spider_intel Runtime=/tmp/spider_runtime CTO=/tmp/spider_cto Frontier=/tmp/spider_frontier. Produce executable integration work and real acceptance tests. No decorative UI, no scientific-claim promotion, no beta superiority claim."

      - name: Validate Product work result and protected scope
        id: work_state
        shell: bash
        run: |
          set -euo pipefail
          test -f state/product_work_result.json || { echo "::error::Missing product_work_result"; exit 1; }
          test "$(jq -r '.work_id // empty' state/product_work_result.json)" == "${{ needs.product_engineering_director.outputs.work_id }}" || { echo "::error::work_id mismatch"; exit 1; }
          STATUS=$(jq -r '.status // empty' state/product_work_result.json)
          case "$STATUS" in READY_FOR_AUDIT|BLOCKED|FAILED_BUILD) ;; *) echo "::error::Invalid Product work status $STATUS"; exit 1 ;; esac
          BAD=""
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            p="${line:3}"
            case "$p" in
              product/*|tests/product/*|results/product/work/*|docs/product/*|state/product_work_result.json) ;;
              *) BAD+="$p\n" ;;
            esac
          done < <(git status --porcelain -uall)
          if [[ -n "$BAD" ]]; then
            echo -e "Product Engineer crossed protected scope:\n$BAD"
            exit 1
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Persist Engineer candidate snapshot
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/product/${GITHUB_RUN_ID}/work"
          git config user.name spider-product-engineer
          git config user.email spider-product-engineer@autonomous.local
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Product work ${{ needs.product_engineering_director.outputs.work_id }}: engineering" || true
          git push --force origin "HEAD:refs/heads/$BRANCH"

  product_work_auditor:
    name: PRODUCT WORK AUDITOR
    needs: [product_engineering_director, product_engineer]
    if: needs.product_engineer.outputs.status == 'READY_FOR_AUDIT'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      gate: ${{ steps.work_gate.outputs.gate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount accepted Product base and immutable Engineer candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/run-opencode-with-retry.sh > /tmp/spider-run-opencode-with-retry.sh
          chmod +x /tmp/spider-run-opencode-with-retry.sh
          git fetch origin "$PRODUCT_BRANCH"
          git switch -C product-work-audit-base "origin/$PRODUCT_BRANCH"
          rm -f state/product_work_audit.json
          B="cycle/product/${GITHUB_RUN_ID}/work"
          git fetch origin "$B:refs/remotes/origin/$B"
          git worktree add --detach /tmp/spider_product_work "origin/$B"

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Run independent Product work audit
        shell: bash
        run: |
          bash /tmp/spider-run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent product_work_auditor \
            "Independently audit Product work ${{ needs.product_engineering_director.outputs.work_id }}. Exact request is on this accepted Product checkout; immutable Engineer candidate=/tmp/spider_product_work. Re-run acceptance tests and attack hidden manual steps, fake fixtures, dependency gaps, duplicated lane mechanisms, claim leakage and omitted overhead. Do not redesign it to pass."

      - name: Validate independent audit and protected scope
        id: work_gate
        shell: bash
        run: |
          set -euo pipefail
          test -f state/product_work_audit.json || { echo "::error::Missing product_work_audit"; exit 1; }
          test "$(jq -r '.work_id // empty' state/product_work_audit.json)" == "${{ needs.product_engineering_director.outputs.work_id }}" || { echo "::error::audit work_id mismatch"; exit 1; }
          GATE=$(jq -r '.gate // empty' state/product_work_audit.json)
          SAFE=$(jq -r '.safe_to_integrate // false' state/product_work_audit.json)
          case "$GATE" in PASS|REVISE|BLOCKED) ;; *) echo "::error::Invalid Product work audit gate $GATE"; exit 1 ;; esac
          if [[ "$GATE" == PASS ]]; then
            [[ "$SAFE" == true ]] || { echo "::error::PASS requires safe_to_integrate=true"; exit 1; }
          else
            [[ "$SAFE" == false ]] || { echo "::error::$GATE requires safe_to_integrate=false"; exit 1; }
          fi
          if [[ "$GATE" == REVISE ]]; then
            test "$(jq '.required_fixes // [] | length' state/product_work_audit.json)" -gt 0 || { echo "::error::REVISE requires required_fixes"; exit 1; }
          fi
          BAD=""
          while IFS= read -r line; do
            [[ -n "$line" ]] || continue
            p="${line:3}"
            case "$p" in
              reports/product/audit/*|results/product/audit/*|state/product_work_audit.json) ;;
              *) BAD+="$p\n" ;;
            esac
          done < <(git status --porcelain -uall)
          if [[ -n "$BAD" ]]; then
            echo -e "Product Work Auditor crossed protected scope:\n$BAD"
            exit 1
          fi
          echo "gate=$GATE" >> "$GITHUB_OUTPUT"

      - name: Persist independent audit snapshot
        if: always()
        shell: bash
        run: |
          BRANCH="cycle/product/${GITHUB_RUN_ID}/work-audit"
          git config user.name spider-product-work-auditor
          git config user.email spider-product-work-auditor@autonomous.local
          git switch -C "$BRANCH"
          git add -A
          git commit -m "Product work ${{ needs.product_engineering_director.outputs.work_id }}: audit" || true
          git push --force origin "HEAD:refs/heads/$BRANCH"

  product_work_integration:
    name: PRODUCT WORK INTEGRATION
    needs: [product_engineering_director, product_engineer, product_work_auditor]
    if: needs.product_work_auditor.outputs.gate == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount PASSed work and audit on accepted Product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/run-opencode-with-retry.sh > /tmp/spider-run-opencode-with-retry.sh
          chmod +x /tmp/spider-run-opencode-with-retry.sh
          git fetch origin "$PRODUCT_BRANCH"
          git switch -C "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          for kind in work work-audit; do
            B="cycle/product/${GITHUB_RUN_ID}/$kind"
            git fetch origin "$B:refs/remotes/origin/$B"
            git worktree add --detach "/tmp/spider_product_$kind" "origin/$B"
          done
          for d in product tests/product results/product/work docs/product; do
            if [[ -d "/tmp/spider_product_work/$d" ]]; then
              mkdir -p "$d"
              cp -a "/tmp/spider_product_work/$d/." "$d/"
            fi
          done
          cp /tmp/spider_product_work/state/product_work_result.json state/product_work_result.json
          for d in reports/product/audit results/product/audit; do
            if [[ -d "/tmp/spider_product_work-audit/$d" ]]; then
              mkdir -p "$d"
              cp -a "/tmp/spider_product_work-audit/$d/." "$d/"
            fi
          done
          cp /tmp/spider_product_work-audit/state/product_work_audit.json state/product_work_audit.json

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Integrate audited Product work into Product program
        shell: bash
        run: |
          bash /tmp/spider-run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent product_director \
            "Integrate independently PASSed Product work ${{ needs.product_engineering_director.outputs.work_id }} now mounted in the accepted Product checkout. Engineer=/tmp/spider_product_work; Audit=/tmp/spider_product_work-audit. Preserve the audit claim ceiling, mark this work request consumed, clear work_launch, update Product ledger/hypotheses/state, and identify the next concrete engineering or beta question. PASS means safe to integrate, not evidence that SPIDER beats an external agent."

      - name: Persist accepted Product work and start next Product cycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name spider-product-director
          git config user.email spider-product-director@autonomous.local
          git add -A
          git commit -m "Product work ${{ needs.product_engineering_director.outputs.work_id }}: integrate ${GITHUB_RUN_ID}" || true
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          gh workflow run product-engineering-loop.yml --repo "$GITHUB_REPOSITORY" --ref main

  product_work_rejection_review:
    name: PRODUCT DIRECTOR — WORK REJECTION REVIEW
    needs: [product_engineering_director, product_engineer, product_work_auditor]
    if: always() && needs.product_engineer.result == 'success' && (needs.product_engineer.outputs.status == 'BLOCKED' || needs.product_engineer.outputs.status == 'FAILED_BUILD' || needs.product_work_auditor.outputs.gate == 'REVISE' || needs.product_work_auditor.outputs.gate == 'BLOCKED')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mount rejected Product work evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/scripts/run-opencode-with-retry.sh > /tmp/spider-run-opencode-with-retry.sh
          chmod +x /tmp/spider-run-opencode-with-retry.sh
          git fetch origin "$PRODUCT_BRANCH"
          git switch -C "$PRODUCT_BRANCH" "origin/$PRODUCT_BRANCH"
          B="cycle/product/${GITHUB_RUN_ID}/work"
          git fetch origin "$B:refs/remotes/origin/$B"
          git worktree add --detach /tmp/spider_product_work "origin/$B"
          AB="cycle/product/${GITHUB_RUN_ID}/work-audit"
          if git ls-remote --exit-code --heads origin "refs/heads/$AB" >/dev/null 2>&1; then
            git fetch origin "$AB:refs/remotes/origin/$AB"
            git worktree add --detach /tmp/spider_product_work_audit "origin/$AB"
          else
            mkdir -p /tmp/spider_product_work_audit
          fi

      - name: Install OpenCode
        shell: bash
        run: curl --retry 3 --retry-all-errors --retry-delay 15 -fsSL https://opencode.ai/install | bash

      - name: Review blocked, failed or rejected Product work
        shell: bash
        run: |
          bash /tmp/spider-run-opencode-with-retry.sh run \
            --model "$SPIDER_MODEL" \
            --agent product_director \
            "Review Product work ${{ needs.product_engineering_director.outputs.work_id }} after Engineer status=${{ needs.product_engineer.outputs.status }} and audit gate=${{ needs.product_work_auditor.outputs.gate }}. Candidate=/tmp/spider_product_work; Audit=/tmp/spider_product_work_audit. Do not integrate rejected implementation. Preserve exact blocker/required fixes and negative evidence, mark the current request consumed or superseded, clear stale work_launch, and choose the next bounded repair/rearchitecture/evidence action. Do not claim a Product win."

      - name: Persist rejection review and start next Product cycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name spider-product-director
          git config user.email spider-product-director@autonomous.local
          git add -A
          git commit -m "Product work rejection review ${GITHUB_RUN_ID}" || true
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          gh workflow run product-engineering-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
