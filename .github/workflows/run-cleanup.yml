name: SPIDER Run Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.spider/cleanup/request.json'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Delete completed obsolete workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > /tmp/runs.json

          jq -r '.workflow_runs[]
            | select(.status == "completed")
            | select(
                .name == "SPIDER Multi-Runner Lab" or
                .name == "SPIDER Lab" or
                .name == "SPIDER Autonomous Lab — Launch" or
                .name == "SPIDER Launch Bridge"
              )
            | [.id,.name,.conclusion,.created_at]
            | @tsv' /tmp/runs.json > /tmp/delete.tsv

          COUNT=0
          while IFS=$'\t' read -r ID NAME CONCLUSION CREATED; do
            [ -z "${ID:-}" ] && continue
            echo "Deleting obsolete completed run $ID [$NAME] $CONCLUSION $CREATED"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$ID"
            COUNT=$((COUNT + 1))
          done < /tmp/delete.tsv

          mkdir -p state
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson count "$COUNT" \
            '{cleanup_run_id:$run_id, cleaned_at:$at, deleted_count:$count}' \
            > state/maintenance_last_cleanup.json

      - name: Persist cleanup receipt
        shell: bash
        run: |
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          git add state/maintenance_last_cleanup.json
          git commit -m "maintenance: record workflow run cleanup" || true
          git push origin HEAD:main
