name: SPIDER R2 Codex Sync
run-name: Codex sync ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: spider-codex-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the single canonical Codex
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SPIDER Codex"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin '+refs/heads/lab2/*:refs/remotes/origin/lab2/*' || true
          git fetch origin 'refs/heads/archive/spider-codex-ultimate:refs/remotes/origin/archive/spider-codex-ultimate'
          rm -rf /tmp/spider_codex_worktree
          git worktree add --detach /tmp/spider_codex_worktree origin/archive/spider-codex-ultimate
          python scripts/sync_codex_ultimate.py --archive-dir /tmp/spider_codex_worktree

          cd /tmp/spider_codex_worktree
          git config user.name "SPIDER Codex"
          git config user.email "actions@users.noreply.github.com"
          git add -- SPIDER_CODEX_ULTIME.md
          if git diff --cached --quiet; then
            echo "Single canonical Codex already current."
            exit 0
          fi
          git commit -m "codex: append normalized Research 2.0 evidence"
          git push origin HEAD:archive/spider-codex-ultimate
