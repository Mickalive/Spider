name: SPIDER R2 Lane
run-name: R2 lane=${{ inputs.lane }} run=${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Independent Research 2.0 lane"
        required: true
        type: choice
        options: [graph, physics, runtime, product, intel, frontier]
      reason:
        description: "Dispatch reason"
        required: false
        default: "manual"
        type: string
      chain_depth:
        description: "Immediate continuation depth"
        required: false
        default: "0"
        type: string
      resume_experiment_id:
        description: "Resume an unfinished experiment instead of allocating a new id"
        required: false
        default: ""
        type: string
      director_mandate_b64:
        description: "Base64-encoded Global Research Director mandate for a NEW experiment"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: spider-r2-lane-${{ inputs.lane }}
  cancel-in-progress: false

env:
  LANE: ${{ inputs.lane }}
  CHAIN_DEPTH: ${{ inputs.chain_depth }}
  RESUME_EXPERIMENT_ID: ${{ inputs.resume_experiment_id }}
  DIRECTOR_MANDATE_B64: ${{ inputs.director_mandate_b64 }}
  GH_TOKEN: ${{ github.token }}
  SPIDER_CONTROL_HELPER: /tmp/spider-control-plane.py

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout isolated lane branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SPIDER Research 2.0"
          git config user.email "actions@users.noreply.github.com"
          BRANCH="lab2/$LANE"
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -C "$BRANCH" origin/main
          fi

          # A new, unfrozen experiment may absorb current main normally. A resumed
          # experiment keeps its scientific snapshot; current control code is overlaid below.
          if [[ -z "$RESUME_EXPERIMENT_ID" ]]; then
            git fetch origin main
            if ! git merge --no-edit origin/main; then
              git merge --abort || true
              echo "::error::Lane/main integration conflict. No experiment allocated; next pulse may retry after control-plane repair."
              exit 78
            fi
          fi

      - name: Overlay current control plane without mutating lane history
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          git show origin/main:scripts/control_plane.py > "$SPIDER_CONTROL_HELPER"
          chmod +x "$SPIDER_CONTROL_HELPER"
          python "$SPIDER_CONTROL_HELPER" stage --root "$GITHUB_WORKSPACE"

      - name: Mount frozen pre-2.0 scientific memory inside workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider-runtime/pre2
          git fetch -q origin "refs/heads/archive/spider-codex-ultimate:refs/remotes/origin/archive/spider-codex-ultimate"
          git show "origin/archive/spider-codex-ultimate:SPIDER_CODEX_ULTIME.md" > .spider-runtime/pre2/SPIDER_CODEX_ULTIME.md

      - name: Prepare or resume immutable experiment
        id: prep
        shell: bash
        env:
          SPIDER_START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--lane "$LANE" --run-id "$GITHUB_RUN_ID" --reason "${{ inputs.reason }}" --chain-depth "$CHAIN_DEPTH")
          if [[ -n "$RESUME_EXPERIMENT_ID" ]]; then
            args+=(--experiment-id "$RESUME_EXPERIMENT_ID")
          else
            args+=(--director-mandate-b64 "$DIRECTOR_MANDATE_B64")
          fi
          python scripts/prepare_lane.py "${args[@]}"

      - name: Persist machine request identity
        if: ${{ steps.prep.outputs.frozen != 'true' }}
        shell: bash
        run: >-
          bash scripts/checkpoint.sh init "$LANE" "${{ steps.prep.outputs.experiment_id }}" "R2 $LANE: allocate ${{ steps.prep.outputs.experiment_id }}"

      - name: Install OpenCode with durable failure receipt
        id: install
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          ready=false
          rc=75
          for attempt in 1 2 3 4; do
            echo "SPIDER_OPENCODE_INSTALL_ATTEMPT=$attempt/4"
            curl --retry 2 --retry-all-errors --retry-delay 10 -fsSL https://opencode.ai/install | bash
            rc=$?
            if [[ "$rc" -eq 0 ]]; then
              "$HOME/.opencode/bin/opencode" --version
              rc=$?
            fi
            if [[ "$rc" -eq 0 ]]; then ready=true; break; fi
            sleep 15
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            python scripts/finalize_lane.py "$EXP" --stage install --exit-code 75 --category OPENCODE_INSTALL_FAILURE || true
            bash scripts/checkpoint.sh failure "$LANE" "$EXP" "R2 $LANE: OpenCode install failure $EXP"
            checkpoint_rc=$?
            [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
            exit 75
          fi
          exit 0

      - name: DESIGN — preregister next discriminating experiment
        if: ${{ steps.install.outputs.ready == 'true' && steps.prep.outputs.frozen != 'true' }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"
          bash .github/scripts/run-opencode-resilient.sh research "$DIR/model_design.json" run --agent spider_lane_researcher \
            "DESIGN ONLY for SPIDER Research 2.0 lane=$LANE experiment=$EXP. FIRST read AGENTS.md and binding transmission contract research/EXPERIMENT_PACKET.md, then SPIDER_MASTER_PROMPT.md, SPIDER_ARCHITECTURE_RESEARCH2.md, research/lanes/registry.json, research/claims/registry.json, research/lanes/$LANE/state.json if present, codex/index.json and codex/claim_state.json. Read only relevant codex/experiments packets; do NOT ingest SPIDER_CODEX.md wholesale. Search .spider-runtime/pre2/SPIDER_CODEX_ULTIME.md only for relevant prior evidence. Exact immutable request=$DIR/request.json. For NEW governed experiments, request.json contains director_mandate: treat its target claim and strategic question as binding research direction. The inherited parent_handoff is continuity evidence only and MUST NOT silently override a SUPERSEDE/PIVOT/REOPEN Director decision. If request.json contains parent_handoff, preserve established/rejected/unknown/do_not_assume distinctions. Do not run outcome-bearing measurements. Convert the Director's strategic question into the smallest rigorous high-information experiment that can change a claim or product decision; do not merely repeat pre2. Fill only $DIR/spec.json and $DIR/prereg.md. Use stable metric/control identities for downstream transmission. Never git commit/push/switch/reset."
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            python scripts/check_scope.py --repair --lane "$LANE" --experiment-id "$EXP" --stage design
            scope_rc=$?
            [[ "$scope_rc" -eq 0 ]] || rc=66
          fi
          if [[ "$rc" -eq 0 ]]; then
            python scripts/freeze_experiment.py "$EXP"
            rc=$?
          fi
          if [[ "$rc" -eq 0 ]]; then
            python scripts/finalize_lane.py "$EXP" --stage design --exit-code 0
            rc=$?
          else
            python scripts/finalize_lane.py "$EXP" --stage design --exit-code "$rc" --category DESIGN_FAILURE || true
          fi
          if [[ "$rc" -ne 0 ]]; then
            python scripts/discard_failed_stage.py "$EXP" --stage design
            cleanup_rc=$?
            if [[ "$cleanup_rc" -ne 0 ]]; then
              bash scripts/checkpoint.sh failure "$LANE" "$EXP" "R2 $LANE: design cleanup failure $EXP"
              checkpoint_rc=$?
              [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
              exit "$cleanup_rc"
            fi
          fi
          bash scripts/checkpoint.sh design "$LANE" "$EXP" "R2 $LANE: freeze $EXP"
          checkpoint_rc=$?
          [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
          exit "$rc"

      - name: Record durable pre-execution base
        if: ${{ steps.prep.outputs.executed != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"
          [[ -f "$DIR/freeze.json" ]] || { echo "No freeze yet; execution deferred."; exit 0; }
          python scripts/record_execution_base.py "$EXP"
          bash scripts/checkpoint.sh execution-base "$LANE" "$EXP" "R2 $LANE: execution base $EXP"

      - name: EXECUTE — run frozen experiment
        if: ${{ steps.install.outputs.ready == 'true' && steps.prep.outputs.executed != 'true' }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"
          [[ -f "$DIR/freeze.json" ]] || { echo "No freeze yet; execution deferred."; exit 0; }
          ROLE=research
          [[ "$LANE" == product ]] && ROLE=coding
          export SPIDER_REQUIRED_OUTPUTS="$DIR/result.json $DIR/report.md $DIR/provenance.json"
          bash .github/scripts/run-opencode-resilient.sh "$ROLE" "$DIR/model_execute.json" run --agent spider_lane_researcher \
            "EXECUTE ONLY the frozen SPIDER Research 2.0 experiment lane=$LANE id=$EXP. FIRST read AGENTS.md and binding transmission contract research/EXPERIMENT_PACKET.md. Read exact $DIR/request.json, spec.json, prereg.md and freeze.json; codex/index.json, codex/claim_state.json and only relevant codex/experiments evidence; and lane charter. Frozen inputs are immutable. Run the actual experiment, controls and strong baselines. Preserve RAW EVIDENCE separately from observations, measurements and interpretations. Write $DIR/result.json, $DIR/report.md and $DIR/provenance.json using the exact required packet shape; NEVER omit mandatory keys. result.json must include schema_version, experiment_id, lane, status, outcome, metrics, controls, artifacts, observations, validity_notes, unresolved. Product lane may modify only its registry-authorized code roots and must test changes. Never git commit/push/switch/reset. Infrastructure failure is not a scientific negative."
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            python scripts/check_scope.py --repair --lane "$LANE" --experiment-id "$EXP" --stage execute
            scope_rc=$?
            [[ "$scope_rc" -eq 0 ]] || rc=66
          fi
          if [[ "$rc" -eq 0 ]]; then
            python scripts/finalize_lane.py "$EXP" --stage execute --exit-code 0
            rc=$?
          else
            python scripts/finalize_lane.py "$EXP" --stage execute --exit-code "$rc" --category EXECUTION_FAILURE || true
          fi
          if [[ "$rc" -ne 0 ]]; then
            python scripts/discard_failed_stage.py "$EXP" --stage execute
            cleanup_rc=$?
            if [[ "$cleanup_rc" -ne 0 ]]; then
              bash scripts/checkpoint.sh failure "$LANE" "$EXP" "R2 $LANE: execute cleanup failure $EXP"
              checkpoint_rc=$?
              [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
              exit "$cleanup_rc"
            fi
          fi
          bash scripts/checkpoint.sh execute "$LANE" "$EXP" "R2 $LANE: execute $EXP"
          checkpoint_rc=$?
          [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
          exit "$rc"

      - name: AUDIT — independently attack completed measurement
        if: ${{ steps.install.outputs.ready == 'true' && steps.prep.outputs.audited != 'true' }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"
          [[ -f "$DIR/result.json" && -f "$DIR/report.md" && -f "$DIR/provenance.json" ]] || { echo "Execute packet incomplete; audit deferred."; exit 0; }
          EXCLUDE=$(jq -r '.model // empty' "$DIR/model_execute.json" 2>/dev/null || true)
          export SPIDER_EXCLUDE_MODEL="$EXCLUDE"
          export SPIDER_REQUIRED_OUTPUTS="$DIR/audit.json"
          bash .github/scripts/run-opencode-resilient.sh audit "$DIR/model_audit.json" run --agent spider_lane_auditor \
            "INDEPENDENT AUDIT for SPIDER Research 2.0 lane=$LANE experiment=$EXP. FIRST read AGENTS.md and binding transmission contract research/EXPERIMENT_PACKET.md. Attack the frozen claim using $DIR/request.json, spec.json, prereg.md, freeze.json, result.json, report.md, provenance.json and relevant raw evidence. Use codex/index.json / codex/claim_state.json and only relevant canonical packets when historical comparison is needed. Preserve producer metric/control identifiers when recomputing or disputing them. Recompute material metrics where feasible; test controls, leakage, measurement validity, baselines and claim ceiling. Do not help the producer. Write ONLY $DIR/audit.json using the exact required packet shape and never omit mandatory keys. Never git commit/push/switch/reset."
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            python scripts/check_scope.py --repair --lane "$LANE" --experiment-id "$EXP" --stage audit
            scope_rc=$?
            [[ "$scope_rc" -eq 0 ]] || rc=66
          fi
          if [[ "$rc" -eq 0 ]]; then
            python scripts/finalize_lane.py "$EXP" --stage audit --exit-code 0
            rc=$?
          else
            python scripts/finalize_lane.py "$EXP" --stage audit --exit-code "$rc" --category AUDIT_FAILURE || true
          fi
          if [[ "$rc" -ne 0 ]]; then
            python scripts/discard_failed_stage.py "$EXP" --stage audit
            cleanup_rc=$?
            if [[ "$cleanup_rc" -ne 0 ]]; then
              bash scripts/checkpoint.sh failure "$LANE" "$EXP" "R2 $LANE: audit cleanup failure $EXP"
              checkpoint_rc=$?
              [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
              exit "$cleanup_rc"
            fi
          fi
          bash scripts/checkpoint.sh audit "$LANE" "$EXP" "R2 $LANE: audit $EXP"
          checkpoint_rc=$?
          [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
          exit "$rc"

      - name: DIRECTOR — bounded verdict and next question
        if: ${{ steps.install.outputs.ready == 'true' && steps.prep.outputs.finalized != 'true' }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"
          [[ -f "$DIR/audit.json" ]] || { echo "No audit yet; director deferred."; exit 0; }
          export SPIDER_REQUIRED_OUTPUTS="$DIR/verdict.json $DIR/handoff.json"
          bash .github/scripts/run-opencode-resilient.sh director "$DIR/model_director.json" run --agent spider_lane_director \
            "DIRECTOR VERDICT for SPIDER Research 2.0 lane=$LANE experiment=$EXP. FIRST read AGENTS.md and binding transmission contract research/EXPERIMENT_PACKET.md. Read the exact frozen experiment, producer outputs and independent audit. Use codex/index.json / codex/claim_state.json and only relevant canonical packets for history. Write ONLY $DIR/verdict.json and $DIR/handoff.json using the exact required packet shapes; never omit mandatory keys. claim_updates MUST be a JSON list of bounded events with claim_id/status/reason. Director claim status MUST be one of HYPOTHESIS, EXPERIMENTAL, VALIDATED, PRODUCT_CORE, REJECTED, BLOCKED, MEASUREMENT_INVALID, SUPERSEDED. Never invent synonyms; nuance belongs in reason. SHIPPED is reserved for successful post-audit product promotion and MUST NOT be emitted by the Director. handoff.json MUST preserve established/rejected/unknown/do_not_assume separately and its next_question MUST equal verdict.json next_question. Ground the handoff in exact evidence refs so a fresh-context next agent can continue without chat memory. The workflow owns lane state. Do not manufacture evidence. Product promotion is allowed only for audited code that passed its gate. Physics/Frontier must keep searching materially orthogonal high-upside questions when a bounded program fails. Never git commit/push/switch/reset."
          rc=$?
          if [[ "$rc" -eq 0 ]]; then
            python scripts/check_scope.py --repair --lane "$LANE" --experiment-id "$EXP" --stage director
            scope_rc=$?
            [[ "$scope_rc" -eq 0 ]] || rc=66
          fi
          if [[ "$rc" -eq 0 ]]; then
            python scripts/finalize_lane.py "$EXP" --stage director --exit-code 0
            rc=$?
          else
            python scripts/finalize_lane.py "$EXP" --stage director --exit-code "$rc" --category DIRECTOR_FAILURE || true
          fi
          if [[ "$rc" -ne 0 ]]; then
            python scripts/discard_failed_stage.py "$EXP" --stage director
            cleanup_rc=$?
            if [[ "$cleanup_rc" -ne 0 ]]; then
              bash scripts/checkpoint.sh failure "$LANE" "$EXP" "R2 $LANE: director cleanup failure $EXP"
              checkpoint_rc=$?
              [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
              exit "$cleanup_rc"
            fi
          elif [[ "$LANE" == product ]]; then
            python scripts/revert_product_reject.py "$EXP"
            revert_rc=$?
            [[ "$revert_rc" -eq 0 ]] || rc="$revert_rc"
          fi
          bash scripts/checkpoint.sh director "$LANE" "$EXP" "R2 $LANE: verdict $EXP"
          checkpoint_rc=$?
          [[ "$checkpoint_rc" -eq 0 ]] || exit "$checkpoint_rc"
          exit "$rc"

      - name: Wake canonicalization and bounded continuation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EXP="${{ steps.prep.outputs.experiment_id }}"
          DIR="research/experiments/$EXP"

          # A lane that stops before a durable verdict must not go dormant.
          # This covers ordinary DESIGN/EXECUTE/AUDIT/DIRECTOR failures where
          # GitHub still executes always() cleanup. Hard runner termination is
          # still covered by the scheduled Factory Pulse fallback.
          if [[ ! -f "$DIR/verdict.json" || ! -f "$DIR/handoff.json" ]]; then
            gh workflow run factory-pulse.yml --ref main
            echo "SPIDER_FACTORY_WAKE_AFTER_INCOMPLETE lane=$LANE experiment=$EXP"
            exit 0
          fi

          # Never wake Codex/promotion from an unpushed local verdict. A workflow
          # can have computed a valid packet and still fail durability at checkpoint.
          git fetch -q origin "refs/heads/lab2/$LANE:refs/remotes/origin/lab2/$LANE" || exit 0
          REMOTE_VERDICT_SHA=$(git rev-parse "origin/lab2/$LANE:$DIR/verdict.json" 2>/dev/null || true)
          REMOTE_HANDOFF_SHA=$(git rev-parse "origin/lab2/$LANE:$DIR/handoff.json" 2>/dev/null || true)
          LOCAL_VERDICT_SHA=$(git hash-object "$DIR/verdict.json")
          LOCAL_HANDOFF_SHA=$(git hash-object "$DIR/handoff.json")
          if [[ "$REMOTE_VERDICT_SHA" != "$LOCAL_VERDICT_SHA" || "$REMOTE_HANDOFF_SHA" != "$LOCAL_HANDOFF_SHA" ]]; then
            echo "SPIDER_WAKE_DEFERRED_UNPERSISTED_PACKET lane=$LANE experiment=$EXP"
            exit 0
          fi

          CODEX_ACTIVE=$(gh run list --workflow=codex-sync.yml --limit 20 --json status | jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested")] | length')
          [[ "$CODEX_ACTIVE" != 0 ]] || gh workflow run codex-sync.yml --ref main || true

          if [[ "$LANE" == product ]] && [[ "$(jq -r '.promote_to_product // false' "$DIR/verdict.json")" == true ]]; then
            PROMOTE_ACTIVE=$(gh run list --workflow=product-promote.yml --limit 20 --json status | jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="requested")] | length')
            [[ "$PROMOTE_ACTIVE" != 0 ]] || gh workflow run product-promote.yml --ref main || true
          fi

          # Local Directors no longer self-dispatch child experiments. Their
          # next_question is advisory input to the Global Research Director.
          # Codex sync will push the new canonical state to main; that main update
          # wakes the factory pulse, whose Scout + Global Director choose the next
          # objective across the whole program.
          echo "SPIDER_GLOBAL_DIRECTION_REQUIRED lane=$LANE experiment=$EXP"
