name: SPIDER Intel Supervisor

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Intel Research Lane"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/intel-supervisor.yml'
      - 'docs/roles/PRODUCT_FINAL_GATE.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: spider-intel-supervisor
  cancel-in-progress: true

jobs:
  ensure_intel_running:
    name: Ensure Intel research continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover, repair or replan Intel until Final Product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          product_is_final() {
            local raw
            raw=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/product_final.json?ref=lab/product" 2>/dev/null || true)
            [[ -n "$raw" ]] || return 1
            jq -e '.final_product==true and .status=="READY_FOR_HUMAN_HANDOFF" and .independent_audit_pass==true and .baseline_win_audited==true and (.evidence_refs|type=="array" and length>0)' <<<"$raw" >/dev/null 2>&1
          }

          if product_is_final; then
            echo "Final Product gate satisfied; Intel autonomy may stop."
            exit 0
          fi

          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow intel-loop.yml --limit 30 \
            --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [[ "$ACTIVE" -gt 0 ]]; then
            echo "Intel lane already active; nothing to do."
            exit 0
          fi

          LATEST=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow intel-loop.yml --limit 1 \
            --json databaseId,status,conclusion 2>/dev/null || echo '[]')
          LATEST_ID=$(jq -r '.[0].databaseId // empty' <<<"$LATEST")
          LATEST_CONCLUSION=$(jq -r '.[0].conclusion // empty' <<<"$LATEST")

          next_cycle() {
            local accepted
            accepted=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow intel-loop.yml --limit 100 \
              --json conclusion,status --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length' 2>/dev/null || echo 0)
            echo $((accepted + 1))
          }

          dispatch_fresh() {
            local why="$1" next
            next=$(next_cycle)
            echo "::warning::Intel nonterminal continuity: $why. Dispatching fresh Scout cycle $next. Prior negative/BLOCKED/failed evidence remains preserved."
            gh workflow run intel-loop.yml --repo "$GITHUB_REPOSITORY" --ref main -f cycle_index="$next"
          }

          if [[ -z "$LATEST_ID" ]]; then
            dispatch_fresh "no prior Intel run exists"
            exit 0
          fi

          if [[ "$LATEST_CONCLUSION" == failure || "$LATEST_CONCLUSION" == cancelled || "$LATEST_CONCLUSION" == timed_out ]]; then
            set +e
            LOGS=$(gh run view "$LATEST_ID" --repo "$GITHUB_REPOSITORY" --log 2>&1)
            LOG_RC=$?
            set -e
            if [[ "$LOG_RC" -eq 0 ]] && grep -Eiq '(runner has received a shutdown signal|runner service is stopped|hosted runner.*shutdown|lost communication with the runner|SPIDER_TRANSIENT_OX_EXHAUSTED|OpenCode/Ox.*network|network_error|NetworkError|fetch failed|ECONNRESET|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|service unavailable|bad gateway|gateway timeout|Unexpected server error)' <<<"$LOGS"; then
              echo "::warning::Latest Intel run $LATEST_ID failed operationally; asking GitHub to rerun failed jobs first."
              gh run rerun "$LATEST_ID" --repo "$GITHUB_REPOSITORY" --failed || true
              sleep 2
              ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow intel-loop.yml --limit 30 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
              if [[ "$ACTIVE" -gt 0 ]]; then exit 0; fi
            fi
            dispatch_fresh "latest run $LATEST_ID ended $LATEST_CONCLUSION; the failure is retained but cannot terminate Intel"
            exit 0
          fi

          AUDIT_BRANCH="cycle/intel/${LATEST_ID}/audit"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${AUDIT_BRANCH//\//%2F}" >/dev/null 2>&1; then
            GATE_RAW=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/results/intel/audit/CYCLE_${LATEST_ID}_INTEL_GATE.json?ref=${AUDIT_BRANCH}" 2>/dev/null || true)
            GATE=$(jq -r '.gate // empty' <<<"$GATE_RAW" 2>/dev/null || true)
            if [[ "$GATE" == REVISE ]]; then
              ROUND=$(jq -r '(.repair_round // .repair_round_audited // 0) + 1' <<<"$GATE_RAW" 2>/dev/null || echo 1)
              echo "Latest Intel audit requires REVISE; recovering same-cycle repair $ROUND for run $LATEST_ID."
              gh workflow run intel-loop.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f cycle_index=1 -f repair_from_run_id="$LATEST_ID" -f repair_round="$ROUND"
              exit 0
            fi
            if [[ "$GATE" == BLOCKED ]]; then
              dispatch_fresh "latest audited program $LATEST_ID is BLOCKED; preserve it and move to the next bounded Intel question"
              exit 0
            fi
          fi

          STATE='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fintel" >/dev/null 2>&1; then
            STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/intel_loop.json?ref=lab/intel" 2>/dev/null || true)
          fi
          CONTINUE=$(jq -r '.continue // false' <<<"$STATE" 2>/dev/null || echo false)
          if [[ "$CONTINUE" != true ]]; then
            dispatch_fresh "accepted Intel state says continue=false, which is only a local-program stop before Final Product"
            exit 0
          fi

          dispatch_fresh "accepted Intel state says continue=true and the lane is idle"
