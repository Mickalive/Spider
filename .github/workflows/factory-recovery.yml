name: SPIDER R2 Factory Recovery
run-name: Factory recovery ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: ["SPIDER R2 Factory Pulse"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required' || github.event.workflow_run.conclusion == 'startup_failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry failed strategic control cycle with circuit breaker
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          FAILURES=$(gh run list --workflow=factory-pulse.yml --limit 50             --json conclusion,headSha             | jq --arg sha "$SOURCE_SHA"               '[.[] | select(.headSha==$sha and (.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="action_required" or .conclusion=="startup_failure"))] | length')

          if [[ "$FAILURES" -ge 3 ]]; then
            echo "::error::SPIDER_FACTORY_RECOVERY_CIRCUIT_OPEN source_run=$SOURCE_RUN head=$SOURCE_SHA failures=$FAILURES"
            exit 0
          fi

          echo "SPIDER_FACTORY_RECOVERY_RETRY source_run=$SOURCE_RUN conclusion=$SOURCE_CONCLUSION head=$SOURCE_SHA failures=$FAILURES"
          gh workflow run factory-pulse.yml --ref main
