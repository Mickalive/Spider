name: SPIDER Cleanup Obsolete Red Runs

on:
  push:
    branches: [main]
    paths:
      - '.spider/maintenance/cleanup-red-runs.json'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete only obsolete or superseded red runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json databaseId,workflowName,status,conclusion,createdAt,url)

          is_current_workflow() {
            case "$1" in
              "SPIDER Launcher — Graph + Physics"|"SPIDER Graph Lane"|"SPIDER Physics Lane"|"SPIDER Meta Sync"|"SPIDER Ox Watchdog") return 0 ;;
              *) return 1 ;;
            esac
          }

          is_red() {
            case "$1" in
              failure|cancelled|timed_out|action_required|startup_failure|stale) return 0 ;;
              *) return 1 ;;
            esac
          }

          latest_success_time() {
            local wf="$1"
            jq -r --arg wf "$wf" '[.[] | select(.workflowName == $wf and .status == "completed" and .conclusion == "success") | .createdAt] | sort | last // ""' <<<"$RUNS"
          }

          mkdir -p .spider/maintenance
          RECEIPT=.spider/maintenance/red-run-cleanup-receipt.jsonl
          : > "$RECEIPT"
          deleted=0
          kept=0

          while IFS=$'\t' read -r id wf status conclusion created url; do
            [[ "$status" == "completed" ]] || continue
            is_red "$conclusion" || continue

            reason=""
            if ! is_current_workflow "$wf"; then
              reason="obsolete_workflow"
            elif [[ "$wf" == "SPIDER Launcher — Graph + Physics" ]]; then
              reason="non_scientific_launcher_failure"
            else
              newer_success=$(latest_success_time "$wf")
              if [[ -n "$newer_success" && "$newer_success" > "$created" ]]; then
                reason="superseded_by_newer_success"
              fi
            fi

            if [[ -n "$reason" ]]; then
              echo "Deleting run $id [$wf] $conclusion: $reason"
              gh run delete "$id" --repo "$GITHUB_REPOSITORY"
              jq -cn --argjson id "$id" --arg wf "$wf" --arg conclusion "$conclusion" --arg created "$created" --arg reason "$reason" \
                '{run_id:$id,workflow:$wf,conclusion:$conclusion,created_at:$created,action:"deleted",reason:$reason}' >> "$RECEIPT"
              deleted=$((deleted+1))
            else
              jq -cn --argjson id "$id" --arg wf "$wf" --arg conclusion "$conclusion" --arg created "$created" \
                '{run_id:$id,workflow:$wf,conclusion:$conclusion,created_at:$created,action:"kept",reason:"latest_unsuperseded_current_workflow_failure"}' >> "$RECEIPT"
              kept=$((kept+1))
            fi
          done < <(jq -r '.[] | [.databaseId,.workflowName,.status,(.conclusion // ""),.createdAt,.url] | @tsv' <<<"$RUNS")

          jq -s --argjson deleted "$deleted" --argjson kept "$kept" \
            '{deleted_count:$deleted,kept_red_count:$kept,decisions:.}' "$RECEIPT" > .spider/maintenance/red-run-cleanup-receipt.json
          rm "$RECEIPT"
          cat .spider/maintenance/red-run-cleanup-receipt.json

      - name: Commit receipt and remove one-shot maintenance files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spider-maintenance"
          git config user.email "spider-maintenance@autonomous.local"
          rm -f .github/workflows/_cleanup-red-runs.yml
          rm -f .spider/maintenance/cleanup-red-runs.json
          git add -A
          git commit -m "maintenance: clean obsolete red workflow runs"
          git push origin HEAD:main
