name: SPIDER Ultimate Codex Archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spider-ultimate-codex-archive.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: spider-ultimate-codex-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every surviving branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Build non-compressive ultimate codex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, json, subprocess, hashlib, datetime, urllib.request, urllib.error, zipfile, io, pathlib, sys
          from collections import defaultdict

          REPO = os.environ['GITHUB_REPOSITORY']
          TOKEN = os.environ['GH_TOKEN']
          OUT = pathlib.Path('SPIDER_ULTIMATE_CODEX.md')
          NOW = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          def git(*args, text=True, check=True):
              p = subprocess.run(['git', *args], stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if check and p.returncode != 0:
                  raise RuntimeError(f"git {' '.join(args)} failed: {p.stderr.decode('utf-8','replace')}")
              return p.stdout.decode('utf-8','replace') if text else p.stdout

          def api_json(path):
              url = 'https://api.github.com' + path
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'SPIDER-Ultimate-Codex-Archive'
              })
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def api_bytes(path):
              url = 'https://api.github.com' + path
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {TOKEN}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'SPIDER-Ultimate-Codex-Archive'
              })
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          refs_raw = git('for-each-ref', '--format=%(refname:short)|%(objectname)', 'refs/remotes/origin')
          refs = []
          for line in refs_raw.splitlines():
              if not line or line.startswith('origin/HEAD|'):
                  continue
              name, sha = line.split('|', 1)
              refs.append((name, sha))
          refs.sort()
          main_sha = git('rev-parse', 'origin/main').strip()

          # Result/evidence selection. Content is never summarized: selected text blobs are embedded byte-for-byte.
          exact_prefixes = (
              'results/', 'evidence/', 'reports/', 'state/', '.spider/'
          )
          lane_prefixes = ('graph/', 'physics/', 'intel/', 'runtime/', 'product/', 'frontier/')
          context_main_prefixes = ('docs/', 'directives/')
          result_words = re.compile(
              r'(result|report|audit|gate|ledger|verdict|experiment|metric|summary|finding|measurement|baseline|decision|program|charter|handoff|claim|state|evidence|protocol|test|evaluation|falsif|manifest|receipt|candidate|snapshot|wp[-_]?\d|pc[-_]|round|session|cycle)',
              re.I
          )
          text_ext = {'.md','.json','.txt','.csv','.tsv','.yaml','.yml','.log','.toml'}
          max_blob = 2_500_000

          blobs = {}  # sha -> content/provenance
          excluded = []
          artifact_run_ids = set()
          branch_file_counts = defaultdict(int)

          def selected(path, ref):
              p = path.lower()
              ext = pathlib.PurePosixPath(path).suffix.lower()
              if p.startswith(exact_prefixes):
                  return ext in text_ext or ext == ''
              if p.startswith(lane_prefixes):
                  return ext in text_ext and bool(result_words.search(p))
              if ref == 'origin/main' and p.startswith(context_main_prefixes):
                  return ext in {'.md','.json','.txt','.yaml','.yml'}
              if ref == 'origin/main' and path in {
                  'SPIDER_MASTER_PROMPT.md','SPIDER_ARCHITECTURE_V2.md','SPIDER_ARCHITECTURE_V3.md','AGENTS.md','README.md'
              }:
                  return True
              if p.startswith('.github/workflows/') and ext in {'.yml','.yaml'}:
                  return True
              return False

          for ref, ref_sha in refs:
              tree = git('ls-tree', '-r', '-l', ref)
              for line in tree.splitlines():
                  m = re.match(r'^(\d+)\s+(blob|tree)\s+([0-9a-f]{40})\s+(-|\d+)\t(.+)$', line)
                  if not m or m.group(2) != 'blob':
                      continue
                  sha, size_s, path = m.group(3), m.group(4), m.group(5)
                  size = int(size_s) if size_s.isdigit() else 0
                  if not selected(path, ref):
                      continue
                  branch_file_counts[ref] += 1
                  for rid in re.findall(r'(?<!\d)(3\d{10})(?!\d)', ref + '/' + path):
                      artifact_run_ids.add(int(rid))
                  ent = blobs.setdefault(sha, {'sha':sha,'size':size,'provenance':[],'content':None,'binary':False,'oversize':False})
                  ent['provenance'].append({'ref':ref,'ref_sha':ref_sha,'path':path})

          # Materialize unique selected blobs exactly once.
          for sha, ent in blobs.items():
              if ent['size'] > max_blob:
                  ent['oversize'] = True
                  excluded.append({'sha':sha,'size':ent['size'],'reason':'selected text blob > 2.5 MB; provenance retained, raw blob remains in git','provenance':ent['provenance']})
                  continue
              raw = git('cat-file','blob',sha,text=False)
              if b'\x00' in raw:
                  ent['binary'] = True
                  excluded.append({'sha':sha,'size':len(raw),'reason':'binary/NUL-containing blob; provenance retained, raw blob remains in git','provenance':ent['provenance']})
                  continue
              try:
                  content = raw.decode('utf-8')
              except UnicodeDecodeError:
                  content = raw.decode('utf-8','replace')
              ent['content'] = content

          # Durable run-memory/tombstone IDs on current main.
          run_memory_ids = set()
          tombstone_ids = set()
          names = git('ls-tree','-r','--name-only','origin/main')
          for p in names.splitlines():
              m = re.fullmatch(r'evidence/run-memory/runs/(\d+)\.json', p)
              if m: run_memory_ids.add(int(m.group(1)))
              m = re.fullmatch(r'evidence/run-memory/deleted/(\d+)\.json', p)
              if m: tombstone_ids.add(int(m.group(1)))

          # Every surviving GitHub Actions run, paginated.
          runs = []
          page = 1
          while True:
              data = api_json(f'/repos/{REPO}/actions/runs?per_page=100&page={page}')
              batch = data.get('workflow_runs', [])
              if not batch:
                  break
              runs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError('Actions pagination sanity limit exceeded')

          # Map surviving refs carrying a run id.
          refs_for_run = defaultdict(list)
          for ref, ref_sha in refs:
              for rid in re.findall(r'(?<!\d)(3\d{10})(?!\d)', ref):
                  refs_for_run[int(rid)].append({'ref':ref,'sha':ref_sha})

          # Full-log fallback only for scientifically/product-relevant surviving runs that have neither
          # a durable run-memory record nor a result-like branch artifact. This prevents unique ephemeral
          # results from disappearing while avoiding hundreds of irrelevant watchdog/setup logs.
          relevant_re = re.compile(r'(Graph|Physics|Intel|Runtime|Product|Frontier|CTO)', re.I)
          noise_re = re.compile(r'(Supervisor|Watchdog|Control Plane|Repo Hygiene|Evidence Handoff|Accepted Results Publisher)', re.I)
          log_fallbacks = []
          log_failures = []
          log_bytes_total = 0
          log_budget = 45_000_000
          for r in sorted(runs, key=lambda x: x.get('created_at') or ''):
              rid = int(r['id'])
              name = r.get('name') or ''
              if not relevant_re.search(name) or noise_re.search(name):
                  continue
              if rid in run_memory_ids or rid in artifact_run_ids:
                  continue
              if r.get('status') not in {'completed'}:
                  continue
              if log_bytes_total >= log_budget:
                  log_failures.append({'run_id':rid,'reason':'global 45 MB full-log fallback budget reached','html_url':r.get('html_url')})
                  continue
              try:
                  zbytes = api_bytes(f'/repos/{REPO}/actions/runs/{rid}/logs')
                  z = zipfile.ZipFile(io.BytesIO(zbytes))
                  pieces = []
                  for member in sorted(z.namelist()):
                      if member.endswith('/'):
                          continue
                      b = z.read(member)
                      if b'\x00' in b:
                          continue
                      txt = b.decode('utf-8','replace')
                      pieces.append(f'\n===== {member} =====\n{txt}')
                  body = ''.join(pieces)
                  encoded_len = len(body.encode('utf-8'))
                  if log_bytes_total + encoded_len > log_budget:
                      log_failures.append({'run_id':rid,'reason':'would exceed global 45 MB full-log fallback budget','html_url':r.get('html_url'),'bytes':encoded_len})
                      continue
                  log_fallbacks.append({'run':r,'body':body,'sha256':hashlib.sha256(body.encode('utf-8')).hexdigest()})
                  log_bytes_total += encoded_len
              except Exception as e:
                  log_failures.append({'run_id':rid,'reason':f'log download unavailable: {type(e).__name__}: {e}','html_url':r.get('html_url')})

          # Non-GitHub / early results recovered from project conversations. Exact known numbers only;
          # unknown fields are not invented. GitHub-era artifacts below remain authoritative where richer.
          prehistory = r'''
          ## H0 — Early/local experiments recovered from SPIDER project discussions

          These records predate, or are not guaranteed to be fully represented by, the current GitHub run archive. They are included because the Codex scope is the project, not merely the repository. Numbers below are preserved exactly as previously reported; no missing metric is inferred.

          ### H0.1 — Mind2Web v0.40 — real composition/retrieval benchmark
          - VALID tasks: **176**.
          - HARD tasks: **66**.
          - NOVEL compositions: **149/176 = 0.8466**.
          - HARD NOVEL: **56/66 = 0.8485**.
          - RETRIEVAL success: **47/176 = 0.267**.
          - Historical interpretation: evidence that many held-out tasks required composition rather than simple whole-route retrieval; this is not, by itself, proof of a general mechanical Web law.

          ### H0.2 — Mind2Web v0.50 — falsification gate
          - RAW TASKS: **1009**.
          - ACTION EXTRACTION: **3843/6766 = 0.568**.
          - PLAN FOUND: **176/176 = 1.0000**.
          - EXACT HUMAN ROUTE: **6/176 = 0.0341**.
          - SAME OPERATIONS, ANY ORDER: **40/176 = 0.2273**.
          - HARD EXACT HUMAN ROUTE: **4/66 = 0.0606**.
          - HARD SAME OPERATIONS: **19/66 = 0.2879**.
          - OPERATION MICRO-F1: **0.7893**.
          - MEAN LCS / HUMAN ROUTE: **0.5178**.
          - CAUSALLY LINKED COMPOSITION: **23/176 = 0.1307**.
          - STRICT CAUSAL CHAIN: **4/176 = 0.0227**.
          - HARD CAUSAL COMPOSITION: **15/66 = 0.2273**.
          - GT ROUTES WITH ANY CAUSAL DEPENDENCY: **16/176 = 0.0909**.
          - Historical implication: reconstruction/composition was frequently possible at an operation level, but exact human-route reconstruction and strict causal-chain evidence were rare. The extraction rate itself imposes a hard claim ceiling.

          ### H0.3 — WP-000 — mechanics-only proxy-next-state benchmark
          - TASKS: **200**.
          - SITES: **56**.
          - TRANSITIONS: **1,429**.
          - STATE-PROXY COVERAGE: **1.0000**.
          - RULE DIM-ACC: **0.6595**; RULE EXACT: **0.1603**.
          - NN DIM-ACC: **0.5761**; NN EXACT: **0.0693**.
          - SHUFFLE DIM-ACC: **0.6073**; SHUFFLE EXACT: **0.1500**.
          - RULE − SHUFFLE DIM: **+0.0522** (+5.22 pp).
          - RULE − SHUFFLE EXACT: **+0.0103** (+1.03 pp).
          - Claim ceiling: next-state was a proxy, not a causal observed after-state; therefore this was a signal-generating prototype, not proof of Web physics.

          ### H0.4 — WP-001 — repeated grouped-site robustness
          - Same mechanics-only model/features as WP-000.
          - **100 grouped site holdouts**; **25% sites hidden** per split; **10 shuffles/split**.
          - Mean RULE DIM-ACC reported: **0.6564**.
          - Mean NN DIM-ACC reported: **0.5706**.
          - RULE − SHUFFLE DIM mean: **+0.0505**.
          - Empirical 95% interval: **[+0.0249, +0.0756]**.
          - Claim ceiling remains the WP-000 proxy-next-state limitation.

          ### H0.5 — WP-002 — true raw next-state attempt
          - Intended to move from proxy state to true raw next state.
          - **BLOCKED** because the required raw dump depended on Globus / university access and was not available locally.
          - This is a data-access blocker, **not scientific evidence for or against** the hypothesis.

          ### H0.6 — WP-002B — WebWorldData true next-state substitute
          - Public Qwen/WebWorldData path; no Globus/university login.
          - TRAJECTORIES: **300**.
          - TRANSITIONS: **901**.
          - REPEATED TRAJECTORY HOLDOUTS: **100**.
          - TRUE NEXT-STATE: **YES**.
          - WEBSITE HOLDOUT CLAIM: **NO**.
          - MEAN RULE DIM-ACC: **0.6238**.
          - MEAN NN DIM-ACC: **0.6295**.
          - MEAN SHUFFLE DIM-ACC: **0.5706**.
          - RULE − SHUFFLE DIM: mean **+0.0532**, median **+0.0523**, empirical 95% **[+0.0363, +0.0710]**.
          - RULE − NN DIM: rule did not beat NN on the reported mean; therefore the result supports non-random predictive structure but not superiority of the hand rule over nearest-neighbour prediction.

          ### H0.7 — Early Graph POC — unseen route composition
          - **2/3 unseen composites succeeded**.
          - Successful composites reused **6/6** and **8/8** actions respectively.
          - **0 novel actions** were required in those successful routes.
          - Replicated **twice**.
          - End-to-end target route absent from prior data; no fragment IDs or goal hints were supplied.
          - Confounds explicitly retained: keyword retrieval and unequal graph iteration meant the experiment did **not** isolate the causal value of reusable fragments.

          ### H0.8 — WP-003B — 13-dimensional cross-site candidate
          - TRANSITIONS: **681** total; **564 valid**.
          - SITES: **7**.
          - State+action delta versus best null: **−0.5016**.
          - Grouped confidence interval: **[−0.6467, −0.3153]**.
          - Winning folds: **0/5**.
          - Persistence won everywhere.
          - Verdict: this 13D cross-site candidate was **falsified**; the tested representation/model did not beat the persistence null.

          ### H0.9 — WP-005 — atomic cross-site random-walk targets
          - ATOMIC TRANSITIONS: **875**; **769 confirmed**.
          - SITES: **9**.
          - T1 URL-shape: delta **−0.0432**, **1/9 folds**, **p=.898**.
          - T2 DOM-diff: delta **−0.0497**, **4/9 folds**, **p=.270**.
          - Independent audit: **PASS**.
          - Verdict: **FALSIFIED** for both tested fine-grained targets; the cross-site random-walk program was marked COMPLETE and the next work moved to WP-006 rather than repeating the same failed test.

          ### H0.10 — Six historical CTO Frontier one-shot programs
          - `frontier-physics-controlled-web-lab`: **MEASUREMENT_INVALID**.
          - `frontier-physics-knowledge-volatility`: **DATA_INSUFFICIENT**.
          - `frontier-physics-exploration-budgets`: audited **FALSIFIED**; **−60 effects vs fixed**, 95% interval **[−81, −31]**.
          - `frontier-instrument-ledger`: **NOT_WORTH_RETAINING_AS_IS**.
          - `frontier-novelty-gating`: **simulation-only conditional positive**; not an empirical Web validation.
          - `frontier-scoped-delta-repair`: producer reported **5/5 repairs**, **0 corruption**, median **22 actions saved**, but the claim remained **UNTESTED** because the required Frontier gate was missing.
          '''.strip()

          def fence_for(path):
              ext = pathlib.PurePosixPath(path).suffix.lower()
              return {'.json':'json','.md':'markdown','.yaml':'yaml','.yml':'yaml','.csv':'csv','.tsv':'tsv','.log':'text','.txt':'text','.toml':'toml'}.get(ext,'text')

          lines = []
          ap = lines.append
          ap('# SPIDER — ULTIMATE CODEX OF EXPERIMENTAL & PRODUCT EVIDENCE')
          ap('')
          ap(f'**Generated deterministically:** {NOW}  ')
          ap(f'**Repository:** `{REPO}`  ')
          ap(f'**Main snapshot:** `{main_sha}`  ')
          ap('**Purpose:** freeze the full evidentiary inheritance of SPIDER 1.x before any product-first architecture reboot.')
          ap('')
          ap('## Archival invariants')
          ap('')
          ap('- This Codex is an **archive, not a new scientific verdict**. It never upgrades evidence status.')
          ap('- Selected result/evidence/state/report/workflow text artifacts are embedded **verbatim**, deduplicated only by identical Git blob SHA. Every branch/path provenance is retained.')
          ap('- Negative, falsified, blocked, inconclusive, invalid and infrastructure-failed outcomes are preserved alongside positive outcomes.')
          ap('- GitHub Actions metadata covers every surviving run visible to the repository at generation time. Runs already deleted are represented through surviving tombstones/recovery ledgers where available.')
          ap('- Full logs are embedded only as a fallback for relevant runs with neither a durable run-memory record nor a result-like branch artifact. Such log-only material remains `LOG_ONLY_UNAUDITED` unless a durable audit elsewhere says otherwise.')
          ap('- Raw source code and binaries are not duplicated into this document unless they are themselves result/evidence artifacts; their Git history remains the raw source of truth.')
          ap('')
          ap(prehistory)
          ap('')
          ap('## H1 — Repository/branch census')
          ap('')
          ap(f'- Surviving remote branches scanned: **{len(refs)}**.')
          ap(f'- Unique selected evidence/result/state/report/workflow blobs: **{len(blobs)}**.')
          ap(f'- Durable run-memory records on main: **{len(run_memory_ids)}**.')
          ap(f'- Deleted-run tombstones on main: **{len(tombstone_ids)}**.')
          ap(f'- Surviving GitHub Actions runs inventoried: **{len(runs)}**.')
          ap(f'- Full-log fallbacks embedded: **{len(log_fallbacks)}** ({log_bytes_total:,} bytes).')
          ap('')
          ap('### H1.1 — Every surviving branch head')
          ap('')
          ap('| Ref | Head SHA | Selected archival files |')
          ap('|---|---|---:|')
          for ref, sha in refs:
              ap(f'| `{ref}` | `{sha}` | {branch_file_counts.get(ref,0)} |')
          ap('')

          ap('## H2 — Complete surviving GitHub Actions run inventory')
          ap('')
          ap('This table is intentionally exhaustive for surviving Actions history. It is not a scientific-results table: retries, infra runs and operational no-ops remain visible.')
          ap('')
          ap('| Run | Workflow | # | Event | Status | Conclusion | Created | Head branch | Head SHA | Run-memory | Result-like branch artifact | URL |')
          ap('|---:|---|---:|---|---|---|---|---|---|---|---|---|')
          for r in sorted(runs, key=lambda x: x.get('created_at') or ''):
              rid = int(r['id'])
              name = (r.get('name') or '').replace('|','\\|')
              hb = (r.get('head_branch') or '').replace('|','\\|')
              ap(f"| {rid} | {name} | {r.get('run_number','')} | {r.get('event','')} | {r.get('status','')} | {r.get('conclusion') or ''} | {r.get('created_at') or ''} | `{hb}` | `{r.get('head_sha') or ''}` | {'YES' if rid in run_memory_ids else 'NO'} | {'YES' if rid in artifact_run_ids else 'NO'} | {r.get('html_url') or ''} |")
          ap('')

          ap('## H3 — Full-log fallback for otherwise unrepresented relevant runs')
          ap('')
          if not log_fallbacks:
              ap('_No fallback logs were required or retrievable._')
          for x in log_fallbacks:
              r = x['run']; rid = int(r['id'])
              ap('')
              ap(f"### LOG-FALLBACK-{rid} — {r.get('name') or ''}")
              ap('')
              ap(f"- Run: {r.get('html_url')}")
              ap(f"- Conclusion: `{r.get('conclusion')}`; event `{r.get('event')}`; head `{r.get('head_branch')}` @ `{r.get('head_sha')}`.")
              ap('- Epistemic status in this appendix: **LOG_ONLY_UNAUDITED unless independently promoted elsewhere**.')
              ap(f"- Embedded-log SHA-256: `{x['sha256']}`")
              ap('```text')
              ap(x['body'])
              ap('```')
          ap('')
          ap('### H3.GAPS — Relevant fallback logs that could not be embedded')
          ap('')
          if not log_failures:
              ap('_None._')
          else:
              ap('```json')
              ap(json.dumps(log_failures, indent=2, sort_keys=True))
              ap('```')
          ap('')

          ap('## H4 — Non-compressive archive of every selected unique durable artifact')
          ap('')
          ap('Identical Git blobs are printed once; all refs/paths carrying the blob are listed. Content is otherwise unchanged.')
          ap('')
          material = [e for e in blobs.values() if e.get('content') is not None]
          material.sort(key=lambda e: (min((p['path'] for p in e['provenance']), default=''), e['sha']))
          for i, ent in enumerate(material, 1):
              prov = sorted(ent['provenance'], key=lambda p:(p['ref'],p['path']))
              primary_path = prov[0]['path'] if prov else ''
              ap(f'### ARTIFACT-{i:05d} — `{primary_path}`')
              ap('')
              ap(f"- Git blob SHA: `{ent['sha']}`; bytes: **{ent['size']}**.")
              ap('- Provenance:')
              for p in prov:
                  ap(f"  - `{p['ref']}` @ `{p['ref_sha']}` → `{p['path']}`")
              ap(f'```{fence_for(primary_path)}')
              ap(ent['content'])
              if ent['content'] and not ent['content'].endswith('\n'):
                  ap('')
              ap('```')
              ap('')

          ap('## H5 — Selected artifacts not embedded byte-for-byte')
          ap('')
          ap('Only binary/NUL-containing or >2.5 MB single blobs can appear here. Their exact Git SHA and every provenance remain recorded so they are not silently lost.')
          ap('')
          if not excluded:
              ap('_None._')
          else:
              ap('```json')
              ap(json.dumps(excluded, indent=2, sort_keys=True))
              ap('```')
          ap('')

          ap('## H6 — Completeness boundary')
          ap('')
          ap('- The Codex preserves **all selected durable textual result/evidence/state/report/workflow artifacts from every surviving branch**, every surviving Actions run metadata record, and tombstones/recovery ledgers that still exist on main.')
          ap('- A historical Actions run that was permanently deleted before any tombstone, durable artifact, surviving branch, or conversation record was created cannot be reconstructed from GitHub after deletion. Such absence is a provenance gap, not permission to invent a result.')
          ap('- The early/local conversation records in H0 close the most important pre-GitHub gap known at generation time.')
          ap('- Architecture 2.0 must treat this document as immutable historical inheritance; it may reinterpret product strategy, but must never rewrite past evidence statuses or metrics.')
          ap('')

          text = '\n'.join(lines)
          data = text.encode('utf-8')
          if len(data) > 98_000_000:
              raise RuntimeError(f'Codex is {len(data):,} bytes, above safe GitHub single-file limit; refusing silent truncation')
          OUT.write_bytes(data)
          print(f'CODEX_BYTES={len(data)}')
          print(f'BRANCHES={len(refs)} BLOBS={len(blobs)} RUNS={len(runs)} RUN_MEMORY={len(run_memory_ids)} TOMBSTONES={len(tombstone_ids)} LOG_FALLBACKS={len(log_fallbacks)}')
          PY

      - name: Validate codex preservation invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s SPIDER_ULTIMATE_CODEX.md
          grep -q '^# SPIDER — ULTIMATE CODEX' SPIDER_ULTIMATE_CODEX.md
          grep -q 'Mind2Web v0.50' SPIDER_ULTIMATE_CODEX.md
          grep -q 'WP-000' SPIDER_ULTIMATE_CODEX.md
          grep -q 'WP-002B' SPIDER_ULTIMATE_CODEX.md
          grep -q 'WP-003B' SPIDER_ULTIMATE_CODEX.md
          grep -q 'WP-005' SPIDER_ULTIMATE_CODEX.md
          grep -q 'DELETED_RUNS_RECOVERY' SPIDER_ULTIMATE_CODEX.md
          grep -q 'PRODUCT_FEED' SPIDER_ULTIMATE_CODEX.md
          grep -q 'CTO_FEED' SPIDER_ULTIMATE_CODEX.md
          grep -q 'SPIDER Product Engineering' SPIDER_ULTIMATE_CODEX.md
          grep -q 'SPIDER Physics' SPIDER_ULTIMATE_CODEX.md
          grep -q 'SPIDER Graph' SPIDER_ULTIMATE_CODEX.md
          grep -q 'SPIDER Intel' SPIDER_ULTIMATE_CODEX.md
