name: SPIDER Product Supervisor

on:
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "SPIDER Product and Beta Lane"
      - "SPIDER Product Engineering Loop"
      - "SPIDER Product Beta Repair"
      - "SPIDER Product Engineering Failure Review"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-supervisor.yml'
      - 'docs/roles/PRODUCT_FINAL_GATE.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: spider-product-supervisor
  cancel-in-progress: true

jobs:
  ensure_product_continuity:
    name: Ensure Product optimization continuity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover, repair or replan Product until Final Product
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          product_is_final() {
            local raw
            raw=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/product_final.json?ref=lab/product" 2>/dev/null || true)
            [[ -n "$raw" ]] || return 1
            jq -e '.final_product==true and .status=="READY_FOR_HUMAN_HANDOFF" and .independent_audit_pass==true and .baseline_win_audited==true and (.evidence_refs|type=="array" and length>0)' <<<"$raw" >/dev/null 2>&1
          }

          if product_is_final; then
            echo "Final Product gate satisfied; Product autonomous relaunches stop."
            exit 0
          fi

          runs_for() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$1" --limit 50 \
              --json databaseId,status,conclusion,createdAt 2>/dev/null || echo '[]'
          }

          MAIN_RUNS=$(runs_for product-loop.yml)
          ENGINEERING_RUNS=$(runs_for product-engineering-loop.yml)
          REPAIR_RUNS=$(runs_for product-beta-repair.yml)
          FAILURE_REVIEW_RUNS=$(runs_for product-engineering-failure-review.yml)

          ACTIVE_MAIN=$(jq '[.[] | select(.status != "completed")] | length' <<<"$MAIN_RUNS")
          ACTIVE_ENGINEERING=$(jq '[.[] | select(.status != "completed")] | length' <<<"$ENGINEERING_RUNS")
          ACTIVE_REPAIR=$(jq '[.[] | select(.status != "completed")] | length' <<<"$REPAIR_RUNS")
          ACTIVE_FAILURE_REVIEW=$(jq '[.[] | select(.status != "completed")] | length' <<<"$FAILURE_REVIEW_RUNS")
          ENGINEERING_IN_PROGRESS=$(jq '[.[] | select(.status == "in_progress")] | length' <<<"$ENGINEERING_RUNS")

          if [[ "$ENGINEERING_IN_PROGRESS" -gt 0 ]]; then
            while read -r queued_id; do
              [[ -n "$queued_id" ]] || continue
              echo "::warning::Cancelling stale queued historical Product run $queued_id while Product Engineering is in progress."
              gh run cancel "$queued_id" --repo "$GITHUB_REPOSITORY" || true
            done < <(jq -r '.[] | select(.status=="queued" or .status=="pending") | .databaseId' <<<"$MAIN_RUNS")
            echo "Product Engineering is already in progress; supervisor will not duplicate it."
            exit 0
          fi

          if [[ $((ACTIVE_MAIN + ACTIVE_ENGINEERING + ACTIVE_REPAIR + ACTIVE_FAILURE_REVIEW)) -gt 0 ]]; then
            echo "Product work already active/queued; supervisor will not duplicate it."
            exit 0
          fi

          STATE='{}'
          if gh api "repos/${GITHUB_REPOSITORY}/branches/lab%2Fproduct" >/dev/null 2>&1; then
            STATE=$(gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/state/product_direction.json?ref=lab/product" 2>/dev/null || true)
          fi

          BETA_LAUNCH=$(jq -r '.beta_launch // false' <<<"$STATE" 2>/dev/null || echo false)
          WORK_LAUNCH=$(jq -r '.work_launch // false' <<<"$STATE" 2>/dev/null || echo false)

          if [[ "$BETA_LAUNCH" == true && "$WORK_LAUNCH" == true ]]; then
            echo "::error::Invalid Product state: beta_launch and work_launch cannot both be true."
            exit 1
          fi

          LATEST=$(jq -n --argjson main "$MAIN_RUNS" --argjson eng "$ENGINEERING_RUNS" --argjson repair "$REPAIR_RUNS" --argjson fail "$FAILURE_REVIEW_RUNS" \
            '$main + $eng + $repair + $fail | sort_by(.createdAt) | reverse | .[0] // {}')
          LATEST_ID=$(jq -r '.databaseId // empty' <<<"$LATEST")
          LATEST_CONCLUSION=$(jq -r '.conclusion // empty' <<<"$LATEST")

          dispatch_current_product_route() {
            local why="$1"
            if [[ "$BETA_LAUNCH" == true ]]; then
              echo "::warning::Product nonterminal continuity: $why. Dispatching Product/Beta lane from accepted state."
              gh workflow run product-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
            else
              echo "::warning::Product nonterminal continuity: $why. Dispatching Product Engineering decision cycle."
              gh workflow run product-engineering-loop.yml --repo "$GITHUB_REPOSITORY" --ref main
            fi
          }

          if [[ -n "$LATEST_ID" && ( "$LATEST_CONCLUSION" == failure || "$LATEST_CONCLUSION" == cancelled || "$LATEST_CONCLUSION" == timed_out ) ]]; then
            set +e
            LOGS=$(gh run view "$LATEST_ID" --repo "$GITHUB_REPOSITORY" --log 2>&1)
            LOG_RC=$?
            set -e
            if [[ "$LOG_RC" -eq 0 ]] && grep -Eiq '(external_directory|permission requested: external_directory|runner has received a shutdown signal|runner service is stopped|lost communication with the runner|SPIDER_TRANSIENT_OX_EXHAUSTED|OpenCode/Ox.*network|network_error|NetworkError|fetch failed|ECONNRESET|EAI_AGAIN|ENETUNREACH|ENOTFOUND|ETIMEDOUT|service unavailable|bad gateway|gateway timeout|Unexpected server error|SPIDER control-plane overlay restoration left residue)' <<<"$LOGS"; then
              echo "::warning::Product run $LATEST_ID failed operationally; attempting failed-job rerun first."
              gh run rerun "$LATEST_ID" --repo "$GITHUB_REPOSITORY" --failed || true
              sleep 2
              NOW_ACTIVE=$(runs_for product-engineering-loop.yml | jq '[.[] | select(.status != "completed")] | length')
              NOW_ACTIVE=$((NOW_ACTIVE + $(runs_for product-loop.yml | jq '[.[] | select(.status != "completed")] | length')))
              if [[ "$NOW_ACTIVE" -gt 0 ]]; then exit 0; fi
            fi
            dispatch_current_product_route "latest Product run $LATEST_ID ended ${LATEST_CONCLUSION:-unknown}; the failure remains evidence but cannot terminate Product"
            exit 0
          fi

          if [[ "$WORK_LAUNCH" == true ]]; then
            dispatch_current_product_route "accepted Product state contains an unconsumed engineering work request"
          elif [[ "$BETA_LAUNCH" == true ]]; then
            dispatch_current_product_route "accepted Product state contains an authorized beta"
          else
            dispatch_current_product_route "Product is idle and Final Product is false, regardless of prior WAIT_FOR_EVIDENCE or continue=false"
          fi
