name: SPIDER Research Program Supervisor

on:
  workflow_run:
    workflows:
      - SPIDER Graph Lane
      - SPIDER Physics Lane
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/program-supervisor.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: spider-research-program-supervisor
  cancel-in-progress: false

jobs:
  supervise_program_succession:
    name: Supervise Director-recommended programs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main for idempotency receipts
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Launch or reconcile Director-recommended programs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spider/program-receipts

          commit_receipts_if_needed() {
            if ! git diff --quiet -- .spider/program-receipts \
               || [[ -n "$(git ls-files --others --exclude-standard .spider/program-receipts)" ]]; then
              git config user.name "spider-program-supervisor"
              git config user.email "spider-program-supervisor@autonomous.local"
              git add .spider/program-receipts
              if ! git diff --cached --quiet -- .spider/program-receipts; then
                git commit -m "state: reconcile research-program succession"
                git pull --rebase origin main
                git push origin HEAD:main
              fi
            fi
          }

          find_successor_after() {
            local workflow="$1" dispatched_at="$2"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 100 \
              --json databaseId,createdAt,status,conclusion 2>/dev/null \
              | jq --arg t "$dispatched_at" '[.[] | select(.createdAt >= $t)] | sort_by(.createdAt) | first // empty' || true
          }

          find_new_successor() {
            local workflow="$1" before_ids="$2"
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json databaseId,createdAt,status,conclusion 2>/dev/null \
              | jq --argjson before "$before_ids" '[.[] | select(.databaseId as $id | ($before | index($id) | not))] | sort_by(.createdAt) | first // empty' || true
          }

          clear_empty_rerun_of_completed_source() {
            local completed_by="$1" status jobs
            status=$(gh run view "$completed_by" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null || echo unknown)
            if [[ "$status" == completed || "$status" == unknown ]]; then
              return 0
            fi
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${completed_by}/jobs" --jq '.total_count' 2>/dev/null || echo -1)
            if [[ "$jobs" == 0 ]]; then
              echo "::warning::Completed-program source run $completed_by was re-opened as $status with zero jobs; cancelling this empty rerun so it cannot deadlock program succession."
              gh run cancel "$completed_by" --repo "$GITHUB_REPOSITORY" || true
              for _ in $(seq 1 15); do
                sleep 2
                status=$(gh run view "$completed_by" --repo "$GITHUB_REPOSITORY" --json status --jq '.status' 2>/dev/null || echo unknown)
                [[ "$status" == completed ]] && break
              done
            fi
          }

          handle_lane() {
            local lane="$1" branch="$2" state_path="$3" workflow="$4" expected_name="$5"
            local raw status cont completed_by launch program_id title question active receipt note rc
            local receipt_status successor_id dispatched_at candidate before_ids successor_meta successor_status successor_conclusion

            if [[ "$EVENT_NAME" == workflow_run && "$SOURCE_WORKFLOW" != "$expected_name" ]]; then
              return 0
            fi

            set +e
            raw=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${state_path}?ref=${branch}" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null)
            rc=$?
            set -e
            if [[ "$rc" -ne 0 || -z "$raw" ]]; then
              echo "$lane: accepted state unavailable; nothing to do."
              return 0
            fi

            status=$(jq -r '.program_status // empty' <<<"$raw")
            cont=$(jq -r '.continue // false' <<<"$raw")
            completed_by=$(jq -r '.program_completed_by_run_id // empty | tostring' <<<"$raw")
            launch=$(jq -r '.next_program.launch // false' <<<"$raw")
            program_id=$(jq -r '.next_program.id // empty' <<<"$raw")
            title=$(jq -r '.next_program.title // empty' <<<"$raw")
            question=$(jq -r '.next_program.question // empty' <<<"$raw")

            if [[ "$status" != COMPLETE || "$cont" != false || "$launch" != true || -z "$completed_by" || -z "$program_id" || -z "$title" || -z "$question" ]]; then
              echo "$lane: no complete unambiguous next-program recommendation."
              return 0
            fi

            if [[ "$EVENT_NAME" == workflow_run && "$SOURCE_RUN_ID" != "$completed_by" ]]; then
              echo "$lane: completion belongs to run $completed_by, not event run $SOURCE_RUN_ID; refusing mismatched consumption."
              return 0
            fi

            receipt=".spider/program-receipts/${lane}-${completed_by}.json"

            if [[ -f "$receipt" ]]; then
              receipt_status=$(jq -r '.receipt_status // "PENDING"' "$receipt")
              successor_id=$(jq -r '.successor_run_id // empty' "$receipt")
              dispatched_at=$(jq -r '.dispatched_at // empty' "$receipt")

              if [[ -n "$successor_id" ]]; then
                successor_meta=$(gh run view "$successor_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion 2>/dev/null || true)
                if [[ -n "$successor_meta" ]]; then
                  successor_status=$(jq -r '.status // "unknown"' <<<"$successor_meta")
                  successor_conclusion=$(jq -r '.conclusion // ""' <<<"$successor_meta")

                  if [[ "$successor_status" != completed ]]; then
                    jq '.receipt_status="IN_FLIGHT"' "$receipt" > /tmp/receipt.json && mv /tmp/receipt.json "$receipt"
                    echo "$lane: successor run $successor_id is still $successor_status for program $program_id."
                    return 0
                  fi

                  if [[ "$successor_conclusion" == success ]]; then
                    jq '.receipt_status="CONFIRMED"' "$receipt" > /tmp/receipt.json && mv /tmp/receipt.json "$receipt"
                    echo "$lane: successor run $successor_id completed successfully for program $program_id."
                    return 0
                  fi

                  echo "::warning::$lane: successor run $successor_id completed with $successor_conclusion. A failed/cancelled/timed-out successor does NOT consume the program recommendation; clearing receipt for recovery."
                  rm -f "$receipt"
                else
                  echo "::warning::$lane: recorded successor $successor_id no longer exists; clearing stale receipt."
                  rm -f "$receipt"
                fi
              elif [[ -n "$dispatched_at" ]]; then
                candidate=$(find_successor_after "$workflow" "$dispatched_at")
                if [[ -n "$candidate" ]]; then
                  successor_id=$(jq -r '.databaseId' <<<"$candidate")
                  successor_status=$(jq -r '.status // "unknown"' <<<"$candidate")
                  successor_conclusion=$(jq -r '.conclusion // ""' <<<"$candidate")
                  if [[ "$successor_status" != completed || "$successor_conclusion" == success ]]; then
                    jq --argjson successor "$successor_id" '.receipt_status="IN_FLIGHT" | .successor_run_id=$successor' "$receipt" > /tmp/receipt.json
                    mv /tmp/receipt.json "$receipt"
                    echo "$lane: reconciled pending receipt to viable successor run $successor_id."
                    return 0
                  fi
                  echo "::warning::$lane: reconciled candidate $successor_id already ended $successor_conclusion; clearing receipt for a fresh recovery dispatch."
                  rm -f "$receipt"
                else
                  echo "::warning::$lane: pending dispatch produced no successor run; clearing receipt so dispatch can be retried."
                  rm -f "$receipt"
                fi
              else
                echo "::warning::$lane: legacy unconfirmed receipt cannot prove a viable successor; clearing it."
                rm -f "$receipt"
              fi
            fi

            clear_empty_rerun_of_completed_source "$completed_by"

            active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json databaseId,status \
              | jq --argjson completed "$completed_by" '[.[] | select(.databaseId != $completed) | select(.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")] | length')
            if [[ "$active" -gt 0 ]]; then
              echo "$lane: a genuine lane run is already active/queued; schedule will retry after it becomes idle."
              return 0
            fi

            note="AUTO PROGRAM SUCCESSION/RECOVERY from Director run ${completed_by}. Program ${program_id}: ${title}. Question: ${question}. A prior successor may have failed operationally; accepted lane state remains authoritative. Do not reinterpret this note as a demand for a positive result."
            dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            before_ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 --json databaseId --jq '[.[].databaseId]')

            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
              -f human_note="$note" \
              -f cycle_index=1 \
              -f max_cycles=0

            successor_id=""
            for _ in $(seq 1 15); do
              sleep 2
              candidate=$(find_new_successor "$workflow" "$before_ids")
              if [[ -n "$candidate" ]]; then
                successor_id=$(jq -r '.databaseId' <<<"$candidate")
                break
              fi
            done

            if [[ -n "$successor_id" ]]; then
              jq -n \
                --arg lane "$lane" \
                --arg completed_by "$completed_by" \
                --arg program_id "$program_id" \
                --arg title "$title" \
                --arg dispatched_at "$dispatched_at" \
                --argjson successor_run_id "$successor_id" \
                '{lane:$lane,completed_program_run_id:$completed_by,next_program_id:$program_id,next_program_title:$title,dispatched_at:$dispatched_at,receipt_status:"IN_FLIGHT",successor_run_id:$successor_run_id}' > "$receipt"
              echo "$lane: launched $program_id and recorded successor run $successor_id as IN_FLIGHT."
            else
              jq -n \
                --arg lane "$lane" \
                --arg completed_by "$completed_by" \
                --arg program_id "$program_id" \
                --arg title "$title" \
                --arg dispatched_at "$dispatched_at" \
                '{lane:$lane,completed_program_run_id:$completed_by,next_program_id:$program_id,next_program_title:$title,dispatched_at:$dispatched_at,receipt_status:"PENDING",successor_run_id:null}' > "$receipt"
              echo "::warning::$lane: dispatch command returned but no successor run was visible yet; stored PENDING receipt for reconciliation, not consumption."
            fi
          }

          handle_lane graph lab/graph state/graph_loop.json graph-loop.yml "SPIDER Graph Lane"
          handle_lane physics lab/physics state/physics_loop.json physics-loop.yml "SPIDER Physics Lane"
          commit_receipts_if_needed
